# openmui.rules — the build rule of openmui (component-binding §2.3, §10.3):
# a component package's contracts (`contract/*.contract.omui.toml`) become,
# at build time, the C++ partitions and builders it compiles (omui-gen cpp)
# and the script stubs and view-document schema it ships (omui-gen stubs).
# Only build-system code lives here (AGENTS.md: mcpp/ holds build code).
#
#   [build-dependencies]
#   openmui.rules = { path = "…/mcpp/rules", host-module = true }
#
#   // build.mcpp
#   import mcpp;
#   import openmui.rules;
#   int main() { return openmui::rules::components({.module = "acme.ui", .ns = "acme::ui"}) ? 0 : 1; }
[package]
name        = "rules"
namespace   = "openmui"
version     = "0.1.0"
description = "openmui's build rule: contracts to C++ partitions, builders, script stubs and schemas, at build time"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "rules"

# The generator, built for the build machine and handed to the build program
# that uses this rule (a generating rule compiles no device language, so it is
# a plain library of build programs: mcpp's 08-build-rules shape).
[dependencies]
openmui-gen = { path = "../../tools/gen", tools = ["omui-gen"], reexport = true }
