# openmui.rhi.sdl — the first omui.rhi backend: a thin mapping onto SDL_GPU,
# which runs on Vulkan (Linux, Windows, Android; lavapipe on a machine with
# no GPU), Metal (macOS, iOS) and Direct3D 12 (Windows). SDL's headers stay
# in src/native.
[package]
namespace   = "openmui.rhi"
name        = "sdl"
version     = "0.1.0"
description = "omui.rhi on SDL_GPU: Vulkan, Metal and Direct3D 12"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "backend"

[targets.openmui-rhi-sdl]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/native/*.cpp"]

[dependencies]
openmui.rhi    = { path = "../rhi" }
openmui.memory = { path = "../memory" }
mcpplibs.mwrap.sdl3 = "3.4.18"

[dev-dependencies]
openmui.testing = { path = "../../tests/support" }
openmui.rhi.cts = { path = "../rhi-cts" }
mcpplibs.os     = "0.1.2"
