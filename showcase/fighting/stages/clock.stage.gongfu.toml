# 刻's clock tower (the quality design's §5): the inside of a great clock
# at dusk, painted in layers (stages/art, generated and keyed by
# gongfu-studio): the back of the huge glowing dial, rooftops and a teal
# sky beyond it; brass and iron gears meshing at their depths, the long
# pendulum, chains and weights, a catwalk and lamps; old floorboards with a
# brass compass inlaid, long gear shadows; a clockmaker's bench with an
# orrery, and a grandfather clock with ledgers and an hourglass; gears and
# a chain in front. The light comes from the dial behind, amber, and the
# lamps.
gongfu = "0.1"
name = "clock"
sky = ["#10222a", "#3a2a1e"]
floor = "#2a1e16"
line = "#120c08"
marks = false
light = { from = [0.0, -1.0], shadow = "#0c1a20", rim_color = "#ffb860cc", color = "#ffd6a0" }

[[picture]]
name = "far"
file = "art/clock-far.webp"
size = [1152, 768]

[[picture]]
name = "mid"
file = "art/clock-mid.webp"
size = [1152, 768]

[[picture]]
name = "floor"
file = "art/clock-floor.webp"
size = [1152, 300]

[[picture]]
name = "near"
file = "art/clock-near.webp"
size = [1152, 768]

[[picture]]
name = "front"
file = "art/clock-front.webp"
size = [1152, 768]

