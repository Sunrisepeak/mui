# Quay heard (the FPS slice design, F4): each step's events — the rifle, a warden's shot, steps, a warden's servos
# as it walks, a warden falling, a hit, the beacon catching — as sounds in a place (xengine.audio.space) heard at
# the watchkeeper's ears through the containers' steel; the sounds themselves are data (sounds/*.sound.omui.ts).
# It only reads the state: the game is the same with or without it.
[package]
namespace   = "omui.showcase.quay"
name        = "sound"
version     = "0.1.0"
description = "Quay heard: the world's events as sounds in a place, at the watchkeeper's ears, through the containers' steel"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "preview"  # release plan §2.1: stable, preview or experimental (lint maturity)

[targets.quay-sound]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
omui.showcase.quay.sim = { path = "../sim" }
xengine.audio = { path = "../../../modules/projects/xengine/kernel/audio" }
mlibs.math    = { path = "../../../modules/base/math" }

[build-dependencies]
omui.build.embed = { path = "../../../mcpp/embed", host-module = true }

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
mlibs.utils    = { path = "../../../modules/base/utils" }
