# mlibs.rhi.cts — the conformance suite every mlibs.rhi backend runs (level B,
# plan §15): its own Slang shaders, compiled at build time for the target's
# formats (mlibs.shader.rules), and cases that render or dispatch and read
# back what an exact device must produce. A backend's tests call run(device).
[package]
namespace   = "mlibs.rhi"
name        = "cts"
version     = "0.1.0"
description = "The mlibs.rhi backend conformance suite: shaders and cases with exact expected pixels"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"
platforms   = ["linux", "macos", "windows", "emscripten"]

[package.metadata.openmui]
kind = "backend"

[targets.mlibs-rhi-cts]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[build-dependencies]
mlibs.shader.rules = { path = "../../shader/rules", host-module = true }

[dependencies]
mlibs.rhi = { path = ".." }
