# xengine.video — frames and a sound track encoded on exact frame and sample
# counts (D-86): the frame pipeline with "present" swapped for "encode".
# Frames come from a source (the built-in sync card, PNG files, or a host's:
# the omui command line renders an openmui view headless), the sound track
# is xengine.audio's offline render, and frame i carries exactly the samples
# ⌊i·rate·den/num⌋ … ⌊(i+1)·rate·den/num⌋ − 1. Encoders are plugins; built
# in, with no third-party code but openmui.image's PNG: a PNG sequence, Y4M
# (raw YUV 4:2:0, BT.709, integer RGB→YUV) and WAV. Compressed output is a
# plugin package (xengine.video.webm). Descriptions are data
# (`*.video.omui.ts`, read as the JSON it evaluates to).
# An independent component (D-55): the standard library, hanim.core (exact frame
# rates, deterministic math), openmui.image, xengine.audio, mlibs.trace
# (spans in category "video") and mlibs.json.
[package]
namespace   = "xengine"
name        = "video"
version     = "0.1.0"
description = "Frames and a sound track encoded on exact frame and sample counts: PNG sequences, Y4M and WAV built in, codecs as plugins"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"
agent = { library = "encodes and decodes: a function of the frames and bytes given; what plays is its consumer state" }

[targets.openmui-video]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
mlibs.utils = { path = "../../../../base/utils" }
hanim.core               = { path = "../../../hanim/core" }
mlibs.image       = { path = "../../../../base/image" }
xengine.audio       = { path = "../audio" }
mlibs.json          = { path = "../../../../base/json" }

[dev-dependencies]
mcpplibs.mtest = "0.8.3"
