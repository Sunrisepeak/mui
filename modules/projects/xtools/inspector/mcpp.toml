# xtools.inspector — the openmui Inspector (D-61, D-63, D-67), a composition of the toolchain whole (xtools, plan §4.5: it composes hanim.studio and meng.cellular): a tool
# written in openmui that connects to any running openmui application and
# shows its semantic tree, a node's type / source / props / layout / state,
# frame times against the 60 Hz budget, the frame's pipeline, and the
# application's clock — which it can pause, step, slow down and send back in
# time. `omui agent` prints the same data as JSON.
#
#   mcpp run -p xtools.inspector -- [--app org.example.notes] [--agent-dir DIR]
[package]
namespace   = "xtools"
name        = "inspector"
version     = "0.1.0"
description = "The openmui Inspector: semantic tree, node details, frame times, pipeline and time control of a running openmui application"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "product: the inspector program"
lower = ["hanim.studio", "meng.cellular", "meng.cellular.present"]  # lower-labelled parts it uses, each marked in its README
kind = "tool"
agent = { part = "omui.agent" }  # an omui application: its views and its Reaction lab's verbs (inspector.ops.xdef.ts) through the protocol (D-174)

[targets.xtools-inspector-core]
kind = "lib"

[targets.xtools-inspector]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/cellular/*.cppm", "src/cellular/*.cpp", "src/motion/*.cppm", "src/motion/*.cpp", "src/catalog/*.cppm"]

[dependencies]
mcpplibs.cmdline = "0.0.3"
mlibs.utils = { path = "../../../base/utils" }
mlibs.control = { path = "../../../base/control" }
omui.sdk = { path = "../../../projects/omui/sdk" }
mlibs.simulation = { path = "../../../base/simulation" }
meng.cellular = { path = "../../../projects/meng/kernel/cellular" }
"meng.cellular.present" = { path = "../../../projects/meng/kernel/cellular/present" }
# The motion workbench reads, draws and tunes hanim's animation documents.
hanim.studio = { path = "../../../projects/hanim/studio" }
mcpplibs.os = "0.4.4"

[dev-dependencies]
mcpplibs.mtest = "0.8.4"


# The declared data kinds this package owns (mlibs.xdef registry, D-209): each kind and its major
# version, and the define module a data module imports each from (none: only tools write it).
[package.metadata.openmui.xdef]
kinds = { batch = 1, cellular = 1 }
