# 墨's study (书斋), the hardcore combat design's stages: a scholar's pavilion
# at night, painted in layers (stages/art, generated and keyed by
# gongfu-studio): far off, moonlit mountains in ink-wash mist; the study's
# back wall — a moon gate open to the night, paper lattices glowing warm,
# hanging scrolls, red lacquer pillars, lanterns; polished floorboards
# catching the lanterns, spilled ink and loose sheets; at the walls' ends a
# low desk with its ink stone and brushes, a blue-and-white vase with a plum
# branch beside a standing lantern; bamboo blinds hanging in front. The
# fighters stand in the calm middle band; the light comes from the lanterns
# and the moon, upper left.
gongfu = "0.1"
name = "study"
sky = ["#0e1422", "#1b2233"]
floor = "#2a1c14"
line = "#1a110b"
marks = false
light = { from = [-0.7071068, -0.7071068], shadow = "#1d1424", rim_color = "#ffe2b0aa" }

