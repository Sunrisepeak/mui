# A third-party package built with openmui's build plugins (omui.build): its contract is all it writes
# about its component's interface (omui.build.contracts makes the partition, the builder, the stubs and
# the schema: component-binding §2), and its data files are carried in it (omui.build.embed: a tag's
# files with their table, a theme and a behaviour, each a partition holding its file's text). Two
# modules, as two people's packages would have them: acme.ui and acme.data.
[package]
namespace   = "acme"
name        = "plugins"
version     = "0.1.0"
description = "A package whose bindings and carried data files openmui's build plugins make at build time"
license     = "Apache-2.0"

[package.metadata.openmui]
primary-module = "acme.data"  # the fixture's module, as a third party names its own (D-207)
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
kind = "component"

[targets.openmui-plugins-fixture]
kind = "lib"

[build]
sources = ["src/*/*.cppm", "src/*/*.cpp"]

[dependencies]
omui.core = { path = "../../modules/projects/omui/core" }
omui.view = { path = "../../modules/projects/omui/view" }

[build-dependencies]
omui.build = { path = "../../mcpp/build", host-module = true }

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
mlibs.utils       = { path = "../../modules/base/utils" }
omui.host.headless = { path = "../../modules/projects/omui/host/headless" }
