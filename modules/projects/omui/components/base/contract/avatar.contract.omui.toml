# Who: a person's or a thing's picture, else their initials on a colour that
# is theirs (the same name, the same colour, everywhere), and a status dot.
[contract.avatar]
role = "image"
spec = "0.1"
doc  = "Who: a picture, else initials on a colour of the name's own; an optional status dot."

[contract.avatar.props]
name   = { type = "string", default = "", bindable = true, doc = "Whose: the initials and the colour come from it; the accessible name." }
image  = { type = "string", default = "", doc = "A picture by the runtime's image name (Runtime::images); none: the initials." }
size   = { type = "f64", default = 32, doc = "Its diameter, logical pixels." }
shape  = { type = "enum", values = ["circle", "square"], default = "circle" }
status = { type = "enum", values = ["none", "online", "away", "busy", "offline"], default = "none" }

[contract.avatar.parts]
disc     = {}
initials = {}
picture  = {}
status   = {}
