# The components' side-by-side review (compare-v1, D-135; Part 2 plan §2.4).
# Material: tools/eval/materials/controls.sh — ours from site's quality lab,
# Material 3's from Google's @material/web, the same controls in the same
# four states (at rest, under the pointer, pressed, keyboard-focused), the
# same cells and background.
#
#   tools/eval/materials/controls.sh && tools/eval/compare.py sheets components && tools/eval/compare.py judge components

subject = "components"
seed = 1
material = "tools/eval/materials/controls.sh"

[[dimension]]
id = "controls"
question = "Each picture shows one control in four states, left to right: at rest, under the pointer, pressed, keyboard-focused. Which side's control is better crafted across the four states — visual quality, how clearly each state reads, detail and polish?"

[[dimension.pair]]
ours = "target/compare-material/omui/primary.png"
theirs = "target/compare-material/material3/primary.png"
competitor = "material3 (the primary action button)"

