# S5 — openmui's film (D-51; promo-video design): sixty seconds at 60 frames
# a second and a fifteen-second cut, made with openmui. The film is data —
# a timeline a cut (*.timeline.omui.ts), its lines, its score and sounds —
# and scene code: every shot is a live openmui scene drawn on the headless
# host from its own time, so any frame renders on its own, the same bytes
# every time. `omui-promo` renders it (WebM: VP9 and Opus; Y4M; PNG), draws
# a frame, and checks it against the acceptance (§5.1).
#
#   mcpp run --release -p omui.showcase.promo_video -- render promo --out promo.webm
#   mcpp run --release -p omui.showcase.promo_video -- still promo --frame 1800 --out wall.png
#   mcpp run --release -p omui.showcase.promo_video -- check promo
[package]
namespace   = "omui.showcase"
name        = "promo_video"
version     = "0.1.0"
description = "S5, openmui's film: every shot a live openmui scene, the film a timeline, rendered deterministically and checked against its acceptance"
license     = "Apache-2.0"

[package.metadata.openmui]
kind = "showcase"

[targets.openmui-showcase-promo-video]
kind = "lib"

[targets.omui-promo]
kind = "bin"
main = "src/main.cpp"

[build]
sources  = ["src/*.cppm", "src/*.cpp", "src/shots/*.cpp", "code/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
xrender.text = { path = "../../modules/projects/xrender/text" }
hanim.core = { path = "../../modules/projects/hanim/core" }
mlibs.utils = { path = "../../modules/base/utils" }
omui.sdk                         = { path = "../../modules/projects/omui/sdk" }
"omui.theme"                     = { path = "../../modules/projects/omui/theme" }
"omui.theme.styles"                = { path = "../../modules/projects/omui/theme/styles" }
xengine.timeline                    = { path = "../../modules/projects/xengine/timeline" }
"xengine.video"                     = { path = "../../modules/projects/xengine/video" }
"xengine.video.webm"                = { path = "../../modules/projects/xengine/video/webm" }
xengine.audio                       = { path = "../../modules/projects/xengine/audio" }
"omui.ui.canvas"                 = { path = "../../modules/projects/omui/components/canvas" }
omui.ui.timeline                 = { path = "../../modules/projects/omui/components/timeline" }
omui.abi                         = { path = "../../modules/projects/omui/abi" }
"omui.lang"                      = { path = "../../modules/projects/omui/lang" }
"omui.lang.js"                   = { path = "../../modules/projects/omui/lang/js" }
"omui.lang.ts"                   = { path = "../../modules/projects/omui/lang/ts" }  # --dir: an edited data module evaluated
mlibs.json                       = { path = "../../modules/base/json" }
omui.showcase.markdown_wall      = { path = "../markdown-wall" }
omui.showcase.style_gallery      = { path = "../style-gallery" }
"omui.showcase.widget_breakout"  = { path = "../widget-breakout" }
"omui.showcase.widget_breakout.sim" = { path = "../widget-breakout/sim" }
mcpplibs.cmdline                    = "0.0.3"
mcpplibs.os                         = "0.4.2"

[build-dependencies]
omui.build.embed = { path = "../../mcpp/embed", host-module = true }

[dev-dependencies]
mcpplibs.mtest = "0.5.2"
