C2! C2 C3 C2 C2! C2 C3 C2 | A1! A1 A2 A1 A1! A1 A2 A1 |
D2! D2 D3 D2 D2! D2 D3 D2 | Bb1! Bb1 Bb2 Bb1 Bb1! Bb1 Bb2 Bb1 |
G1! G1 G2 G1 G1! G1 G2 G1 | A1! A1 A2 A1 A1! A2 C3 E2 |
"""

