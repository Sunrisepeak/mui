# mlibs.session — sessions as data: a header and a stream of timestamped
# entries (events, actions, frames, notes) in NDJSON, ordered by time and
# seekable, saved and loaded through mcpplibs.os. An independent component
# (D-57): it knows nothing of nodes or views, so anything with a clock can
# record into it and replay from it.
[package]
namespace   = "mlibs"
name        = "session"
version     = "0.1.0"
description = "Recording and replay: timestamped NDJSON sessions, seekable, mergeable, independent of any UI"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "module"

[targets.mlibs-session]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
mcpplibs.os   = "0.4.4"
nlohmann.json = "3.12.0"

[dev-dependencies]
mcpplibs.mtest = "0.7.1"
mlibs.utils = { path = "../utils" }
