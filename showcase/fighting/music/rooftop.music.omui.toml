doc = """坤 Kun's rooftop: blue hour over the city, string lights, a chain-link fence, a
worn hoop in the shadows. A late-night boom-bap beat at 92 in C minor, every
sixteenth swung: a dusty kick and snare with a crisp rim, lazy hats, vinyl dust;
a sine sub that slides like an 808; a Rhodes walking jazzy minor sevenths
(Cm9, Abmaj9, Fm9 and an altered G7); a muted synth hook that says little and
glides into its notes, answered by a pitched vocal-chop pluck; a scratch and a
riser into the sections. Cool and unhurried, never comic — it moves the way he
does, gliding, then the shoulder (铁山靠) lands on the one.

Intensity (0–1) adds parts at the next bar: below 0.35 the hook, the Rhodes
held, the sub held under it and a half-time beat (the rim on three); from 0.35
the Rhodes comping, the sub's line following the kick and the boom-bap beat
(the snare on two and four, ghosted rims, swung hats); from 0.6 the claps and
open hats, the vocal-chop answers, the scratches and risers, the crashes; from
0.85 the chop doubling the hook an octave up, a pad under the Rhodes, a shaker
and hat rolls.

A four-bar intro (a ball dribbled on the court, the Rhodes, then a scratch),
then a loop of 24 bars: the hook (A), its answer (B) through Eb major and an
altered turn, and the hook again higher (C), which stops on the one — a
shoulder's hit — and scratches its way back into the loop's start."""

[music]
name = "rooftop"
tempo = 92
meter = [4, 4]
gain = 0.5

# ── patches ──────────────────────────────────────────────────────────────

# The hook: a pulse with its filter nearly shut, opening on each note and
# closing again — a muted, close-mic'd synth that glides into its slides.
[patch.muted]
base = "pulse_lead"
osc = { width = 0.35, pwm = 0.1, pwm_rate = 0.6 }
amp = { attack = 0.004, decay = 0.4, sustain = 0.4, release = 0.2 }
filter = { cutoff = 1000, q = 1.4, envelope = 1.8, decay = 0.22, sustain = 0.15 }
vibrato = { depth = 9, delay = 0.4 }
glide = 0.07

# The answers: a saw through a fixed band (a vowel, "ah"), short, sliding,
# with a quick vibrato — a pitched vocal chop.
[patch.chop]
base = "saw_lead"
osc = { unison = 2, detune = 6, spread = 0.4, noise = 0.06 }
amp = { attack = 0.004, decay = 0.22, sustain = 0.45, release = 0.09 }
filter = { kind = "bandpass", cutoff = 1150, q = 2.2, envelope = 0.6, keytrack = 0.25, decay = 0.15, sustain = 0 }
vibrato = { depth = 16, rate = 6, delay = 0.12 }
glide = 0.05

# A Rhodes: the e-piano softened (a lower index, a longer ring).
[patch.rhodes]
base = "epiano"
fm = { index = 1.5, sustain = 0.3 }
amp = { decay = 3.2, release = 0.5 }

[patch.warm]
base = "pad"
amp = { attack = 0.8, release = 1.4 }
filter = { cutoff = 650, envelope = 0.8 }

# The sub: a sine with a little drive, so small speakers hear its overtones,
# and an 808's slide.
[patch.sub]
base = "sub_bass"
amp = { release = 0.12 }
drive = 0.25
glide = 0.09

# A record pulled back and forth under the hand: a saw and noise through a
# band that follows the pitch, every note a slide.
[patch.scratch]
engine = "analog"
osc = { wave = "saw", noise = 0.6 }
amp = { attack = 0.002, decay = 0.1, sustain = 0.8, release = 0.03 }
filter = { kind = "bandpass", cutoff = 1400, q = 1.8, keytrack = 1 }
glide = 0.05
drive = 0.3
gain = 0.16

[patch.riser]
engine = "analog"
osc = { wave = "noise" }
amp = { attack = 2.4, decay = 1, sustain = 1, release = 0.06 }
filter = { kind = "bandpass", cutoff = 350, q = 1.4, envelope = 4.5, attack = 2.5, decay = 1, sustain = 1, release = 0.1 }
gain = 0.55

# ── drums: dusty, low-passed, driven ──

[patch.dusty_kick]
base = "kick"
drum = { pitch = 50, from = 3.5, sweep = 0.035, decay = 0.45, click = 0.18 }
filter = { kind = "lowpass", cutoff = 2400 }
drive = 0.4

[patch.boom_snare]
base = "snare"
drum = { pitch = 180, decay = 0.14, noise = 0.85, noise_decay = 0.2, click = 0.15 }
filter = { cutoff = 900 }
drive = 0.3

[patch.rim]
engine = "drum"
drum = { pitch = 1650, from = 1.15, sweep = 0.004, decay = 0.025, modes = 0.8, noise = 0.25, noise_decay = 0.02, click = 0.6 }
filter = { kind = "highpass", cutoff = 900 }
gain = 1

# A basketball on the court's concrete.
[patch.ball]
engine = "drum"
drum = { pitch = 95, from = 1.6, sweep = 0.02, decay = 0.13, modes = 0.5, noise = 0.4, noise_decay = 0.035, click = 0.4 }
filter = { kind = "lowpass", cutoff = 2200 }
gain = 0.6

# Vinyl dust: a click of noise.
[patch.dust]
engine = "drum"
drum = { tone = 0, noise = 1, noise_decay = 0.006, click = 0.3 }
filter = { kind = "highpass", cutoff = 2500 }
gain = 1

# ── instruments ──────────────────────────────────────────────────────────

[instrument.lead]
patch = "muted"
gain = 1.6
pan = -0.05
legato = 0.9
voices = 4
sends = { roof = 0.2, echo = 0.22 }

[instrument.chop]
patch = "chop"
gain = 1.3
pan = 0.3
legato = 0.85
humanize = 0.2
voices = 6
sends = { roof = 0.25, echo = 0.3 }

[instrument.keys]
patch = "rhodes"
bus = "keys"
gain = 0.48
legato = 1
humanize = 0.25
voices = 12
sends = { roof = 0.25 }

[instrument.pad]
patch = "warm"
bus = "keys"
gain = 0.26
legato = 1
voices = 8
sends = { roof = 0.3 }

[instrument.sub]
patch = "sub"
bus = "low"
gain = 0.57
legato = 0.92
voices = 1

[instrument.scratch]
patch = "scratch"
gain = 0.45
pan = 0.15
legato = 1
voices = 1
sends = { roof = 0.15 }

[instrument.riser]
patch = "riser"
gain = 0.3
legato = 1
voices = 1
sends = { roof = 0.4 }

[instrument.kick]
patch = "dusty_kick"
bus = "kick"
gain = 0.9

[instrument.snare]
patch = "boom_snare"
bus = "drums"
gain = 0.46
humanize = 0.15
sends = { roof = 0.2 }

[instrument.clap]
patch = "clap"
bus = "drums"
gain = 0.3
pan = -0.1
sends = { roof = 0.3 }

[instrument.rim]
patch = "rim"
bus = "drums"
gain = 2.5
pan = -0.2
humanize = 0.3
sends = { roof = 0.15 }

[instrument.hat]
patch = "hat"
bus = "drums"
gain = 0.6
pan = 0.25
humanize = 0.4
choke = "hats"

[instrument.open]
patch = "open_hat"
bus = "drums"
gain = 0.25
pan = 0.25
choke = "hats"

[instrument.shaker]
patch = "shaker"
bus = "drums"
gain = 0.35
pan = -0.3
humanize = 0.4

[instrument.crash]
patch = "crash"
bus = "drums"
gain = 0.28
pan = -0.2
sends = { roof = 0.2 }

[instrument.ball]
patch = "ball"
bus = "drums"
gain = 0.7
pan = 0.1
humanize = 0.3
sends = { roof = 0.35 }

[instrument.dust]
patch = "dust"
gain = 0.8
pan = 0.4
humanize = 0.5

# ── the air (the city: a low hum under the beat) ────────

[patch.hum]
engine = "analog"
gain = 0.2
osc = { wave = "noise" }
amp = { attack = 2, decay = 1, sustain = 1, release = 2 }
filter = { kind = "lowpass", cutoff = 420, q = 0.6 }

[instrument.hum]
patch = "hum"
bus = "air"
gain = 2.2
legato = 1
voices = 2

# ── buses ────────────────────────────────────────────────────────────────

# Open air: a short, dark reverb off the city's walls.
[bus.air]
effects = [{ kind = "highpass", cutoff = 120 }]

[bus.roof]
effects = [
    { kind = "reverb", size = 0.62, damping = 0.55, predelay = 0.02, wet = 1, dry = 0 },
    { kind = "highpass", cutoff = 260 },
]

# A dub's dotted-eighth echo, its repeats darkened.
[bus.echo]
effects = [
    { kind = "echo", beats = 0.75, feedback = 0.35, pingpong = true, wet = 1, dry = 0 },
    { kind = "highpass", cutoff = 400 },
    { kind = "lowpass", cutoff = 3800 },
]

# The Rhodes' warble (a slow chorus) and its dust (the top rolled off),
# breathing a little under the kick.
[bus.keys]
effects = [
    { kind = "chorus", delay = 0.012, depth = 0.004, rate = 0.45, wet = 0.6 },
    { kind = "lowpass", cutoff = 4800 },
]
duck = { key = "kick", depth = 0.25, threshold = 0.3, attack = 0.003, release = 0.18 }

[bus.low]
duck = { key = "kick", depth = 0.5, threshold = 0.3, attack = 0.002, release = 0.14 }

[bus.kick]

[bus.drums]

# ── the intro ────────────────────────────────────────────────────────────

# The ball, dribbled slowly, then on the beat, then caught.
[pattern.intro_ball]
step = "1/16"
swing = 0.2

[pattern.intro_ball.lanes]
ball = "x.......x....... | x.......x....... | x...x...x...x... | x...x...x......."
hat  = "................ | ................ | x...x..ox...x..o | x...x..ox......."

# Cm9 | Abmaj9 | Fm9 | G7alt
[pattern.intro_keys]
instrument = "keys"
step = "1/1"
notes = "Bb3+D4+Eb4+G4 | G3+Bb3+C4+Eb4 | Ab3+C4+Eb4+G4 | F3+B3+Eb4+Ab4"

[pattern.intro_sub]
instrument = "sub"
step = "1/1"
notes = "F1 | G1"

# A baby scratch over the second half of a bar, back and forth.
[pattern.scratch]
instrument = "scratch"
step = "1/32"
notes = ".:16 G4>D6:2! D6>A4:2 . A4>E6? E6>C4:3 . G4>C6:2! C6>F4:2 . ."

# One on the last beat, into the next bar.
[pattern.scratch_short]
instrument = "scratch"
step = "1/32"
notes = ".:24 G4>D6:2! D6>A4:2 . A4>E6? E6>C4:2"

[pattern.rise]
instrument = "riser"
step = "1/16"
notes = "C5:16"

# ── the hook (the muted synth) ───────────────────────────────────────────

[pattern.hook_a]
instrument = "lead"
step = "1/16"
swing = 0.2
notes = """
. . G4? Bb4 C5:3! . Eb5:2 D5:4 . . |
C5:2! . Bb4 G4:4 . . . . . . Eb4? F4 |
G4:3! Ab4 G4:2 F4? Eb4:4 . . . . . |
F4:2 . G4>B4:6! . . . . . D5? . |
. . G4? Bb4 C5:3! . Eb5:2 G5:4 F5? Eb5? |
Eb5:2! . C5 Bb4:4 . . . . G4? Bb4 C5 Eb5? |
F5:3! Eb5 C5:2 Ab4? G4:4 . . . . . |
B4:2! D5:2 F5:2 Ab5>G5:8 . . |
"""

[pattern.hook_b]
instrument = "lead"
step = "1/16"
swing = 0.2
notes = """
Bb4:2! D5:2 F5:4 . . . . Eb5? D5 Bb4:2 |
C5:6! . . . . . . G4? Bb4 C5? . |
D5:3! F5 Ab5:4 G5? F5? D5:2 . . . . |
B4:4! . . D5? F5 Eb5:6 . . |
G5:3! F5 Eb5:2 D5:2 C5:6 . . |
Db5:2! C5 Bb4? Ab4:4 . . . . F4? Ab4 Bb4 C5 |
Eb5:3! C5 Bb4:2 G4:6 . . . . |
Ab4? B4 D5 F5 Ab5:4! G5:6 . . |
"""

[pattern.hook_c]
instrument = "lead"
step = "1/16"
swing = 0.2
notes = """
. . C5? Eb5 G5:3! . Bb5:2 G5:4 F5? Eb5? |
Eb5:2! . C5 Bb4:4 . . . . G4? Bb4 C5 D5? |
Eb5:3! F5 Eb5:2 C5? Ab4:4 . . . . . |
B4:2! D5:2 F5:2 Ab5>G5:8 . . |
G5:3! Bb5 C6:2 Bb5? G5:4 . . F5? Eb5? . |
Eb5:2! F5 G5? Bb5:4 . . . . C6? Bb5 G5 Eb5? |
F5:3! Eb5 C5:2 Eb5? F5:2 G5:2 Ab5:3 . . |
G5:4! . . . . . . . . . . . . |
"""

# ── the vocal chop's answers, in the hook's gaps ─────────────────────────

[pattern.chop_a]
instrument = "chop"
step = "1/16"
swing = 0.2
notes = """
.:16 | .:10 G5? Bb5 C6:2! Bb5? G5? |
.:16 | .:11 D6>C6:3! Bb5? G5? |
.:16 | .:10 Eb6? D6 C6:2! Bb5? G5? |
.:12 C6? Eb6 F6>G6:2! | .:12 D6? F6 Ab6>G6:2! |
"""

[pattern.chop_b]
instrument = "chop"
step = "1/16"
swing = 0.2
notes = """
.:12 F5? G5 Bb5:2! | .:10 Eb6>D6:2! C6? Bb5 G5:2 |
.:12 C6? D6 F6:2! | .:10 F6>Eb6:2! D6? B5 G5:2 |
.:12 Bb5? C6 Eb6:2! | .:10 F6>Eb6:2! Db6? C6 Ab5:2 |
.:12 G5? Bb5 C6:2! | .:8 D6? F6 Ab6>G6:4! . . |
"""

# ── harmony: the Rhodes ──────────────────────────────────────────────────

# Cm9 | Abmaj9 | Fm9 | G7alt (b9, #9, b13), twice: held while it is calm.
[pattern.keys_hold_a]
instrument = "keys"
step = "1/1"
notes = """
Bb3+D4+Eb4+G4 | G3+Bb3+C4+Eb4 | Ab3+C4+Eb4+G4 | F3+B3+Eb4+Ab4 |
Bb3+D4+Eb4+G4 | G3+Bb3+C4+Eb4 | Ab3+C4+Eb4+G4 | F3+B3+Eb4+Ab4 |
"""

# The same, comped: the one, a push on the and of two, a late one after three.
[pattern.keys_a]
instrument = "keys"
step = "1/16"
swing = 0.2
notes = """
Bb3+D4+Eb4+G4:6! Bb3+D4+Eb4+G4:5? Bb3+D4+Eb4+G4:5 |
G3+Bb3+C4+Eb4:10! . . G3+Bb3+C4+Eb4:4? |
Ab3+C4+Eb4+G4:6! Ab3+C4+Eb4+G4:5? Ab3+C4+Eb4+G4:5 |
F3+B3+Eb4+Ab4:10! . . F3+B3+Eb4+Ab4:4? |
Bb3+D4+Eb4+G4:6! Bb3+D4+Eb4+G4:5? Bb3+D4+Eb4+G4:5 |
G3+Bb3+C4+Eb4:10! . . G3+Bb3+C4+Eb4:4? |
Ab3+C4+Eb4+G4:6! Ab3+C4+Eb4+G4:5? Ab3+C4+Eb4+G4:5 |
F3+B3+Eb4+Ab4:6! F3+B3+Eb4+Ab4:4? F3+B3+Eb4+Ab4:6 |
"""

# Ebmaj9 | Abmaj9 | Dm7b5 | G7alt | Cm9 | Bbm9 | Abmaj9 | G7alt
[pattern.keys_hold_b]
instrument = "keys"
step = "1/1"
notes = """
G3+Bb3+D4+F4 | G3+Bb3+C4+Eb4 | C4+D4+F4+Ab4 | B3+Eb4+F4+Ab4 |
Bb3+D4+Eb4+G4 | Ab3+C4+Db4+F4 | G3+Bb3+C4+Eb4 | F3+B3+Eb4+Ab4 |
"""

[pattern.keys_b]
instrument = "keys"
step = "1/16"
swing = 0.2
notes = """
G3+Bb3+D4+F4:6! G3+Bb3+D4+F4:5? G3+Bb3+D4+F4:5 |
G3+Bb3+C4+Eb4:10! . . G3+Bb3+C4+Eb4:4? |
C4+D4+F4+Ab4:6! C4+D4+F4+Ab4:5? C4+D4+F4+Ab4:5 |
B3+Eb4+F4+Ab4:10! . . B3+Eb4+F4+Ab4:4? |
Bb3+D4+Eb4+G4:6! Bb3+D4+Eb4+G4:5? Bb3+D4+Eb4+G4:5 |
Ab3+C4+Db4+F4:10! . . Ab3+C4+Db4+F4:4? |
G3+Bb3+C4+Eb4:6! G3+Bb3+C4+Eb4:5? G3+Bb3+C4+Eb4:5 |
F3+B3+Eb4+Ab4:6! F3+B3+Eb4+Ab4:4? F3+B3+Eb4+Ab4:6 |
"""

# A's chords, stopping on the last bar's one.
[pattern.keys_hold_c]
instrument = "keys"
step = "1/4"
notes = """
Bb3+D4+Eb4+G4:4 | G3+Bb3+C4+Eb4:4 | Ab3+C4+Eb4+G4:4 | F3+B3+Eb4+Ab4:4 |
Bb3+D4+Eb4+G4:4 | G3+Bb3+C4+Eb4:4 | Ab3+C4+Eb4+G4:4 | F3+B3+Eb4+Ab4! . . . |
"""

[pattern.keys_c]
instrument = "keys"
step = "1/16"
swing = 0.2
notes = """
Bb3+D4+Eb4+G4:6! Bb3+D4+Eb4+G4:5? Bb3+D4+Eb4+G4:5 |
G3+Bb3+C4+Eb4:10! . . G3+Bb3+C4+Eb4:4? |
Ab3+C4+Eb4+G4:6! Ab3+C4+Eb4+G4:5? Ab3+C4+Eb4+G4:5 |
F3+B3+Eb4+Ab4:10! . . F3+B3+Eb4+Ab4:4? |
Bb3+D4+Eb4+G4:6! Bb3+D4+Eb4+G4:5? Bb3+D4+Eb4+G4:5 |
G3+Bb3+C4+Eb4:10! . . G3+Bb3+C4+Eb4:4? |
Ab3+C4+Eb4+G4:6! Ab3+C4+Eb4+G4:5? Ab3+C4+Eb4+G4:5 |
F3+B3+Eb4+Ab4:4! .:12 |
"""

# ── the sub (it follows the kick, sliding down at a turn) ────────────────

[pattern.sub_hold_a]
instrument = "sub"
step = "1/1"
notes = "C2 | Ab1 | F1 | G1 | C2 | Ab1 | F1 | G1"

[pattern.sub_a]
instrument = "sub"
step = "1/16"
swing = 0.2
notes = """
C2:6! C2:4 C2:4 Bb1:2 | Ab1:10! Ab1:3 Bb1:3 | F1:6! F1:4 F2:4 C2:2 | G1:10! G1:3 G2>G1:3 |
C2:6! C2:4 C2:4 Eb2:2 | Ab1:10! Ab1:3 C2:3 | F1:6! F1:4 Eb2:4 D2:2 | G1:10! B1:3 G2>G1:3 |
"""

[pattern.sub_hold_b]
instrument = "sub"
step = "1/1"
notes = "Eb2 | Ab1 | D2 | G1 | C2 | Bb1 | Ab1 | G1"

[pattern.sub_b]
instrument = "sub"
step = "1/16"
swing = 0.2
notes = """
Eb2:6! Eb2:4 Eb2:4 D2:2 | Ab1:10! Ab1:3 Bb1:3 | D2:6! D2:4 D2:4 C2:2 | G1:10! G1:3 G2>G1:3 |
C2:6! C2:4 C2:4 Bb1:2 | Bb1:10! Bb1:3 Ab1:3 | Ab1:6! Ab1:4 Eb2:4 D2:2 | G1:10! G1:3 G2>G1:3 |
"""

[pattern.sub_hold_c]
instrument = "sub"
step = "1/4"
notes = "C2:4 | Ab1:4 | F1:4 | G1:4 | C2:4 | Ab1:4 | F1:4 | G1! . . ."

[pattern.sub_c]
instrument = "sub"
step = "1/16"
swing = 0.2
notes = """
C2:6! C2:4 C2:4 Bb1:2 | Ab1:10! Ab1:3 Bb1:3 | F1:6! F1:4 F2:4 C2:2 | G1:10! G1:3 G2>G1:3 |
C2:6! C2:4 C2:4 Eb2:2 | Ab1:10! Ab1:3 C2:3 | F1:6! F1:4 Eb2:4 D2:2 | G2>G1:4! .:12 |
"""

# ── drums (sixteenths, swung) ────────────────────────────────────────────

[pattern.dust]
step = "1/16"
swing = 0.2

[pattern.dust.lanes]
dust = "..o.......o..o.. | o.....o......o.. | ....o..o........ | .o.......o....o."

# Half time: the kick, the rim on three, lazy hats.
[pattern.beat_calm]
step = "1/16"
swing = 0.2

[pattern.beat_calm.lanes]
kick = "x.........x....."
rim  = "........x......."
hat  = "x...x..ox...x..o"

# Boom-bap: the snare on two and four, the rim ghosting, the hats swung.
[pattern.beat_main]
step = "1/16"
swing = 0.2

[pattern.beat_main.lanes]
kick  = "x.....x...x..... | x.........x..x.."
snare = "....X.......X... | ....X.......X..."
rim   = "...o.......o.... | ...o.....o.....o"
hat   = "x.xox.x.x.xox.x. | x.xox.x.x.xox.xo"

[pattern.beat_main_1]
step = "1/16"
swing = 0.2

[pattern.beat_main_1.lanes]
kick  = "x.....x...x....."
snare = "....X.......X..."
rim   = "...o.......o...."
hat   = "x.xox.x.x.xox.x."

[pattern.fill_main]
step = "1/16"
swing = 0.2

[pattern.fill_main.lanes]
kick  = "x.....x...x..x.."
snare = "....x.....o.X.oX"
hat   = "x.xo..x.x.x....."

# The full beat: claps on the snare, open hats, a busier kick.
[pattern.beat_full]
step = "1/16"
swing = 0.2

[pattern.beat_full.lanes]
kick  = "x.....x...x..... | x.......x.x..x.."
snare = "....X.......X... | ....X.......X..o"
clap  = "....x.......x... | ....x.......x..."
rim   = "...o.......o.... | ...o.....o......"
hat   = "x.xox.x.x.xox... | x.xox.x.x.xox..."
open  = "..............x. | ..............x."

[pattern.beat_full_1]
step = "1/16"
swing = 0.2

[pattern.beat_full_1.lanes]
kick  = "x.....x...x....."
snare = "....X.......X..."
clap  = "....x.......x..."
rim   = "...o.......o...."
hat   = "x.xox.x.x.xox..."
open  = "..............x."

[pattern.fill_full]
step = "1/16"
swing = 0.2

[pattern.fill_full.lanes]
kick  = "x.....x...x..x.."
snare = "....x.....o.X.oX"
clap  = "....x.......x..."
hat   = "x.xo..x.x.x....."

# Under a super: a shaker on every sixteenth, swung.
[pattern.shaker]
step = "1/16"
swing = 0.2

[pattern.shaker.lanes]
shaker = "oxoxoxoxoxoxoxox"

# A hat roll on the bar's last beat (thirty-seconds, straight).
[pattern.roll]
step = "1/32"

[pattern.roll.lanes]
hat = "........................xxxxxxxX"

# The shoulder lands: everything on the one, then nothing but the scratch.
[pattern.stop]
step = "1/16"

[pattern.stop.lanes]
kick  = "X..............."
crash = "X..............."

[pattern.crash]
step = "1/16"

[pattern.crash.lanes]
crash = "X..............."

# ── the outro ────────────────────────────────────────────────────────────

[pattern.end_lead]
instrument = "lead"
step = "1/16"
swing = 0.2
notes = ". . G4? Bb4 C5:12! | .:16"

[pattern.end_keys]
instrument = "keys"
step = "1/1"
notes = "Bb3+D4+Eb4+G4:2"

[pattern.end_sub]
instrument = "sub"
step = "1/1"
notes = "C2 | ."

[pattern.end_hit]
step = "1/16"

[pattern.end_hit.lanes]
kick  = "x............... | ................"
crash = "X............... | ................"

[pattern.air]
instrument = "hum"
step = "1/16"
notes = "C3:16"

