outline = { color = "#101114", width = 2.5 }
accent = "#d4a640"
art_scale = 0.32
trail = { color = "#d4a640", frames = [3, 6], alpha = 0.22 }
light = { from = [-0.62, -0.78], shade = 0, darken = 0.3, shadow = "#1a1a22", rim = 0, rim_color = "#fff2c4aa" }

