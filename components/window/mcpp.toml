# openmui.ui.window — the framework's own window frame (D-75): `window_frame`,
# the shadow, rounded edge, title bar and buttons of a framework-drawn window
# (only its content in a native one), and `caption_button`, its minimize,
# maximize, restore and close buttons. Contract-first: contract/*.contract.omui.toml
# become the bases, builders, stubs and schema when it builds (openmui.rules).
# The window's state and operations are openmui.view's (`window()`, the
# window.* verbs); a host makes them real.
[package]
namespace   = "openmui.ui"
name        = "window"
version     = "0.1.0"
description = "The framework's own window frame: shadow, edge, title bar and caption buttons that follow the window's state"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "component"

[targets.openmui-ui-window]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
openmui.core    = { path = "../../runtime/core" }
openmui.view    = { path = "../../runtime/view" }
openmui.render  = { path = "../../modules/render" }
openmui.ui.base = { path = "../base" }

[build-dependencies]
openmui.rules = { path = "../../mcpp/rules", host-module = true }

[dev-dependencies]
openmui.testing       = { path = "../../tests/support" }
openmui.host.headless = { path = "../../hosts/headless" }
openmui.semantic      = { path = "../../runtime/semantic" }
openmui.i18n.cldr     = { path = "../../i18n/cldr" }
