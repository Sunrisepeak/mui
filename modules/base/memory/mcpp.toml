# mlibs.memory — the frame arena, generational handles and slot maps, and
# FunctionRef. Standard library only.
[package]
namespace   = "mlibs"
name        = "memory"
version     = "0.1.0"
description = "Frame arena, generational handles, slot maps and FunctionRef"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"

[targets.mlibs-memory]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dev-dependencies]
mlibs.testing = { path = "../testing" }
