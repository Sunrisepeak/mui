doc = """What the breakout sounds like (openmui.audio): each brick as the component
it is — a button's click, a switch's two-tone flip, a slider's tick down — a
pop when one breaks (higher with the combo, the program pitches it), the
paddle's knock, the walls', a capsule's chime and its catch, a ball lost, a
level cleared, a launch, a gate opening, a rewind."""

