# xtools — the toolchain whole (convergence plan §4.5, D-203, D-208): one entry over every project's toolkit. A thin
# composition: each toolkit's library and catalog are its own project's (omui.cli, hanim.studio, hanim.timeline.tool,
# mrender.tool, gongfu.studio); this program puts their subjects in one session of the tool kernel (mlibs.agent, T0).
[package]
name        = "xtools"
version     = "0.1.0"
description = "The toolchain whole: one command and one MCP server over every project's toolkit (internal code name)"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "experimental"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "product: the xtools command over every toolkit"
kind = "tool"
reexports = ["mlibs.agent"]  # what its interface re-exports (lint module-closure)
agent = { library = "a composition: each toolkit's subject and catalog are its own project's package (omui.cli, hanim.studio, hanim.timeline.tool, mrender.tool, gongfu.studio)" }

[targets.xtools-core]
kind = "lib"

[targets.xtools]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
mlibs.text.fonts = { path = "../../content/text/fonts" }  # every script it shows carried with it (D-214)
mlibs.agent           = { path = "../../base/agent" }
"omui.cli"            = { path = "../omui/tools/cli" }
"hanim.studio"        = { path = "../hanim/studio" }
"hanim.timeline.tool" = { path = "../hanim/timeline/tool" }
"mrender.tool"        = { path = "../mrender/tool" }
"gongfu.studio"       = { path = "../gongfu/studio" }
"xtools.audition"     = { path = "audition" }
# films (films.cpp): the video toolkit with omui's sources — a view's frames on a headless host, its data kinds
meng.video          = { path = "../meng/kernel/video" }
"meng.video.tool"   = { path = "../meng/kernel/video/tool" }
"omui.core"            = { path = "../omui/core" }
"omui.viewdoc"         = { path = "../omui/viewdoc" }
"omui.host.headless"   = { path = "../omui/host/headless" }
"omui.lang.ts"         = { path = "../omui/lang/ts" }
"omui.ui.base"         = { path = "../omui/components/base" }
"omui.ui.markdown"     = { path = "../omui/components/markdown" }
mcpplibs.os           = "0.4.4"

[test]
programs = "directory"  # tests/tool/: one program, each file run and filtered as before (not named as the program `xtools`: mcpp#1028)

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
# workspace_test: the interface's and hanim's design adapters in one workspace (RC3.10's bar).
mlibs.agent.cts = { path = "../../base/agent/cts" }
mlibs.json      = { path = "../../base/json" }
"omui.designer" = { path = "../omui/designer" }
"omui.ui.base"  = { path = "../omui/components/base" }
