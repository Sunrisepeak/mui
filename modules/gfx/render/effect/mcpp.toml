# openmui.render.effect — a program's own pixel effects (D-60, D-68; architecture
# §8: "a third party's shader uses the effect template only"): a
# `<name>.effect.omui.toml` names the effect, its parameters and its Slang
# shader, written against the template openmui.render carries; the library
# compiles it for the device (openmui.shader), registers it with the renderer's
# effects, and loads it again when it — or anything the shader imports —
# changes, without the program changing a line of C++.
[package]
namespace   = "openmui.render"
name        = "effect"
version     = "0.1.0"
description = "A program's own Slang pixel effects from *.effect.omui.toml: checked, compiled for the device, registered and reloaded while it runs"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "module"

[targets.openmui-effect]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/native/*.cpp"]

[dependencies]
openmui.render.vector = { path = "../vector" }
openmui.rhi    = { path = "../../rhi" }
openmui.shader = { path = "../../shader" }
openmui.trace  = { path = "../../../base/trace" }
marzer.tomlplusplus = "3.4.0"

[dev-dependencies]
openmui.testing = { path = "../../../base/testing" }
openmui.raster  = { path = "../../raster" }
openmui.geom    = { path = "../../../base/geom" }
openmui.rhi.sdl = { path = "../../rhi/sdl" }
mcpplibs.os     = "0.1.2"
