# Example 02 — hello, TypeScript (canvas-markdown §5): an application written
# in TypeScript alone, no C++ to write. The player (omui.entry.player) reads the
# manifest below, blanks logic/main.ts's types (omui.lang.ts) and runs it; a saved
# file shows at once. The tool: statistics of a text — characters, words,
# sentences, reading time — as you type or paste.
#
#   mcpp run                       a window
#   mcpp run -- --headless --png stats.png
[package]
namespace   = "omui.example"
name        = "hello-ts"
version     = "0.1.0"
description = "openmui example 02: a text-statistics tool written in TypeScript, run by the player"
license     = "Apache-2.0"

[package.metadata.openmui]
kind  = "app"
id    = "org.openmui.text-stats"
title = "Text statistics"
size  = "480x320"

# The scripts, by name (run in the names' order); the language comes from the
# extension unless `lang` says it.
[package.metadata.openmui.scripts]
main = "logic/main.ts"

[targets.text-stats]
kind = "bin"
main = { from = "omui.entry.player/player" }

[dependencies]
omui.entry.player = { path = "../../src/entry/player" }

[dev-dependencies]
mcpplibs.mtest = "0.7.1"
mlibs.utils = { path = "../../modules/base/utils" }
omui.player  = { path = "../../modules/projects/omui/player" }
omui.lang.js = { path = "../../modules/projects/omui/lang/js" }
# generation_e2e_test reads the application as an agent does.
omui.agent = { path = "../../modules/projects/omui/agent" }
