# openmui's website (D-84 §6.6): the framework's thesis shown, not told —
# one semantic tree, many renderings. Places in a bar (the home, every
# component live, the docs in English and 中文, example 01 beside its
# source, a live timeline editor), each a page in the site's own theme; a
# lens moving the same page from its pixels to the semantic tree's
# wireframe, the JSON an agent reads and the assertions a test writes; the
# tree's hash in your browser beside CI's. Built for the Web (dist-toy's
# package, which a Pages subpath serves as it is), its places pre-rendered to
# static HTML from the same documents so a reader without JavaScript and a
# search engine see them.
#
#   mcpp run -p openmui.site                       the site in a window
#   mcpp run -p openmui.site -- --prerender out/index.html   its places into a packed page
[package]
namespace   = "openmui"
name        = "site"
version     = "0.1.0"
description = "openmui's website: one semantic tree, many renderings — places, a lens, the docs, a live work"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind      = "site"
contracts = ["contract/*.contract.omui.toml"]

[targets.openmui-site]
kind = "lib"

[targets.omui-site]
kind = "bin"
main = "src/main.cpp"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
openmui.sdk         = { path = ".." }
openmui.ui.markdown = { path = "../components/markdown" }
openmui.ui.timeline = { path = "../components/timeline" }
openmui.timeline    = { path = "../modules/media/timeline" }  # the monitor: what plays at the playhead
openmui.theme.styles = { path = "../modules/ui/theme/styles" }
"openmui.theme"      = { path = "../modules/ui/theme" }
openmui.example.hello-im       = { path = "../examples/01-hello-im" }  # getting started: example 01, running beside its source
openmui.semantic    = { path = "../modules/ui/semantic" }
openmui.trace       = { path = "../modules/base/trace" }
openmui.hash        = { path = "../modules/base/hash" }

[build-dependencies]
openmui.build.contracts = { path = "../mcpp/contracts", host-module = true }
openmui.build.embed     = { path = "../mcpp/embed", host-module = true }
openmui.build.toy       = { path = "../mcpp/toy", host-module = true }

[dev-dependencies]
openmui.testing = { path = "../modules/base/testing" }
