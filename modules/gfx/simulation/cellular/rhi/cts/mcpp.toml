[package]
namespace = "xengine.simulation.cellular.rhi"
name = "cts"
version = "0.1.0"
description = "Integer cellular CPU/GPU conformance on a caller-provided RHI device"
license = "Apache-2.0"
platforms = ["linux", "macos", "windows", "emscripten"]
repo = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "backend"

[targets.xengine-simulation-cellular-rhi-cts]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
"xengine.simulation.cellular" = { path = "../../../../../base/simulation/cellular" }
"xengine.simulation.cellular.rhi" = { path = ".." }
mlibs.rhi = { path = "../../../../rhi" }
mlibs.utils = { path = "../../../../../base/utils" }
