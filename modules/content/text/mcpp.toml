# mlibs.text — fonts, shaping, bidi, line breaking, paragraphs, glyphs as
# geometry (outlines, colour layers) and the editing model, over HarfBuzz and
# SheenBidi as C++ modules (mcpp-index's mwrap) and mlibs.unicode. It knows no
# renderer: xrender.text rasterises and draws its glyphs (plan §5.3).
[package]
namespace   = "mlibs"
name        = "text"
version     = "0.1.0"
description = "Text engine: font fallback, HarfBuzz shaping, bidi, UAX #14 line breaking, paragraphs, carets, glyph outlines, editing"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"

[targets.mlibs-text]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp", "src/native/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
mlibs.geom    = { path = "../../base/geom" }
mlibs.unicode = { path = "../../base/unicode" }
mcpplibs.os     = "0.4.4"
mcpplibs.mwrap.harfbuzz = "14.3.0"
mcpplibs.mwrap.sheenbidi = "3.0.0"

[dev-dependencies]
mcpplibs.mtest = "0.5.2"
mlibs.utils = { path = "../../base/utils" }
mlibs.image   = { path = "../../base/image" }

