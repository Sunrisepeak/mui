G5:3! A5 C6:2 A5:2 G5:4 E5? G5 A5:2 |
A5>C6:6! A5? G5? E5:4 D5:2 E5:2 |
D5:3! F5? G5:2 A5:4 C6 A5? G5:2 F5:2 |
F5:2! G5:2 A5:4 D6:6 C6:2 |
C6>D6:3! C6? A5:2 G5:2 F5:4 G5:2 A5:2 |
A5:10! . . D5? F5? G5 A5 |
"""

