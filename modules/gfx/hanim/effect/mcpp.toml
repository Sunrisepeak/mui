[package]
namespace = "hanim"
name = "effect"
version = "0.1.0"
description = "Owned ordered effect parameter plans with pure caller-buffer sampling"
license = "Apache-2.0"
platforms = ["linux", "macos", "windows", "emscripten"]
repo = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"

[targets.hanim-effect]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
hanim.core = { path = "../../../base/hanim/core" }
openmui.log = { path = "../../../base/log" }
openmui.trace = { path = "../../../base/trace" }

[dev-dependencies]
openmui.testing = { path = "../../../base/testing" }
