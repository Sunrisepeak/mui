# omui.gen — the generator: spec/registry and *.contract.xdef.ts to
# openmui.h, the openmui.spec partitions, component partitions, script
# builders, schemas and reference tables (implementation plan §4.2).
#
# A build-machine tool: openmui's build plugins (mcpp/) run it from component and application
# builds; spec/ commits its outputs and CI checks they are current.
[package]
namespace   = "omui"
name        = "gen"
version     = "0.1.0"
description = "The openmui generator: registry and contracts to C ABI, C++ partitions, script stubs, schemas and docs"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
lower = ["mlibs.xdef.tool"]  # lower-labelled parts it uses, each marked in its README
separate = "build-stage: omui-gen, contracts and data to code at build time"
kind = "tool"
agent = { part = "omui.agent" }  # the generator behind `omui` and the build plugins; reached as omui.agent's generation operations (D-174)

[targets.omui-gen]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
mlibs.utils = { path = "../../../../base/utils" }
mlibs.text.subset = { path = "../../../../content/text/subset" }  # the faces a page delivers, cut to what it shows (the packer)
omui.lang.ts = { path = "../../lang/ts" }
mlibs.ts = { path = "../../../../base/ts" }  # closure: a script's imports, read without running it (B7b)
mlibs.json = { path = "../../../../base/json" }
mlibs.xdef = { path = "../../../../base/xdef" }  # a snapshot's format checked first (D-209)
"mlibs.xdef.tool" = { path = "../../../../base/xdef/tool" }  # the embed emitters (D-73), one owner
nlohmann.json       = "3.12.0"
marzer.tomlplusplus = "3.4.0"  # a page carries an application's mcpp.toml as its JSON snapshot (dist-toy)
mcpplibs.cmdline    = "0.0.3"
mcpplibs.os         = "0.4.8"  # the packer runs Binaryen's wasm-opt and wasm-split (a world in parts)

[test]
programs = "directory"  # tests/gen/: one program, each file run and filtered as before

[dev-dependencies]
"mlibs.text.harfbuzz" = { path = "../../../../content/text/harfbuzz" }  # the shaper its tests draw text with (mlibs.text's slot)
mcpplibs.mtest = "0.11.3"
mrender.text = { path = "../../../mrender/text" }
mlibs.text    = { path = "../../../../content/text" }

# The declared data kinds this package owns (mlibs.xdef registry, D-209): each kind and its major
# version, and the define module a data module imports each from (none: only tools write it).
[package.metadata.openmui.xdef]
kinds = { toy = 1, closure = 1 }
