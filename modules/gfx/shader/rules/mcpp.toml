# openmui.shader.rules — a package's Slang shaders compiled in its build:
# each `shaders/*.slang` becomes the module partition `<module>:<stem>_shaders`
# of rhi::ShaderDesc constants, for the formats the build's target takes
# (omui-shader, built for the build machine). Only build-system code.
#
#   [build-dependencies]
#   openmui.shader.rules = { path = "…/modules/gfx/shader/rules", host-module = true }
#
#   // build.mcpp
#   import mcpp;
#   import openmui.shader.rules;
#   int main() { return openmui::shader::rules::shaders({.module = "acme.render"}) ? 0 : 1; }
[package]
name        = "rules"
namespace   = "openmui.shader"
version     = "0.1.0"
description = "Build rule: a package's Slang shaders to omui.rhi shader descriptions, at build time"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "rules"

[dependencies]
openmui.shader = { path = "..", tools = ["omui-shader"], reexport = true }
