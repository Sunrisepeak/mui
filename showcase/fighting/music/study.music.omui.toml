C5:4! A4:2 C5:2 F5:6 G5:2 |
E5:4! D5:2 C5:2 G4:8 |
F5:4! D5:2 F5:2 Bb5:4 A5:2 F5:2 |
G5:12! . . E5? F5 |
A5:4! G5:2 F5:2 C6:6 A5:2 |
G5:4! E5:2 G5:2 C6:4 D6:4 |
D6>F6:4! D6:2 C6:2 Bb5:4 A5:2 F5:2 |
E5:4! G5:4 A5:8 |
"""

[pattern.hook_c]
instrument = "lead"
step = "1/16"
notes = """
D6:3! F6 D6:2 C6:2 A5:4 C6:2 D6:2 |
E6:4! D6:2 C6:2 G5:4 A5:2 C6:2 |
D5:3! F5? G5:2 A5:6 G5? F5? D5:2 |
A5>C6:4! D6:4 F6:4 D6:4 |
F6:3! D6 C6:2 A5:2 D6:8 |
E6:3! D6 C6:2 G5:2 C6:8 |
D6:4! A5:4 G5:4 E5:4 |
A5:8! . . . . . . . . |
"""

[pattern.bell_d]
