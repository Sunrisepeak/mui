# openmui.lang.js — JavaScript (and TypeScript compiled to it) on the Script
# Binding Profile, with QuickJS-ng (component-binding §7): the `openmui`
# ES module (builders, signals, expressions, regions, verbs, models, the
# semantic tree), embedded on openmui.lang's script thread.
[package]
namespace   = "openmui.lang"
name        = "js"
version     = "0.1.0"
description = "openmui for JavaScript and TypeScript (QuickJS-ng): builders, signals, expressions, verbs, models"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "lang"

[targets.openmui-lang-js]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/native/*.cpp"]

[dependencies]
openmui.lang   = { path = ".." }
openmui.abi    = { path = "../../modules/ui/abi" }
openmui.player = { path = "../../modules/ui/player" }
mcpplibs.os       = "0.1.2"
nlohmann.json     = "3.12.0"
mcpplibs.mwrap.quickjs_ng = "0.17.0"

[dev-dependencies]
openmui.testing       = { path = "../../modules/base/testing" }
openmui.cts           = { path = "../../tests/cts" }
openmui.native.fuzzy  = { path = "../../modules/ui/native/fuzzy" }
openmui.theme.default = { path = "../../modules/ui/theme/default" }
openmui.theme.compact = { path = "../../modules/ui/theme/compact" }
openmui.ui.base       = { path = "../../components/base" }
