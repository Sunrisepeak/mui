# A one-off probe (red list 65; removed once it has answered): on Windows, do the workspace's
# tools from npm's registry ([xlings.workspace] "xim:esbuild", when = "run") get installed by the
# newest mcpp, as they do on Linux? CI's Windows row logs `Source xim:esbuild@… registry.npmjs.org
# (attempt 1)`, never `Downloading … done`, and the command goes on with no esbuild anywhere.
# A project of one file, apart from this repository's: what an upstream report needs.
name: Probe (Windows workspace tools)

on:
  pull_request:
    paths:
      - .github/workflows/probe-windows-tools.yml

env:
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
        mcpp: ["2026.11.8.1", "2026.11.12.1"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Install xlings (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s v2026.10.26.1
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: Install xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install mcpp
        run: |
          for attempt in 1 2 3 4; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@${{ matrix.mcpp }}" -y -g; then break; fi
            [ "$attempt" = 4 ] && { echo "::error::mcpp could not be installed"; exit 1; }
            sleep 30
          done
          mcpp --version
          mcpp self config --mirror GLOBAL
      - name: Select the toolchain
        run: |
          mcpp toolchain install llvm 23.1.3
          mcpp toolchain default llvm@23.1.3
      - name: A workspace that declares esbuild and typescript for its runs, and one member whose program and test call both
        run: |
          mkdir -p probe/app/src probe/app/tests && cd probe
          cat > mcpp.toml <<'TOML'
          [workspace.xlings.workspace]
          "xim:esbuild" = { version = "0.25.12", when = "run" }
          "xim:typescript" = { version = "7.0.2", when = "run" }

          [workspace]
          members = ["app"]
          TOML
          cat > app/mcpp.toml <<'TOML'
          [package]
          name = "app"
          version = "0.1.0"

          [targets.app]
          kind = "bin"
          main = "src/main.cpp"

          [build]
          sources = ["src/*.cpp"]
          TOML
          cat > app/src/main.cpp <<'CPP'
          #include <cstdio>
          #include <cstdlib>
          int main() {
              const char* path = std::getenv("PATH");
              std::printf("PATH=%s\n", path ? path : "(none)");
              std::fflush(stdout);
              const int esbuild = std::system("esbuild --version");
              const int tsc = std::system("tsc --version");
              std::printf("esbuild --version: exit %d\ntsc --version: exit %d\n", esbuild, tsc);
              return esbuild == 0 ? 0 : 1;
          }
          CPP
          cp app/src/main.cpp app/tests/tools_test.cpp
          # As this repository has it: the project names its mcpp to xlings.
          printf '{\n  "workspace": {\n    "mcpp": "%s"\n  }\n}\n' '${{ matrix.mcpp }}' > .xlings.json
      - name: mcpp test and mcpp run — what PATH each gives the program, and whether it finds the tools
        working-directory: probe
        run: |
          set +e
          echo "=== mcpp test -p app"
          mcpp test -p app 2>&1 | tee test.log | grep -v 'Resolv\|Compiling\|Finished\|Target'
          tested=${PIPESTATUS[0]}
          echo "mcpp test: exit $tested"
          echo "=== mcpp run -p app"
          mcpp run -p app 2>&1 | tee run.log | grep -v 'Resolv\|Compiling\|Finished\|Target'
          ran=${PIPESTATUS[0]}
          echo "mcpp run: exit $ran"
          echo "--- the two tools in mcpp's own bin directory"
          ls -la "$HOME/.mcpp/registry/subos/default/bin" 2>/dev/null | grep -i 'esbuild\|tsc'
          echo "--- and beneath the project"
          find "$PWD/.xlings" -maxdepth 4 \( -iname '*esbuild*' -o -iname 'tsc*' \) 2>/dev/null | head -10
          [ "$tested" = 0 ] && [ "$ran" = 0 ]
