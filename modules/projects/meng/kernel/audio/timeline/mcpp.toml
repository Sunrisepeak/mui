[package]
namespace = "meng.audio"
name = "timeline"
version = "0.1.0"
description = "Optional immutable timeline-to-audio sample-clock automation"
license = "Apache-2.0"
platforms = ["linux", "macos", "windows", "emscripten"]
repo = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "preview"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "library: sound on a timeline for films and studios"
kind = "runtime"
agent = { part = "meng.audio" }

[targets.meng-audio-timeline]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
hanim.timeline = { path = "../../../../hanim/timeline" }
meng.audio = { path = ".." }
hanim.core = { path = "../../../../hanim/core" }
mlibs.utils = { path = "../../../../../base/utils" }

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
