name: omui

# Prebuilt `omui` (agent connect §4.1, W3): the command line a visitor's agent
# links to a page with (omui connect, omui page) and drives a desktop
# application with (omui agent). Built for Linux, macOS and Windows as one
# self-contained file each (mcpp pack: its loader and libraries inside), the
# SHA-256 of each in SHA256SUMS, and each build attested (GitHub's build
# provenance: `gh attestation verify <file> --repo Sunrisepeak/mui`) where
# the repository is public. agent.md tells an agent to check both. A tag
# omui-v* publishes them as a release; any other run keeps them as its
# artifacts.

on:
  push:
    tags: ['omui-v*']
  pull_request:
    paths:
      - 'tools/cli/**'
      - 'modules/projects/omui/agent/**'
      - '.github/workflows/omui.yml'
  workflow_dispatch:

concurrency:
  group: omui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write      # the release, on a tag
  id-token: write      # the attestation's signature
  attestations: write

env:
  XLINGS_VERSION: v2026.10.26.1
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  build:
    name: omui ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     toolchain: 'gcc@16.1.0',  name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, toolchain: 'llvm@23.1.3', name: linux-aarch64 }
          - { os: macos-15,         toolchain: 'llvm@23.1.3', name: macos-arm64 }
          - { os: windows-2022,     toolchain: 'llvm@23.1.3', name: windows-x86_64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install xlings (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install mcpp
        run: |
          MCPP_VERSION="$(sed -n 's/.*"mcpp": *"\([^"]*\)".*/\1/p' .xlings.json)"
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 6 ] && { echo "::error::mcpp could not be installed"; exit 1; }
            sleep 60
          done
          mcpp --version
          mcpp self config --mirror GLOBAL

      - name: Select the toolchain
        run: |
          spec='${{ matrix.toolchain }}'
          mcpp toolchain install "${spec%@*}" "${spec#*@}"
          mcpp toolchain default "$spec"

      # One file that runs on a machine with nothing installed: its loader and
      # libraries inside (mcpp pack --mode self-contained).
      - name: Pack omui
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          mkdir -p dist
          out="dist/omui-${{ matrix.name }}$exe"
          mcpp pack -p openmui.cli --release --mode self-contained --pkg-format single-file -o "$out" --message-format json > pack.json
          python3 -c 'import json,sys; a=json.load(open("pack.json"))["data"]["artifacts"]; print(a)'
          "$out" --version
          # It runs without the toolchain: the bridge's command answers (no bridge yet).
          "$out" page status > status.txt 2>&1 || true
          grep -q "no bridge is running" status.txt || { cat status.txt; echo "::error::omui does not run on its own"; exit 1; }

      - name: Attest its build (a public repository's)
        if: github.event.repository.visibility == 'public' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/omui-*

      - uses: actions/upload-artifact@v4
        with:
          name: omui-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  publish:
    name: omui SHA256SUMS (and the release, on a tag)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: omui-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum omui-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: omui-all
          path: dist/
      - name: The release
        if: startsWith(github.ref, 'refs/tags/omui-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "omui ${GITHUB_REF_NAME#omui-v}" \
            --notes "omui for Linux, macOS and Windows: one self-contained file each. Check it against SHA256SUMS, and its build with \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
