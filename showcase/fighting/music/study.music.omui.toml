doc = """墨 Mo's study: an ink-painter's room, bamboo outside a paper window.
A guzheng carries the tune in D yu (the minor pentatonic: D F G A C, with E and Bb
as passing colour), bending into its long notes the way a player presses a string;
a koto-like string arpeggiates under it, a warm pad holds the harmony, a temple
bell marks the sections, taiko and a shaker keep time.

Intensity (0–1) adds parts at the next bar: below 0.35 the guzheng, the pad, the
bell and a quiet taiko; from 0.35 the pulsing bass, woodblock and the taiko
groove; from 0.6 the full drums, the arpeggio and the strings; from 0.85 the
crash and a dizi doubling the climax an octave down.

128 beats a minute; a four-bar intro, then a loop of 32 bars (A, A2, B, C) —
A states the hook, A2 answers it higher, B turns to F major, C brings the hook
back over the climax and rolls the taiko into the loop's start."""

[music]
name = "study"
tempo = 128
meter = [4, 4]
gain = 0.5

# ── patches: the built-ins, shaded ───────────────────────────────────────

[patch.zheng]
base = "guzheng"
pluck = { decay = 3.6 }
vibrato = { depth = 12, delay = 0.45 }

[patch.zheng_low]
base = "koto"
pluck = { brightness = 0.55, decay = 1.4, pick = 0.2 }
filter = { cutoff = 3600 }

[patch.pulse]
base = "fm_bass"
fm = { index = 2.6, decay = 0.09 }

[patch.warm]
base = "pad"
filter = { cutoff = 700, envelope = 1 }

# ── instruments ──────────────────────────────────────────────────────────

[instrument.lead]
patch = "zheng"
gain = 1
pan = 0.05
legato = 1
voices = 8
sends = { hall = 0.25, delay = 0.12 }

[instrument.arp]
patch = "zheng_low"
gain = 0.48
pan = -0.3
legato = 1
humanize = 0.3
voices = 10
sends = { hall = 0.15, delay = 0.18 }

[instrument.pad]
patch = "warm"
bus = "pads"
gain = 0.35
legato = 1
voices = 8
sends = { hall = 0.35 }

[instrument.strings]
patch = "strings"
gain = 0.5
pan = 0.25
legato = 1
sends = { hall = 0.35 }

[instrument.dizi]
patch = "dizi"
gain = 0.45
pan = -0.15
sends = { hall = 0.3, delay = 0.1 }

[instrument.bell]
patch = "bell"
gain = 0.45
pan = 0.2
legato = 1
sends = { hall = 0.5 }

[instrument.bass]
patch = "pulse"
bus = "low"
gain = 0.9
legato = 0.55

[instrument.taiko]
patch = "taiko"
bus = "drums"
gain = 0.68
humanize = 0.15
sends = { hall = 0.15 }

[instrument.taiko_hi]
patch = "tom"
bus = "drums"
gain = 0.6
pan = 0.2
transpose = 7
humanize = 0.2
sends = { hall = 0.15 }

[instrument.kick]
patch = "kick"
bus = "drums"
gain = 0.55

[instrument.snare]
patch = "snare"
bus = "drums"
gain = 0.55
sends = { hall = 0.25 }

[instrument.woodblock]
patch = "woodblock"
bus = "drums"
gain = 0.5
pan = -0.25
humanize = 0.3
sends = { hall = 0.2 }

[instrument.shaker]
patch = "shaker"
bus = "drums"
gain = 0.55
pan = 0.3
humanize = 0.4

[instrument.crash]
patch = "crash"
bus = "drums"
gain = 0.35
sends = { hall = 0.2 }

# ── the air (the night: crickets in the bamboo and a low breath of air) ────────

[patch.cricket]
engine = "fm"
gain = 0.25
fm = { ratio = 1.5, index = 0.8, decay = 0.05 }
amp = { attack = 0.003, decay = 0.05, sustain = 0, release = 0.03 }

[patch.night_air]
engine = "analog"
gain = 0.18
osc = { wave = "noise" }
amp = { attack = 2, decay = 1, sustain = 1, release = 2 }
filter = { kind = "lowpass", cutoff = 900, q = 0.5 }

[instrument.cricket]
patch = "cricket"
bus = "air"
gain = 0.8
pan = 0.45
humanize = 0.5

[instrument.night_air]
patch = "night_air"
bus = "air"
gain = 1.4
legato = 1
voices = 2

# ── buses ────────────────────────────────────────────────────────────────

[bus.air]
effects = [{ kind = "highpass", cutoff = 120 }]

[bus.hall]
effects = [
    { kind = "reverb", size = 0.82, damping = 0.45, predelay = 0.025, wet = 1, dry = 0 },
    { kind = "highpass", cutoff = 220 },
]

[bus.delay]
effects = [
    { kind = "echo", beats = 0.75, feedback = 0.3, pingpong = true, wet = 1, dry = 0 },
    { kind = "highpass", cutoff = 300 },
    { kind = "lowpass", cutoff = 5000 },
]

[bus.pads]
effects = [{ kind = "chorus", delay = 0.014, depth = 0.004, rate = 0.3, wet = 0.5 }]

[bus.drums]

[bus.low]
duck = { key = "drums", depth = 0.35, threshold = 0.3, attack = 0.002, release = 0.1 }

# ── the intro ────────────────────────────────────────────────────────────

[pattern.intro_bell]
instrument = "bell"
step = "1/1"
notes = "D5 | . | . | A4"

[pattern.intro_zheng]
instrument = "lead"
step = "1/16"
notes = """
D4? F4? G4? A4? C5 D5 F5 G5 A5:8! |
G5>A5:4! F5:2 D5:2 C5:4 D5:4 |
F5:3! G5 A5:4 C6:4 A5:2 G5:2 |
A5:8! . . G5? F5? D5:2 C5:2 |
"""

[pattern.intro_pad]
instrument = "pad"
step = "1/1"
notes = "D3+A3+E4+F4 | D3+A3+E4+F4 | F3+A3+Bb3+D4 | E3+A3+D4+E4"

[pattern.intro_drums]
step = "1/16"

[pattern.intro_drums.lanes]
taiko  = "X............... | X.......x.x.xxXX"
shaker = "........o.o.x.x. | oxoxoxoxxxxxXXXX"

