# omui.ui.timeline — the timeline every editor shares, as a component
# (D-86): tracks of clips in exact time (hanim.timeline), a ruler, markers
# and a playhead; clips selected, moved, trimmed, split and removed by the
# pointer, the keys or an agent's actions, every edit undone exactly.
# Contract-first: contract/timeline_editor.contract.xdef.ts becomes the base,
# builders, stubs and schema when it builds (omui.build.contracts).
[package]
namespace   = "omui.ui"
name        = "timeline"
version     = "0.1.0"
description = "A timeline to edit: tracks of clips, a playhead, moves, trims, splits and removals, every edit undone exactly"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "dependency: hanim.timeline's editing model and its editor, kept out of every application the base components make"
kind = "component"
agent = { part = "omui.agent" }

[targets.openmui-ui-timeline]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
omui.core          = { path = "../../core" }
omui.view          = { path = "../../view" }
mrender.vector = { path = "../../../mrender/vector" }
omui.ui.base       = { path = "../base" }
hanim.timeline      = { path = "../../../hanim/timeline" }

[build-dependencies]
omui.build = { path = "../../../../../mcpp/build", host-module = true }
openlifa.openmui = { path = "../../../../../spec" }  # its registry/: what the contracts are generated against

[dev-dependencies]
mlibs.text.harfbuzz = { path = "../../../../content/text/harfbuzz" }  # the shaper its tests draw text with (mlibs.text's slot)
mcpplibs.mtest = "0.11.3"
mlibs.utils       = { path = "../../../../base/utils" }
omui.host.headless = { path = "../../host/headless" }
omui.semantic      = { path = "../../semantic" }
mlibs.i18n.cldr     = { path = "../../../../content/i18n/cldr" }
