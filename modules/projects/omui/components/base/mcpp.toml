# omui.ui.base — the Core components (spec §11), behaviour over the
# runtime's public API only (component-binding §1: no privilege). Each
# component's interface is its contract in spec/registry/components; the
# partitions in src/generated are omui-gen's (`omui-gen cpp … --namespace omui
# --catalog`),
# the classes beside them are the behaviour, and the look comes from the
# theme's tokens. The package's own components (badge, card, pagination …)
# have their contracts in contract/, made into code when it builds
# (build.mcpp, omui.build.contracts).
[package]
namespace   = "omui.ui"
name        = "base"
version     = "0.1.0"
description = "openmui Core components: button, toggle, checkbox, slider, text box …, contract-first"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "component"
agent = { part = "omui.agent" }

[targets.openmui-ui-base]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp", "src/generated/*.cppm", "src/generated/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
xrender.text = { path = "../../../xrender/text" }
omui.core    = { path = "../../core" }
omui.view    = { path = "../../view" }
mlibs.unicode = { path = "../../../../base/unicode" }
mlibs.utils    = { path = "../../../../base/utils" }

[build-dependencies]
omui.build.contracts = { path = "../../../../../mcpp/contracts", host-module = true }

[dev-dependencies]
mcpplibs.mtest = "0.5.2"
xrender.text = { path = "../../../xrender/text" }
omui.host.headless = { path = "../../host/headless" }
# platform_styles_test: the platform packs (fluent, cupertino, material) over the components.
omui.theme = { path = "../../theme" }
"omui.theme.styles" = { path = "../../theme/styles" }
