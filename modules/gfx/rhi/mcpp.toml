# openmui.rhi — the UI-scale GPU abstraction (omui.rhi, D-33 / D-58): resource
# and pipeline descriptions, shader code per backend format, recorded command
# lists, the Device interface with validation. Backends live in their own
# packages (modules/gfx/rhi/sdl); this one depends on no graphics library.
[package]
namespace   = "openmui"
name        = "rhi"
version     = "0.1.0"
description = "A UI-scale GPU abstraction: descriptions, recorded command lists, a validating device interface"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"
platforms   = ["linux", "macos", "windows", "emscripten"]

[package.metadata.openmui]
kind = "backend"

[targets.openmui-rhi]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
openmui.memory = { path = "../../base/memory" }
openmui.hash   = { path = "../../base/hash" }

[dev-dependencies]
openmui.testing = { path = "../../base/testing" }
