# openmui.text — fonts, shaping, bidi, line breaking, paragraphs, glyph
# rasterisation and the editing model, over HarfBuzz and SheenBidi as C++ modules (mcpp-index's mwrap)
# and openmui.unicode, openmui.raster and openmui.render.
[package]
namespace   = "openmui"
name        = "text"
version     = "0.1.0"
description = "Text engine: font fallback, HarfBuzz shaping, bidi, UAX #14 line breaking, paragraphs, carets, glyph rasterisation, editing"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"

[targets.openmui-text]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp", "src/native/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
openmui.geom    = { path = "../../base/geom" }
openmui.unicode = { path = "../../base/unicode" }
openmui.raster  = { path = "../../gfx/raster" }
openmui.render  = { path = "../../gfx/render" }
mcpplibs.os     = "0.1.2"
mcpplibs.mwrap.harfbuzz = "14.3.0"
mcpplibs.mwrap.sheenbidi = "3.0.0"

[dev-dependencies]
openmui.testing = { path = "../../base/testing" }
openmui.image   = { path = "../../base/image" }

