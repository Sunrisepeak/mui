# mlibs.text.fonts.han — a default font's pack (D-214): Noto Sans SC (GB 2312 subset): Simplified Chinese.
# An application that shows it depends on this package and carries the file
# in its `fonts/` (FontCollection::default_file); one that does not, does not.
[package]
namespace   = "mlibs.text.fonts"
name        = "han"
version     = "0.1.0"
description = "A default font for mlibs.text: Noto Sans SC (GB 2312 subset): Simplified Chinese"
license     = "OFL-1.1"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "dependency: a distribution carries the font only when it depends on this (deploy is per package, not per feature)"
kind = "runtime"

[runtime]
deploy = [
    { from = "NotoSansSC.ttf", to = "fonts" },
    { from = "OFL-notosanssc.txt", to = "licenses/fonts" },
]
