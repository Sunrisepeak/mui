# mlibs.geom — the geometry the independent modules share: points, sizes,
# rectangles, insets, radii, colours, affine transforms, pixel snapping.
# Standard library only; header-like (every function is constexpr).
[package]
namespace   = "mlibs"
name        = "geom"
version     = "0.1.0"
description = "2D geometry for openmui's modules: points, rectangles, colours, affine transforms, pixel snapping"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"

[targets.mlibs-geom]
kind = "lib"

[build]
sources  = ["src/*.cppm"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dev-dependencies]
mlibs.testing = { path = "../testing" }
