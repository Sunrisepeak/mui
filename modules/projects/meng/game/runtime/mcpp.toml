# meng.runtime — a game running on its own (D-162): its steps on a
# timeline, an agent's actions on its tier's lane, and the game as a subject
# of the agent kernel (observe, act, step, seek, branch), with no interface:
# a server, a thousand playtests, CI. omui shows and plays the same game
# through meng.ui, the bridge; nothing here knows it.
[package]
namespace   = "meng"
name        = "runtime"
version     = "0.1.0"
description = "A game on its own: its steps, an agent player's lane and the game as a subject of the agent kernel — no interface needed"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "preview"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "library: a game as a Playable for every game and agent"
kind = "runtime"
agent = "subject"

[targets.meng-runtime]
kind = "lib"

[build]
sources = ["src/*.cppm"]

# A game as a program played over lines (src/lines/, module meng.runtime.lines): `<name> run --session FILE`.
# A feature: a command line and standard input are the native systems', and the runtime also builds for the Web.
[features]
lines = { sources = ["src/lines/*.cppm", "src/lines/*.cpp"] }

# Rollback netcode for two peers, independent of the transport (src/net/, module meng.net; D-85; experimental):
# a feature — the standard library alone, and no game takes it yet (release plan §4.2 rule 3).
net = { sources = ["src/net/*.cppm", "src/net/*.cpp"] }

[feature-deps.lines]
mcpplibs.os      = "0.4.4"
mcpplibs.cmdline = "0.0.3"

[dependencies]
mlibs.agent      = { path = "../../../../base/agent" }
mlibs.control    = { path = "../../../../base/control" }
mlibs.simulation = { path = "../../../../base/simulation" }
mlibs.json       = { path = "../../../../base/json" }
meng.input    = { path = "../input" }
openlifa.openas  = "0.2.1"

[test]
features = ["net"]  # tests/net_test.cpp

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
gongfu         = { path = "../../../gongfu" }  # tests/net_test.cpp: gongfu's match on two peers
mlibs.utils    = { path = "../../../../base/utils" }
mlibs.agent.cts = { path = "../../../../base/agent/cts" }
