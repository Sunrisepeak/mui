# A third-party component package built through omui.build.contracts: its contract
# is all it writes about the interface; the partition, the builder, the
# stubs and the schema are made at build time (component-binding §2).
[package]
namespace   = "acme"
name        = "ui"
version     = "0.1.0"
description = "A component package whose bindings omui.build.contracts generates at build time"
license     = "Apache-2.0"

[package.metadata.openmui]
kind = "component"

[targets.openmui-contracts-fixture]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
omui.core = { path = "../../../modules/projects/omui/core" }
omui.view = { path = "../../../modules/projects/omui/view" }

[build-dependencies]
omui.build.contracts = { path = "../../../mcpp/contracts", host-module = true }

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
mlibs.utils       = { path = "../../../modules/base/utils" }
omui.host.headless = { path = "../../../modules/projects/omui/host/headless" }
