# omui.theme.default (module openmui.theme.default_theme: `default` is a
# C++ keyword) — the default theme file (default.theme.omui.ts), embedded:
# add_default() adds what it declares to the program's theme library
# (omui.theme). The partition holding the text is generated
# (`omui-gen embed`; tools/gen's test keeps it current).
[package]
namespace   = "omui.theme"
name        = "default"
version     = "0.1.0"
description = "openmui's default theme as data"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind   = "theme"
themes = ["default.theme.omui.ts"]
agent = { library = "theme data: tokens and recipes" }

[targets.openmui-theme-default]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/generated/*.cppm"]

[dependencies]
omui.theme = { path = ".." }

[dev-dependencies]
mcpplibs.mtest = "0.8.3"
mlibs.utils = { path = "../../../../base/utils" }
