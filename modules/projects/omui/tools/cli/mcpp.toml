# omui — the openmui command line (plan §2.2): agent operations against any
# running application; check, fmt and schema for view documents; video
# (xengine.video: descriptions and views rendered to files); add and bench
# as their members land.
[package]
namespace   = "omui"
name        = "cli"
version     = "0.1.0"
description = "The openmui command line: omui agent (ls, describe, snapshot, act …), check, fmt, schema and mcp"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
reexports = ["mlibs.agent"]  # what its interface re-exports (lint module-closure)
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
lower = ["xengine.audio", "xengine.audio.timeline", "xengine.video", "xengine.video.webm"]  # lower-labelled parts it uses, each marked in its README
kind = "tool"
agent = { part = "omui.agent" }  # the `omui` command: the agent operations of omui.agent's catalog, at the application's endpoint (D-174)

[targets.omui]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/catalog/*.cppm"]

[dependencies]
omui.core        = { path = "../../core" }
omui.agent       = { path = "../../agent" }
# A design's history store (omui design sync): the agent kernel's, with no designer linked.
mlibs.agent      = { path = "../../../../base/agent" }
omui.mcp         = { path = "../mcp" }
omui.viewdoc     = { path = "../../viewdoc" }
omui.lang.ts     = { path = "../../lang/ts" }
omui.ui.base     = { path = "../../components/base" }
omui.ui.markdown = { path = "../../components/markdown" }
xengine.video      = { path = "../../../xengine/kernel/video" }
"xengine.video.webm" = { path = "../../../xengine/kernel/video/webm" }
xengine.audio       = { path = "../../../xengine/kernel/audio" }
hanim.timeline = { path = "../../../hanim/timeline" }
"xengine.audio.timeline" = { path = "../../../xengine/kernel/audio/timeline" }
xrender.vector = { path = "../../../xrender/vector" }
mlibs.image = { path = "../../../../base/image" }
omui.host.headless = { path = "../../host/headless" }
mcpplibs.os      = "0.4.4"
marzer.tomlplusplus = "3.4.0"

[dev-dependencies]
# Tests are mtest's (D-147).
mcpplibs.mtest = "0.8.4"
mlibs.utils       = { path = "../../../../base/utils" }
