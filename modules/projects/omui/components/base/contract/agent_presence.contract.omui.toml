# Another actor at work here, seen (the site plan §9.5, C2): over the page and
# taking no pointer, where the agent acts now — a frame round the node, its
# name and the action — the few steps before it, and, when its request waits
# for the person's answer — or the person has taken over from it — a card saying so. The model under it
# (agent_presence_state) is the one every skin draws: this reticle, the
# site's Mui. It only shows: it answers nothing for the person (S-10).
[contract.agent_presence]
role = "status"
spec = "0.1"
doc  = "Where another actor works now, the steps before, and what it waits for the person to answer: shown over the page, answering nothing."

[contract.agent_presence.props]
actors  = { type = "string", default = "agent:", doc = "Whose actions it shows: actors whose names begin with this." }
trail   = { type = "i64", default = 3, doc = "The steps before the current one it shows (0: none)." }
asking  = { type = "string", default = "", doc = "What the agent asks the person, in the application's words; empty: the card says only that it asks." }
skin    = { type = "enum", values = ["reticle", "none"], default = "reticle", doc = "none: nothing drawn (another skin draws the same model)." }
phrases = { type = "any", doc = "Its words in another language: a map from asks, taken_over, intends and hands_back to text ({agent} and {text} filled in)." }

[contract.agent_presence.parts]
frame = {}
trail = {}
card  = {}
