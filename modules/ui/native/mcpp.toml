# openmui.native — the native modules of a program (component-binding §8):
# functions written in C++ behind a `*.native.omui.toml` contract, registered
# once and called by scripts through the C ABI (omuiNativeCall). The
# contract's types check every call's arguments here, in one place; the code
# `omui-gen native` generates only converts them.
[package]
namespace   = "openmui"
name        = "native"
version     = "0.1.0"
description = "openmui's native-module registry: contract-typed C++ functions scripts call"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"

[targets.openmui-native]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
nlohmann.json = "3.12.0"

[dev-dependencies]
openmui.testing = { path = "../../base/testing" }
