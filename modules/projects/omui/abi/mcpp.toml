# omui.abi — openmui.h implemented (spec §8): the one boundary every
# language binding is written against. Handles and values cross it, never a
# C++ type or an exception; text and structured results reach the caller's
# sink; views are view documents (omui.viewdoc), queries and actions the
# bus interface's (omui.agent). Its types and declarations are generated
# from spec/registry/abi.toml (`omui-gen abi`), and a native unit checks every
# layout against the header.
[package]
namespace   = "omui"
name        = "abi"
version     = "0.1.0"
description = "openmui's C ABI (openmui.h): runtimes, view documents, signals, verbs, frames and the semantic tree"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"
agent = { part = "omui.agent" }

[targets.openmui-abi]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/generated/*.cppm", "src/native/*.cpp"]

[test]
# The C++ suite, and a C program that includes openmui.h.
discover = ["tests/**/*.cpp", "tests/**/*.c"]

[dependencies]
xrender.text = { path = "../../xrender/text" }
openlifa.openmui = { path = "../../../../spec" }
omui.core     = { path = "../core" }
omui.view     = { path = "../view" }
omui.viewdoc  = { path = "../viewdoc" }
omui.semantic = { path = "../semantic" }
omui.agent    = { path = "../agent" }
xrender.vector   = { path = "../../xrender/vector" }
xrender.raster   = { path = "../../xrender/raster" }
mlibs.text     = { path = "../../../content/text" }
omui.native   = { path = "../native" }
omui.theme    = { path = "../theme" }
nlohmann.json    = "3.12.0"

[dev-dependencies]
mcpplibs.mtest = "0.5.2"
mlibs.utils      = { path = "../../../base/utils" }
omui.ui.base      = { path = "../components/base" }
omui.native.fuzzy = { path = "../native/fuzzy" }
