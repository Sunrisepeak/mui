# omui.host.sdl3 — openmui on the desktop through SDL3 (imported as the
# C++ module mcpplibs.mwrap.sdl3 over mcpp-index's compat.sdl3): a window, the display's scale, mouse, touch, wheel,
# keyboard, text and input methods, the system clipboard and cursors; frames
# drawn by the GPU renderer into the window's swapchain (mlibs.rhi on SDL_GPU)
# or by the CPU renderer into a streamed texture; a program's effect files
# loaded and reloaded while it runs; a loop that sleeps until an event, a
# timer or an agent's request; the agent endpoint served between frames.
[package]
namespace   = "omui.host"
name        = "sdl3"
version     = "0.1.0"
description = "openmui desktop host over SDL3: window, input, IME, clipboard, cursors, GPU or CPU frames, effect reloading, agent endpoint"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "host"

[targets.openmui-host-sdl3]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/native/*.cpp"]

[dependencies]
xrender.text = { path = "../../../xrender/text" }
omui.core     = { path = "../../core" }
omui.view     = { path = "../../view" }
omui.semantic = { path = "../../semantic" }
omui.agent    = { path = "../../agent" }
omui.accessibility = { path = "../../accessibility" }
xrender.raster   = { path = "../../../xrender/raster" }
xrender.vector   = { path = "../../../xrender/vector" }
mlibs.text     = { path = "../../../../content/text" }
mlibs.image    = { path = "../../../../base/image" }
mlibs.utils    = { path = "../../../../base/utils" }
# Quoted: as dotted keys of one table, `xrender.rhi.sdl` would extend the
# inline table `mlibs.rhi`, which TOML forbids.
"mlibs.rhi"         = { path = "../../../../gfx/rhi" }
"xrender.rhi.sdl"     = { path = "../../../xrender/rhi/sdl" }
xrender.effect   = { path = "../../../xrender/effect" }
mcpplibs.os      = "0.4.1"
mcpplibs.mwrap.sdl3 = "3.4.18"

[dev-dependencies]
