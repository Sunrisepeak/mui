# S2 — the style workshop (implementation plan §13): a real settings panel
# and dashboard shown in each of the style packs — glass, neon, retro CRT,
# ink on paper, liquid — switched with a cross-fade; the pack's tokens and
# its effects' parameters edited live, and exported as a *.style.omui.json a
# real program loads. The semantic tree is the same under every style: only
# pixels change, and agents act the same.
#
#   mcpp run -p omui.showcase.style_gallery
#   mcpp run -p omui.showcase.style_gallery -- --style neon --headless --png neon.png
[package]
namespace   = "omui.showcase"
name        = "style_gallery"
version     = "0.1.0"
description = "S2, the style workshop: one interface in eight style packs, edited live and exported"
license     = "Apache-2.0"

[package.metadata.openmui]
kind = "showcase"

[targets.openmui-showcase-style-gallery]
kind = "lib"

[targets.omui-styles]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
mcpplibs.cmdline = "0.0.3"
omui.sdk          = { path = "../../modules/projects/omui/sdk" }
"omui.theme.styles" = { path = "../../modules/projects/omui/theme/styles" }
omui.theme      = { path = "../../modules/projects/omui/theme" }
mlibs.math         = { path = "../../modules/base/math" }
mcpplibs.os          = "0.4.4"

[dev-dependencies]
mcpplibs.mtest = "0.6.3"
mlibs.utils = { path = "../../modules/base/utils" }
