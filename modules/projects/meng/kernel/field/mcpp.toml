# meng.field — the air and what moves it, as one more carrier of matter (the M6.5 design's T5.2; the foundation
# plan's §6.4: the field carrier): a sparse lattice of coarse cells where the standard laws run as on any carrier,
# and the wind — warm air rising, carried along by itself, kept from piling up — that carries the heat. Bodies and
# particles join a step as guests in the cell they are in. Deterministic: the same bits every run; a copy is a branch.
[package]
namespace   = "meng"
name        = "field"
version     = "0.1.0"
description = "The air as a carrier of matter: coarse cells under the same laws, and the wind that warm air makes and carries the heat by"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "experimental"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "library: the air as a carrier of matter"
reexports = ["mlibs.math", "meng.matter"]  # what its interface re-exports (lint module-closure)
kind = "module"
agent = "subject"  # the air (feature `agent`): meng.field.agent, air.ops.xdef.ts

[targets.meng-field]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
# Optimised in every profile (the last -O wins), as cellular, mrender.mesh and mrender.particle are: a world
# stepped at -O0 costs several times as much, which every consumer's tests would pay (emergence3d past
# 300 s on arm, red 99); without fast-math or contraction the results are the same bits.
cxxflags = ["-fno-fast-math", "-ffp-contract=off", "-O2"]

[dependencies]
meng.matter = { path = "../matter", default-features = false }
mlibs.math     = { path = "../../../../base/math" }
mlibs.utils    = { path = "../../../../base/utils" }

[features]
# The air as an agent's subject (meng.field.agent): taken alone, the carrier stays the small tool it is.
agent = { sources = ["src/agent/*.cppm", "src/agent/*.cpp"] }

[feature-deps.agent]
mlibs.simulation = { path = "../../../../base/simulation" }
mlibs.agent      = { path = "../../../../base/agent" }
mlibs.control    = { path = "../../../../base/control" }
mlibs.json       = { path = "../../../../base/json" }
openlifa.openas  = "0.2.1"

[test]
# The air as a subject is tested by its owner (mcpp 2026.11.16.1, #941): the agent contract and a fire lit through the session.
features = ["agent"]

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
meng.matter = { path = "../matter" }  # with its default features: the standard definition (json)
mlibs.agent.cts = { path = "../../../../base/agent/cts" }
