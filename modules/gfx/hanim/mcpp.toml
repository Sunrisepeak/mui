# Public hanim product: core plus object/library/effect/program/engine. Rendering is opt-in.
[package]
name = "hanim"
version = "0.1.0"
description = "hanim public animation product umbrella"
license = "Apache-2.0"
platforms = ["linux", "macos", "windows", "emscripten"]
repo = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"

[targets.hanim]
kind = "lib"

[build]
sources = ["src/*.cppm"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
hanim.core = { path = "../../base/hanim/core" }
hanim.engine = { path = "engine" }

[dev-dependencies]
mlibs.testing = { path = "../../base/testing" }
