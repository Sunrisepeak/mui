# omui.host.sdl3 — openmui on the desktop through SDL3 (imported as the
# C++ module mcpplibs.mwrap.sdl3 over mcpp-index's compat.sdl3): a window, the display's scale, mouse, touch, wheel,
# keyboard, text and input methods, the system clipboard and cursors; frames
# drawn by the GPU renderer into the window's swapchain (mlibs.rhi on SDL_GPU)
# or by the CPU renderer into a streamed texture; a program's effect files
# loaded and reloaded while it runs; a loop that sleeps until an event, a
# timer or an agent's request; the agent endpoint served between frames.
[package]
namespace   = "omui.host"
name        = "sdl3"
version     = "0.1.0"
description = "openmui desktop host over SDL3: window, input, IME, clipboard, cursors, GPU or CPU frames, effect reloading, agent endpoint"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "platform: desktop windows and input through SDL3, native only"
lower = ["mpal"]  # lower-labelled parts it uses, each marked in its README
reexports = ["omui.accessibility", "omui.agent", "omui.core", "omui.semantic", "omui.view", "xrender.effect", "xrender.raster"]  # what its interface re-exports (lint module-closure)
kind = "host"
agent = { part = "omui.agent" }

[targets.openmui-host-sdl3]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/native/*.cpp"]

# The system's own web view (D-141: a web page placed over a node), spoken
# through mcpplibs.os's Objective-C runtime in macOS's own unit, built for it
# alone; elsewhere the host has none and the component draws its card.
[target.macos.build]
sources = ["src/macos/*.cpp"]

[dependencies]
# The system's notifications (mpal: the OS's services above mcpplibs.os).
mpal = { path = "../../../../base/mpal", version = "0.1.0" }
xrender.text = { path = "../../../xrender/text", version = "0.1.0" }
omui.core     = { path = "../../core", version = "0.1.0" }
omui.view     = { path = "../../view", version = "0.1.0" }
omui.semantic = { path = "../../semantic", version = "0.1.0" }
omui.agent    = { path = "../../agent", version = "0.1.0" }
omui.accessibility = { path = "../../accessibility", version = "0.1.0" }
xrender.raster   = { path = "../../../xrender/raster", version = "0.1.0" }
xrender.vector   = { path = "../../../xrender/vector", version = "0.1.0" }
# The frame's entry: the host hands its layers to the renderer, which composes (D-162).
xrender.frame = { path = "../../../xrender/frame", version = "0.1.0" }
mlibs.text     = { path = "../../../../content/text", version = "0.1.0" }
mlibs.image    = { path = "../../../../base/image", version = "0.1.0" }
mlibs.utils    = { path = "../../../../base/utils", version = "0.1.0" }
# Quoted: as dotted keys of one table, `xrender.rhi.sdl` would extend the
# inline table `mlibs.rhi`, which TOML forbids.
mlibs.rhi         = { path = "../../../../gfx/rhi", version = "0.1.0" }
xrender.rhi.sdl     = { path = "../../../xrender/rhi/sdl", version = "0.1.0" }
xrender.effect   = { path = "../../../xrender/effect", version = "0.1.0" }
mcpplibs.os      = "0.4.4"
mcpplibs.mwrap.sdl3 = "3.4.18"

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
# A web page in the system's own view (the macOS case): the web_view component.
omui.ui.base = { path = "../../components/base", version = "0.1.0" }
