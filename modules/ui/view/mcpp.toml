# openmui.view — the retained view runtime: elements (contract ②), the
# component function tables, design tokens, the runtime (tree, bindings,
# regions, transitions, layout, paint, input, focus, actions, semantics) and
# the primitives (box, column, row, stack, grid, spacer, text, image,
# scroll view, painter).
[package]
namespace   = "openmui"
name        = "view"
version     = "0.1.0"
description = "openmui retained view runtime: elements, components, theme tokens, frames, input, actions and semantics"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"

[targets.openmui-view]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
openmui.hash = { path = "../../base/hash" }
openmui.core     = { path = "../core" }
openmui.geom     = { path = "../../base/geom" }
openmui.memory   = { path = "../../base/memory" }
hanim            = { path = "../../base/hanim" }
openmui.layout   = { path = "../../content/layout" }
openmui.raster   = { path = "../../gfx/raster" }
openmui.render.vector   = { path = "../../gfx/render/vector" }
openmui.image    = { path = "../../base/image" }
openmui.text     = { path = "../../content/text" }
openmui.trace    = { path = "../../base/trace" }
openmui.pipeline = { path = "../../base/pipeline" }
openmui.i18n     = { path = "../../content/i18n" }
mcpplibs.os      = "0.2.2"

[dev-dependencies]
openmui.testing = { path = "../../base/testing" }
