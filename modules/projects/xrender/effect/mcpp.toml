# openmui.render.effect — a program's own pixel effects (D-60, D-68; architecture
# §8: "a third party's shader uses the effect template only"): a
# `<name>.effect.xdef.ts` (read as its JSON) names the effect, its parameters and its Slang
# shader, written against the template openmui.render carries; the library
# compiles it for the device (mlibs.shader), registers it with the renderer's
# effects, and loads it again when it — or anything the shader imports —
# changes, without the program changing a line of C++.
[package]
namespace   = "xrender"
name        = "effect"
version     = "0.1.0"
description = "A program's own Slang pixel effects from *.effect.xdef.ts (as JSON): checked, compiled for the device, registered and reloaded while it runs"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "library: effects as declared data for the frame and the tools"
kind = "module"
agent = { part = "xrender.frame" }

[targets.xrender-effect]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
xrender.vector = { path = "../vector", version = "0.1.0" }
mlibs.rhi    = { path = "../../../gfx/rhi", version = "0.1.0" }
mlibs.shader = { path = "../../../gfx/shader", version = "0.1.0" }
mlibs.utils  = { path = "../../../base/utils", version = "0.1.0" }
mlibs.json   = { path = "../../../base/json", version = "0.1.0" }
mlibs.xdef = { path = "../../../base/xdef", version = "0.1.0" }  # a snapshot's format checked first (D-209)

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
xrender.raster  = { path = "../raster", version = "0.1.0" }
mlibs.geom    = { path = "../../../base/geom", version = "0.1.0" }
xrender.rhi.sdl = { path = "../rhi/sdl", version = "0.1.0" }
mcpplibs.os     = "0.4.4"
