doc = """霓 Ni's street: rain at night, neon on wet asphalt. Drum and bass at 168 under
synthwave colours in F minor: a detuned saw lead with a gliding hook, a reese
bass rolling over a sine sub, wide pads pumping under the kick, a plucked
square arpeggio thrown from side to side by the echo, gated saw chords at the
top of the fight, an e-piano for the rain-lit breakdown.

Intensity (0–1) adds parts at the next bar: below 0.35 the lead, the pads, the
sub and a kick with offbeat hats; from 0.35 the reese and a half-time beat;
from 0.6 the two-step beat with ghost snares, the arpeggio, the counter-line
and the crashes; from 0.85 the gated chords and the lead doubled an octave up.

An eight-bar intro (the e-piano and pads, then hats, a riser and a snare roll),
then a loop of 40 bars: the drop (A), its answer (B), the breakdown, the drop
again (A2, everything) and the climax (C), which stops on a bar's breath
before the drop comes round."""

[music]
name = "street"
tempo = 168
meter = [4, 4]
gain = 0.5

# ── patches ──────────────────────────────────────────────────────────────

[patch.lead]
base = "saw_lead"
osc = { unison = 3, detune = 14, spread = 0.5 }
filter = { cutoff = 3800, envelope = 1.4 }
vibrato = { depth = 18, delay = 0.3 }
glide = 0.05

[patch.octave]
base = "pulse_lead"
osc = { width = 0.22 }
filter = { cutoff = 5000 }

[patch.counter]
base = "pulse_lead"
osc = { width = 0.4, pwm = 0.2, pwm_rate = 0.7 }
amp = { attack = 0.06, release = 0.3 }
filter = { cutoff = 1800 }
vibrato = { depth = 8 }

[patch.reese]
base = "saw_bass"
osc = { detune = 26, sub = 0 }
filter = { cutoff = 420, q = 1.3, envelope = 1.6 }
drive = 0.4

[patch.wide]
base = "pad"
osc = { detune = 26 }
amp = { attack = 0.25, release = 0.8 }
filter = { cutoff = 1300 }

[patch.stab]
base = "supersaw"
amp = { attack = 0.003, decay = 0.6, sustain = 0.9, release = 0.12 }
filter = { cutoff = 3200, envelope = 0.5 }

[patch.blip]
base = "arp"
filter = { cutoff = 900, envelope = 3, decay = 0.12 }

[patch.rain_keys]
base = "epiano"
fm = { index = 1.8 }
amp = { decay = 2.6 }

[patch.riser]
engine = "analog"
osc = { wave = "noise" }
amp = { attack = 2.6, decay = 1, sustain = 1, release = 0.08 }
filter = { kind = "bandpass", cutoff = 300, q = 1.5, envelope = 5, attack = 2.7, decay = 1, sustain = 1, release = 0.1 }
gain = 0.6

[patch.dnb_kick]
base = "kick"
drum = { pitch = 52, from = 5, sweep = 0.025, decay = 0.3, click = 0.45 }
drive = 0.35

[patch.dnb_snare]
base = "snare"
drum = { pitch = 205, decay = 0.1, noise = 1, noise_decay = 0.15, click = 0.25 }
filter = { cutoff = 1600 }

# ── instruments ──────────────────────────────────────────────────────────

[instrument.lead]
patch = "lead"
bus = "leads"
gain = 1.0
legato = 0.95
voices = 12
sends = { space = 0.2, echo = 0.18 }

[instrument.octave]
patch = "octave"
bus = "leads"
gain = 0.25
pan = 0.2
legato = 0.9
voices = 4
sends = { space = 0.25, echo = 0.2 }

[instrument.counter]
patch = "counter"
gain = 0.35
pan = -0.35
legato = 0.98
voices = 4
sends = { space = 0.3 }

[instrument.keys]
patch = "rain_keys"
gain = 0.4
pan = 0.15
legato = 1
voices = 8
sends = { space = 0.4, echo = 0.25 }

[instrument.pads]
patch = "wide"
bus = "pads"
gain = 0.33
legato = 1
voices = 10
sends = { space = 0.3 }

[instrument.stab]
patch = "stab"
bus = "pads"
gain = 0.28
legato = 1
voices = 10
gate = "x.xx.x.xx.x.xx.x"
sends = { space = 0.15 }

[instrument.arp]
patch = "blip"
gain = 0.4
pan = -0.2
humanize = 0.2
voices = 6
sends = { echo = 0.35, space = 0.15 }

[instrument.reese]
patch = "reese"
bus = "low"
gain = 0.8
legato = 0.92
voices = 2

[instrument.sub]
patch = "sub_bass"
bus = "low"
gain = 0.7
legato = 1
voices = 2

[instrument.riser]
patch = "riser"
gain = 0.3
legato = 1
voices = 1
sends = { space = 0.4 }

[instrument.kick]
patch = "dnb_kick"
bus = "kick"
gain = 1.0

[instrument.snare]
patch = "dnb_snare"
bus = "drums"
gain = 0.5
humanize = 0.15
sends = { space = 0.2 }

[instrument.clap]
patch = "clap"
bus = "drums"
gain = 0.35
pan = 0.1
sends = { space = 0.3 }

[instrument.hat]
patch = "hat"
bus = "drums"
gain = 0.55
pan = 0.25
humanize = 0.35
choke = "hats"

[instrument.open]
patch = "open_hat"
bus = "drums"
gain = 0.28
pan = 0.25
choke = "hats"

[instrument.crash]
patch = "crash"
bus = "drums"
gain = 0.3
pan = -0.2
sends = { space = 0.2 }

# ── the air (the rain: a hiss through a highpass and drops on the awnings) ────────

[patch.rain]
engine = "analog"
gain = 0.2
osc = { wave = "noise" }
amp = { attack = 1.5, decay = 1, sustain = 1, release = 2 }
filter = { kind = "highpass", cutoff = 1800, q = 0.5 }

[instrument.rain]
patch = "rain"
bus = "air"
gain = 0.45
legato = 1
voices = 2

[instrument.drops]
patch = "hat"
bus = "air"
gain = 0.45
pan = -0.3
humanize = 0.9

# ── buses ────────────────────────────────────────────────────────────────

[bus.air]
effects = [{ kind = "highpass", cutoff = 120 }]

[bus.space]
effects = [
    { kind = "reverb", size = 0.9, damping = 0.3, predelay = 0.03, wet = 1, dry = 0 },
    { kind = "highpass", cutoff = 250 },
]

[bus.echo]
effects = [
    { kind = "echo", beats = 0.75, feedback = 0.4, pingpong = true, wet = 1, dry = 0 },
    { kind = "highpass", cutoff = 350 },
    { kind = "lowpass", cutoff = 6000 },
]

[bus.leads]
effects = [{ kind = "chorus", delay = 0.009, depth = 0.002, rate = 0.8, wet = 0.35 }]

[bus.pads]
effects = [{ kind = "chorus", delay = 0.015, depth = 0.004, rate = 0.25, wet = 0.4 }]
duck = { key = "kick", depth = 0.7, threshold = 0.3, attack = 0.003, release = 0.22 }

[bus.low]
duck = { key = "kick", depth = 0.55, threshold = 0.3, attack = 0.002, release = 0.12 }

[bus.kick]

[bus.drums]

