# omui.theme.compact — the compact theme file (compact.theme.omui.ts), embedded:
# add_compact() adds what it declares to the program's theme library
# (omui.theme). The partition holding the text is generated
# (`omui-gen embed`; tools/gen's test keeps it current).
[package]
namespace   = "omui.theme"
name        = "compact"
version     = "0.1.0"
description = "openmui's compact theme as data"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind   = "theme"
themes = ["compact.theme.omui.ts"]

[targets.openmui-theme-compact]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/generated/*.cppm"]

[dependencies]
omui.theme = { path = ".." }

[dev-dependencies]
mcpplibs.mtest = "0.5.2"
mlibs.utils = { path = "../../../../base/utils" }
