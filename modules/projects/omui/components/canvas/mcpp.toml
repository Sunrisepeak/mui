# omui.ui.canvas — the infinite canvas's core (canvas-markdown §1,
# OMUI_EXT_canvas): a scene stored by column with a grid index, a camera in
# double precision, tiers of detail per node kind (instanced boxes, a kind's
# own drawing, a live component), pan / zoom about the cursor / pinch /
# fling, named views on springs, and semantics that state what is on screen
# and find anything in the scene. Beside it, src/kit (module omui.ui.canvas.kit,
# canvas-markdown §1.1, the optional layer): select, drag, resize, snap
# (alignment guides, a grid), connect, grid, minimap and delete, as behaviours a
# canvas names in `behaviors`, each adding to the semantic tree what it makes
# possible; and declarative ones, statecharts in *.behavior.omui.ts run by C++.
# Contract-first (omui.build.contracts).
[package]
namespace   = "omui.ui"
name        = "canvas"
version     = "0.1.0"
description = "An infinite canvas (a columnar scene with a grid index, a double-precision camera, tiers of detail, live promotion, semantic queries) and its kit: selection, dragging, handles, snapping, connectors, minimap, declarative behaviours"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
reexports = ["omui.core", "omui.view"]  # what its interface re-exports (lint module-closure)
kind = "component"
agent = { part = "omui.agent" }

[targets.openmui-ui-canvas]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp", "src/kit/*.cppm", "src/kit/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
xrender.text = { path = "../../../xrender/text" }
omui.core   = { path = "../../core" }
omui.view   = { path = "../../view" }
xrender.vector = { path = "../../../xrender/vector" }
mlibs.memory = { path = "../../../../base/memory" }
xrender.raster = { path = "../../../xrender/raster" }
mlibs.geom   = { path = "../../../../base/geom" }
mlibs.text   = { path = "../../../../content/text" }
hanim.core          = { path = "../../../hanim/core" }
mlibs.utils  = { path = "../../../../base/utils" }
omui.expr    = { path = "../../expr" }              # the kit's declarative behaviours
mlibs.json   = { path = "../../../../base/json" }   # … read as their JSON

[build-dependencies]
omui.build = { path = "../../../../../mcpp/build", host-module = true }

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
omui.host.headless = { path = "../../host/headless" }
