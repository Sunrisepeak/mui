# meng.ui — a game inside openmui (structure, render, web and game design §7):
# its steps paced on the runtime's clock (a timer at the next step due, every
# step due taken, a stall not owed, frames asked for while it runs), and
# openmui's keys and pointer given to meng.input — what the interface does not
# use, the game gets (D-76). The only mgame package that knows openmui.
[package]
namespace   = "meng"
name        = "ui"
version     = "0.1.0"
description = "A game inside openmui: its steps paced on the runtime's clock, openmui's keys and pointer given to its actions"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "preview"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "closure: the one bridge that knows both meng and omui (D-161)"
agent = { part = "meng.runtime" }

[targets.mgame-ui]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
omui.core = { path = "../../../omui/core" }
omui.view = { path = "../../../omui/view" }
meng.input = { path = "../input" }
mlibs.simulation = { path = "../../../../base/simulation" }
mlibs.agent = { path = "../../../../base/agent" }
mlibs.layout = { path = "../../../../content/layout" }
mrender.raster = { path = "../../../mrender/raster" }
mrender.vector = { path = "../../../mrender/vector" }
mlibs.rhi = { path = "../../../../gfx/rhi" }

[dev-dependencies]
"mlibs.text.harfbuzz" = { path = "../../../../content/text/harfbuzz" }  # the shaper its tests draw text with (mlibs.text's slot)
mcpplibs.mtest = "0.8.4"
mlibs.utils = { path = "../../../../base/utils" }
omui.host.headless = { path = "../../../omui/host/headless" }
omui.semantic = { path = "../../../omui/semantic" }
mrender.mesh = { path = "../../../mrender/mesh" }
mrender.scene = { path = "../../../mrender/scene" }
mrender.text = { path = "../../../mrender/text" }
mlibs.text = { path = "../../../../content/text" }
mlibs.geom = { path = "../../../../base/geom" }
mlibs.math = { path = "../../../../base/math" }
mlibs.control = { path = "../../../../base/control" }
