# mlibs.raster — a deterministic CPU 2D rasterizer: exact integer coverage,
# gradients, images, strokes, clips, layers with blend modes, shadows (D-43).
# The same drawing is the same bytes on every platform.
[package]
namespace   = "mlibs"
name        = "raster"
version     = "0.1.0"
description = "Deterministic CPU 2D rasterizer: paths, strokes, gradients, images, clips, layers, blend modes, shadows"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "backend"

[targets.mlibs-raster]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
mlibs.hash = { path = "../../base/hash" }
mlibs.geom = { path = "../../base/geom" }
hanim.core        = { path = "../../base/hanim/core" }

[dev-dependencies]
mlibs.testing = { path = "../../base/testing" }
