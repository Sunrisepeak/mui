# Example 06 — theming (canvas-markdown §5; component-binding §11): a theme
# preview, written in TypeScript and run by the player. The components and the
# tokens under any composition — light, dark or the application's own brand,
# compact or not, with reduced motion or not — switched from the script
# (omui.theme). Themes are data (*.theme.omui.ts): openmui's default and
# compact packages, and themes/brand.theme.omui.ts, which the player
# reloads when it is saved. The semantic tree is the same under all of them.
#
#   mcpp run                       a window; edit themes/brand.theme.omui.ts
#   mcpp run -- --headless --png preview.png
[package]
namespace   = "omui.example"
name        = "theming"
version     = "0.1.0"
description = "openmui example 06: a theme preview in TypeScript — compositions, density, motion, an application's own theme file"
license     = "Apache-2.0"

[package.metadata.openmui]
kind   = "app"
id     = "org.openmui.theme-preview"
title  = "Theme preview"
size   = "640x560"
themes = ["themes/*.theme.omui.ts"]
theme  = ["light"]

[package.metadata.openmui.scripts]
main = "logic/main.ts"

[targets.theme-preview]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/*.cpp"]

[dependencies]
omui.entry.player = { path = "../../src/entry/player" }

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
mlibs.utils       = { path = "../../modules/base/utils" }
omui.player        = { path = "../../modules/projects/omui/player" }
omui.lang.js       = { path = "../../modules/projects/omui/lang/js" }
omui.theme.default = { path = "../../modules/projects/omui/theme/default" }
omui.theme.compact = { path = "../../modules/projects/omui/theme/compact" }
