# 璃 (Li), glass: how she looks and how her hits feel (gongfu characters 2 design §2.4;
# the hardcore combat design). A glass artisan who fights: a pale blue-grey jacket with
# a mandarin collar, frosted-glass toggles and an ice-crackle print on its panels; a
# slate sash with a trailing end and a tassel of glass beads; wide sleeve cuffs over
# faceted glass bracers; a silver bob with a prism hairpin. Unarmed: knife-hand cuts,
# palm strikes, long precise kicks; panes are her set-up. Angles are degrees,
# counter-clockwise; keys by frame. In a bone's frame x runs along it and y across:
# for a bone pointing up, +y is her back.
gongfu = "0.1"
name = "li"
outline = { color = "#eef8ff", width = 1.6 }
accent = "#7fd3ff"
art_scale = 0.4
trail = { color = "#bfe6ff", frames = [2, 4], alpha = 0.26 }
light = { from = [-0.62, -0.78], shade = 0, darken = 0.3, shadow = "#1d2a3a", rim = 0, rim_color = "#eef8ffaa" }
pane = { glass = "#bfe6ff3d", edge = "#eef8ffd9", shine = "#ffffff8c", reflect = "#ffd36be6", picture = "fx", whole = [97, 4, 42, 115], cracked = [143, 4, 43, 114] }

[[palette]]
name = "glass"
glass = "#bfe6ff"

[[palette]]
name = "smoke"
glass = "#ffd6f0"

