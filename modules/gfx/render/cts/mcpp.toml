# Desktop device CTS only. No runtime artifact or empty library target.
[package]
namespace = "xengine.render"
name = "cts"
version = "0.1.0"
description = "Desktop device conformance for rendering graphs, vector pixels and effects"
license = "Apache-2.0"
platforms = ["linux", "macos", "windows"]
repo = "https://github.com/Sunrisepeak/mui"

[build]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dev-dependencies]
"xengine.render" = { path = ".." }
"xengine.render.vector" = { path = "../vector" }
"mlibs.rhi" = { path = "../../rhi" }
"mlibs.rhi.sdl" = { path = "../../rhi/sdl" }
mlibs.geom = { path = "../../../base/geom" }
mlibs.memory = { path = "../../../base/memory" }
mlibs.raster = { path = "../../raster" }
mlibs.image = { path = "../../../base/image" }
mlibs.utils = { path = "../../../base/utils" }
mcpplibs.os = "0.2.2"
