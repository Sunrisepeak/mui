# 岳's mountain gate (the quality design's §5): an ancient stone gateway high
# above a sea of clouds at sunset, painted in layers (stages/art, generated
# and keyed by gongfu-studio): the cloud sea with peaks and pines rising out
# of it and the low sun; a weathered stone paifang with guardian lions, old
# pines on the rock, stairs rising behind and faded banners; a plaza of worn
# granite slabs with moss in the joints, the sunset raking across; a bronze
# incense cauldron smoking on stacked stone, and a great temple bell in its
# frame with stone weights; a pine branch and drifting cloud in front. The
# light comes from the sun, low on the right.
gongfu = "0.1"
name = "gate"
sky = ["#3a2a4a", "#e8907a"]
floor = "#4a3a36"
line = "#2a201e"
marks = false
light = { from = [0.8, -0.6], shadow = "#2a1830", rim_color = "#ffc078cc", color = "#ffc690" }

[[picture]]
name = "far"
file = "art/gate-far.webp"
size = [1152, 768]

[[picture]]
