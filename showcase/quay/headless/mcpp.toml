# Quay as a game on its own (D-162; the FPS slice design, F2): its simulation as xengine.runtime plays it — stepped
# without omui, sought back and branched ahead, played by an agent through the agent kernel shown only what the
# watchkeeper sees and hears.
[package]
namespace   = "omui.showcase.quay"
name        = "headless"
version     = "0.1.0"
description = "Quay on its own: the simulation as a game the runtime steps, rewinds and branches, and an agent plays as a person; no interface"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[targets.quay-headless]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
omui.showcase.quay.sim = { path = "../sim" }
xengine.runtime = { path = "../../../modules/projects/xengine/game/runtime" }
mlibs.math      = { path = "../../../modules/base/math" }

[dev-dependencies]
mcpplibs.mtest   = "0.8.4"
mlibs.agent      = { path = "../../../modules/base/agent" }
mlibs.json       = { path = "../../../modules/base/json" }
xengine.playtest = { path = "../../../modules/projects/xengine/game/playtest" }
