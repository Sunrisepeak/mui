# mrender.vector — 2D vector rendering, a rendering feature of
# mrender (D-81): the display list of contract ⑤, its CPU reference
# backend and its GPU backend (D-57). Knows nothing of nodes or views;
# anything that produces a display list can render it.
[package]
namespace   = "mrender"
name        = "vector"
version     = "0.1.0"
description = "2D vector rendering: the display list, its CPU reference renderer and its GPU renderer, byte-for-byte where it can be"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"
platforms   = ["linux", "macos", "windows", "emscripten"]

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "library: paths and paint for every 2D drawing"
reexports = ["mrender.display", "mrender.graph"]  # what its interface re-exports (lint module-closure)
kind = "backend"
agent = { part = "mrender.frame" }

[targets.mrender-vector]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp", "src/generated/*.cppm", "src/svg/*.cppm", "src/svg/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

# Pictures on bones in 2D (src/sprite/, module mrender.sprite): 2D skinning — a picture's region laid on a bone
# as a grid of cells, each corner going over to the next bones across their joints; `draw_mesh` draws what it
# makes. A feature (release plan §4.2 rule 3: one consumer, gongfu.present2d), a function of what it is given.
[features]
sprite = { sources = ["src/sprite/*.cppm", "src/sprite/*.cpp"] }

[build-dependencies]
mlibs.shader.rules = { path = "../../../gfx/shader/rules", host-module = true }

[dependencies]
mlibs.math = { path = "../../../base/math" }
mlibs.utils = { path = "../../../base/utils" }
mrender.graph = { path = "../graph" }
mrender.display = { path = "../display" }  # the display list it renders (re-exported)
mlibs.rhi    = { path = "../../../gfx/rhi" }
mlibs.geom   = { path = "../../../base/geom" }
mlibs.memory = { path = "../../../base/memory" }
mrender.raster = { path = "../raster" }

# The files of tests/vector/ are one program, run a file at a time: one link of the closure for all of them. Files
# directly in tests/ stay a program each: they count allocations with an operator new of their own.
[test]
programs = "directory"
features = ["sprite"]  # tests/vector/sprite_test.cpp

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
mlibs.image   = { path = "../../../base/image" }
mcpplibs.os     = "0.4.4"
