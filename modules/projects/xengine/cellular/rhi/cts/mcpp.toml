[package]
namespace = "xengine.cellular.rhi"
name = "cts"
version = "0.1.0"
description = "Integer cellular CPU/GPU conformance on a caller-provided RHI device"
license = "Apache-2.0"
platforms = ["linux", "macos", "windows", "emscripten"]
repo = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "backend"

[targets.xengine-cellular-rhi-cts]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
xengine.cellular = { path = "../.." }
"xengine.cellular.rhi" = { path = ".." }
mlibs.rhi = { path = "../../../../../gfx/rhi" }
mlibs.utils = { path = "../../../../../base/utils" }
mlibs.cts = { path = "../../../../../base/cts" }

# The suite run on a device (tests/sdl_test.cpp): the owner depends on a backend
# for its tests, never a backend on its consumers (D-161).
[dev-dependencies]
mcpplibs.mtest  = "0.5.2"
xrender.rhi.sdl = { path = "../../../../xrender/rhi/sdl" }
mcpplibs.os     = "0.4.4"
