# The signature features (Part 2 plan §1.5, §4; D-135, D-136): two to four
# headline features a project, the rest foundations. lint `lead`
# (tools/eval/lead.py check) holds this list to the ledger:
#
#   status = "planned"    designed, no signature scene yet
#            "evidence"   its signature scene (`scene`, a test) exists and runs in CI
#            "claimed"    and the ledger has a far_ahead capability or task record:
#                         only now may it be called far ahead in public
#   line   = "use-safely" | "build-reliably" | "together"   the three lines (§1.5)
#            "craft"        a headline feature of quality or engineering
#            "foundation"   under the headline features, not counted as one

# --- omui -------------------------------------------------------------------

[[feature]]
id = "A"
project = "omui"
line = "use-safely"
title = "先预演，再授权：Agent 的操作先在分支里执行并画出来，人同意才提交"
status = "evidence"
scene = "tools/mcp/tests/mcp_test.cpp"
competitors = ["webmcp", "playwright-mcp", "app-intents"]

[[feature]]
id = "B"
project = "omui"
line = "build-reliably"
title = "用 AI 写 UI 最顺手：确定的像素与语义、像素到源码，写看改闭环"
status = "evidence"
scene = "tools/mcp/tests/mcp_test.cpp"
competitors = ["react-vite-playwright", "flutter"]

[[feature]]
id = "C"
project = "omui"
line = "use-safely"
title = "零代码的 Agent 接口：语义树自动投影为 MCP、WebMCP 的类型化操作，授权由 openas 判定"
status = "evidence"
scene = "tools/mcp/tests/mcp_test.cpp"
competitors = ["webmcp", "playwright-mcp", "mcp-apps"]

[[feature]]
id = "D"
project = "omui"
line = "together"
title = "人机同屏共在：Agent 的身体与意图可见，人随时接管，冲突有规则"
status = "planned"
competitors = ["webmcp", "a2ui"]

[[feature]]
id = "omui.one-tree"
project = "omui"
line = "foundation"
title = "一棵语义树驱动像素、读屏、Agent 和测试四种视图"
status = "planned"
competitors = ["flutter-semantics", "react-aria"]

[[feature]]
id = "omui.universal-motion"
project = "omui"
line = "foundation"
title = "通用动效：0 声明过渡，打断时速度连续"
status = "planned"
competitors = ["swiftui", "framer-motion", "view-transitions"]

[[feature]]
id = "omui.pixel-audit"
project = "omui"
line = "foundation"
title = "像素可审查、可回放：CPU 像素五平台逐位，像素归属到节点"
