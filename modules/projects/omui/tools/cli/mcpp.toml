# omui — the openmui command line (plan §2.2): agent operations against any
# running application; check, fmt and schema for view documents; add and bench
# as their members land. A view's films are the engine's video toolkit with
# omui's sources, composed by xtools (the engine's tier, D-231); `omui
# design.film` runs `xtools video render` as a program.
[package]
namespace   = "omui"
name        = "cli"
version     = "0.1.0"
description = "The openmui command line: omui agent (ls, describe, snapshot, act …), check, fmt, schema and mcp"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
reexports = ["mlibs.agent"]  # what its interface re-exports (lint module-closure): films() is an mlibs.agent Subject
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "product: the omui command"
lower = ["mlibs.project"]  # lower-labelled parts it uses, each marked in its README
kind = "tool"
agent = { part = "omui.agent" }  # the `omui` command: the agent operations of omui.agent's catalog, at the application's endpoint (D-174)

[targets.omui-cli]
kind = "lib"  # the toolkit's library: what `omui` runs, and what a composition (xtools) runs the same way

[targets.omui]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/catalog/*.cppm", "src/generated/*.cppm"]

[dependencies]
omui.core        = { path = "../../core" }
omui.agent       = { path = "../../agent" }
# A design's history store (omui design sync): the agent kernel's, with no designer linked.
mlibs.agent      = { path = "../../../../base/agent" }
omui.mcp         = { path = "../mcp" }
omui.viewdoc     = { path = "../../viewdoc" }
omui.lang.ts     = { path = "../../lang/ts" }
mlibs.ts         = { path = "../../../../base/ts" }  # strip_types: a data module's syntax checked (typecheck)
omui.ui.base     = { path = "../../components/base" }
omui.ui.markdown = { path = "../../components/markdown" }
omui.host.headless = { path = "../../host/headless" }
mcpplibs.os      = "0.4.4"
mlibs.project = { path = "../../../../base/project" }  # omui doctor: the project's health (general rules, omui's profiles)
marzer.tomlplusplus = "3.4.0"

[dev-dependencies]
# Tests are mtest's (D-147).
mcpplibs.mtest = "0.8.4"
mlibs.utils       = { path = "../../../../base/utils" }
