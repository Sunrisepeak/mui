# omui.lang.python.embedded — Python embedded in a C++ program, with
# PocketPy 2.2 (mcpplibs.mwrap.pocketpy, pocketpy-m) on the Script Binding
# Profile (component-binding §7): the `openmui` module (builders, signals with
# expression operators, regions, verbs, models, the semantic tree), running on
# omui.lang's script thread. A script reads as it does in host mode
# (modules/projects/omui/lang/python, CPython loading openmui): `import openmui as omui`.
[package]
namespace   = "omui.lang.python"
name        = "embedded"
version     = "0.1.0"
description = "openmui for Python embedded (PocketPy): builders, signals, expressions, verbs, models and the semantic tree"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "lang"

[targets.openmui-lang-python-embedded]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/native/*.cpp"]

[dependencies]
omui.lang   = { path = "../.." }
omui.abi    = { path = "../../../abi" }
omui.player = { path = "../../../player" }
nlohmann.json = "3.12.0"
mcpplibs.mwrap.pocketpy = "2.2.0"

[dev-dependencies]
mlibs.utils       = { path = "../../../../../base/utils" }
omui.cts           = { path = "../../../../../../tests/cts" }
omui.native.fuzzy  = { path = "../../../native/fuzzy" }
omui.theme.default = { path = "../../../theme/default" }
omui.theme.compact = { path = "../../../theme/compact" }
omui.ui.base       = { path = "../../../components/base" }
