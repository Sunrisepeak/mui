# omui.accessibility.bridge — the platform's assistive-technology service
# through AccessKit's C bindings (mcpp-index's compat.accesskit, imported as
# the module mcpplibs.mwrap.accesskit): UI Automation on Windows,
# NSAccessibility on macOS, AT-SPI over D-Bus on Linux. A package of its own
# (B6) so an application that leaves it out does not carry AccessKit; where
# AccessKit has no library (Linux arm64, x86_64 macOS, the Web, Android)
# `install` installs nothing.
[package]
namespace   = "omui.accessibility"
name        = "bridge"
version     = "0.1.0"
description = "The platform's assistive-technology service for omui.accessibility, through AccessKit"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "platform: AccessKit's bridges to UIA, NSAccessibility and AT-SPI, desktop only; an application may leave them out"
kind = "runtime"
agent = { part = "omui.agent" }

[package.metadata.openmui.compose]
provides = ["omui.accessibility.service"]  # AccessKit's, by platform

[targets.openmui-accessibility-bridge]
kind = "lib"

[build]
sources = ["src/*.cppm"]

# AccessKit's prebuilt libraries: Linux x86_64, macOS arm64, Windows x86_64.
[target.'cfg(any(all(os = "linux", arch = "x86_64"), all(os = "macos", arch = "aarch64"), all(os = "windows", arch = "x86_64")))'.build]
sources = ["src/native/accesskit/*.cppm", "src/native/accesskit/*.cpp"]

[target.'cfg(any(all(os = "linux", arch = "x86_64"), all(os = "macos", arch = "aarch64"), all(os = "windows", arch = "x86_64")))'.dependencies]
mcpplibs.mwrap.accesskit = "0.23.1"

# The service of each: AT-SPI, NSAccessibility, UI Automation.
[target.'cfg(all(os = "linux", arch = "x86_64"))'.build]
sources = ["src/native/accesskit/unix/*.cpp"]

[target.'cfg(all(os = "macos", arch = "aarch64"))'.build]
sources = ["src/native/accesskit/macos/*.cpp"]

[target.'cfg(all(os = "windows", arch = "x86_64"))'.build]
sources = ["src/native/accesskit/windows/*.cpp"]

[target.'cfg(not(any(all(os = "linux", arch = "x86_64"), all(os = "macos", arch = "aarch64"), all(os = "windows", arch = "x86_64"))))'.build]
sources = ["src/native/none/*.cpp"]

[dependencies]
omui.accessibility = { path = ".." }
omui.core          = { path = "../../core" }
omui.view          = { path = "../../view" }
mlibs.utils        = { path = "../../../../base/utils" }  # mlibs.error, mlibs.trace

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
