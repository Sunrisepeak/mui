name: Nightly

# What the nightly run asserts (implementation plan §15.2, §19.1 "内存"):
#
#   sanitize  every workspace member's tests pass under AddressSanitizer and
#             UndefinedBehaviorSanitizer (the `sanitize` profile of the root
#             mcpp.toml: every unit of the graph instrumented, the first
#             finding fatal). LLVM: GCC 16.1's UBSan null check crashes the
#             compiler on std::variant visitation inside `import std`.

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC every day
  workflow_dispatch:
  # A change to this workflow or to the profile it runs (mcpp.toml) is
  # checked on its pull request, before it can only fail at night.
  pull_request:
    paths: [".github/workflows/nightly.yml", "mcpp.toml"]

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  XLINGS_VERSION: v2026.10.26.1
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  sanitize:
    name: ASan + UBSan (ubuntu-24.04, llvm@23.1.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install mcpp
        run: |
          # The mcpp every row builds with is the project's (.xlings.json), the one
          # the work is checked with locally; in the project, xlings runs that one.
          MCPP_VERSION="$(sed -n 's/.*"mcpp": *"\([^"]*\)".*/\1/p' .xlings.json)"
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 6 ] && { echo "::error::mcpp could not be installed"; exit 1; }
            sleep 60
          done
          mcpp --version | tee /dev/stderr | grep -q "$MCPP_VERSION" || { echo "::error::not mcpp $MCPP_VERSION"; exit 1; }
          mcpp self config --mirror GLOBAL

      - name: Select the toolchain
        run: |
          mcpp toolchain install llvm 23.1.3
          mcpp toolchain default llvm@23.1.3

      - name: Install esbuild (TypeScript is compiled to JavaScript; lang/js, examples 02 and 03)
        run: |
          for attempt in 1 2 3; do
            if xlings install esbuild -y -g; then break; fi
            [ "$attempt" = 3 ] && { echo "::error::esbuild could not be installed"; exit 1; }
            sleep 30
          done
          esbuild --version

      # The Python binding's suite runs the instrumented extension in the
      # system's CPython, which needs the sanitizer's runtime preloaded
      # (src/entry/python/tests/python_test.cpp).
      - name: The sanitizer's shared runtime, for the Python binding
        run: |
          rt=$(find "$HOME/.mcpp" -path '*llvm/23.1.3/*' \( -name 'libclang_rt.asan.so' -o -name 'libclang_rt.asan-x86_64.so' \) | head -1)
          [ -n "$rt" ] || { echo "::error::no shared ASan runtime in the llvm@23.1.3 toolchain"; exit 1; }
          echo "OMUI_ASAN_RUNTIME=$rt" >> "$GITHUB_ENV"

      - name: SDL's offscreen video driver (the desktop host's tests open windows)
        run: echo "SDL_VIDEO_DRIVER=offscreen" >> "$GITHUB_ENV"

      - name: Every member under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mcpp test --workspace --profile sanitize --exclude openmui.entry.python --exclude openmui.reflect 2>&1 | tee sanitize.log
          grep -q "workspace result ok" sanitize.log || { echo "::error::a test failed under the sanitizers"; exit 1; }
          if grep -qE "ERROR: AddressSanitizer|runtime error:|ERROR: LeakSanitizer" sanitize.log; then
            echo "::error::the sanitizers reported a finding"; exit 1
          fi

      # The Python extension last (mcpp-community/mcpp#846; see ci.yml).
      - name: Whether this mcpp links the Python extension
        id: python
        run: tools/ci/python-extension-probe.sh sanitize

      - name: The Python binding under ASan and UBSan
        if: steps.python.outputs.ok == 'true'
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mcpp test -p openmui.entry.python --profile sanitize 2>&1 | tee -a sanitize.log
          grep -q "test result ok" sanitize.log || { echo "::error::the Python binding failed under the sanitizers"; exit 1; }

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitize-log
          path: sanitize.log
          if-no-files-found: ignore
