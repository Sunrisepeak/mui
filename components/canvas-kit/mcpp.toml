# openmui.ui.canvas_kit — what a canvas can do beyond panning and zooming
# (canvas-markdown §1.1, the optional layer): select, drag, resize, snap
# (alignment guides, a grid), connect, grid, minimap and delete, as
# behaviours a canvas names in `behaviors`, each adding to the semantic tree
# what it makes possible (a node's `move_to` exists because drag is on); and
# declarative ones, statecharts in *.behavior.omui.toml run by C++.
[package]
namespace   = "openmui.ui"
name        = "canvas_kit"
version     = "0.1.0"
description = "Canvas behaviours: selection with marquee, dragging, resize handles, snapping with guides, connectors, grid, minimap, delete; declarative statecharts"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "component"

[targets.openmui-ui-canvas-kit]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp", "src/native/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
openmui.core        = { path = "../../runtime/core" }
openmui.view        = { path = "../../runtime/view" }
openmui.render      = { path = "../../modules/render" }
openmui.ui.canvas   = { path = "../canvas" }
openmui.expr        = { path = "../../runtime/expr" }
openmui.anim        = { path = "../../modules/anim" }
openmui.raster      = { path = "../../modules/raster" }
marzer.tomlplusplus = "3.4.0"

[dev-dependencies]
openmui.testing       = { path = "../../tests/support" }
openmui.host.headless = { path = "../../hosts/headless" }
