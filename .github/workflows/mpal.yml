name: mpal

# mpal on every system, minutes after a change to it (the full matrix takes
# about two hours): each system's own services — the session bus on Linux,
# the notification centre on macOS, toasts on Windows — exercised where they
# are. mpal depends on nothing in this repository but mcpplibs.os.
on:
  pull_request:
    paths:
      - 'modules/mpal/**'
      - '.github/workflows/mpal.yml'
  workflow_dispatch:

concurrency:
  group: mpal-${{ github.ref }}
  cancel-in-progress: true

env:
  XLINGS_VERSION: v2026.10.26.1
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  test:
    name: mpal ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install mcpp
        run: |
          MCPP_VERSION="$(sed -n 's/.*"mcpp": *"\([^"]*\)".*/\1/p' .xlings.json)"
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 6 ] && { echo "::error::mcpp could not be installed"; exit 1; }
            sleep 60
          done
          mcpp --version
          mcpp self config --mirror GLOBAL
          mcpp toolchain install llvm 23.1.3
          mcpp toolchain default llvm@23.1.3

      - name: A session bus on Linux (dbus-daemon for the real-bus case)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y dbus > /dev/null

      - name: mpal's tests
        run: mcpp test -p mpal
