# 墨's study (书斋), the fighting game quality design §5: dark wooden walls (so
# both a white robe and a black jacket read against them), a lattice window
# glowing with the afternoon behind the fighters, bamboo swaying on its paper,
# a hanging scroll and a shelf of scrolls; wooden boards underfoot; a low desk
# with a brush pot at the edge of the picture. The light comes in through the
# window, from the upper left: every fighter here is lit by it.
gongfu = "0.1"
name = "study"
sky = ["#4f3d2f", "#3f3126"]
floor = "#6a4e3b"
line = "#3a281c"
marks = false
light = { from = [-0.62, -0.78], shadow = "#3a2a1f", rim_color = "#fff3d6cc" }

