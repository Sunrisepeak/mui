# 霓's street (the fighting game quality design §5): a rainy night in a neon
# district — a far skyline of lit windows, shopfronts whose signs hum and
# flicker in magenta and cyan, a street lamp's cone, rain falling in front and
# behind, and the wet road giving the signs back as long trembling streaks.
# The light comes from the signs, upper right: a cyan rim on whoever stands here.
gongfu = "0.1"
name = "street"
sky = ["#07081a", "#1d1236"]
floor = "#0d0f20"
line = "#2a2f55"
marks = false
light = { from = [0.55, -0.83], shadow = "#030208", rim_color = "#3ef2ffbb" }

# The skyline, far and still but for its windows.
[[layer]]
name = "skyline"
parallax = 0.12
repeat = 1400
[[layer.shape]]
