# omui.lang.ts — omui's TypeScript over the tool kernel's (mlibs.ts, D-209):
# omui's data formats (the kinds and the define modules "openmui/define" and
# "omui/define", with their declarations), the declarations of components and
# native modules, and the edits of a view's builder calls (Live Design).
#
# A package of its own (D-99): the runtime (omui.lang.js) and the build-time
# generator (omui-gen) both read omui's TypeScript, and the generator must not
# depend on the runtime.
[package]
namespace   = "omui.lang"
name        = "ts"
version     = "0.1.0"
description = "omui's TypeScript: its data formats, declarations, and edits of builder calls (over mlibs.ts)"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
kind = "lang"
agent = { library = "declarations and edits of TypeScript: functions of the source" }

[targets.openmui-lang-ts]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
mlibs.ts    = { path = "../../../../base/ts" }  # the tool kernel's TypeScript: blanking, evaluation
mlibs.utils = { path = "../../../../base/utils" }  # mlibs.error: why a call cannot be edited

[dev-dependencies]
# Tests are mtest's (D-147).
mcpplibs.mtest = "0.8.4"
mlibs.cts = { path = "../../../../base/cts" }
