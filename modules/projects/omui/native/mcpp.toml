# omui.native — the native modules of a program (component-binding §8):
# functions written in C++ behind a `*.native.omui.toml` contract, registered
# once and called by scripts through the C ABI (omuiNativeCall). The
# contract's types check every call's arguments here, in one place; the code
# `omui-gen native` generates only converts them. The official native modules are here too (modules/<name>/: its
# contract under native/, src/ with the generated binding, stubs/ for scripts): fuzzy (matching and ranking with
# highlight positions) and store (a program's small key-value storage, the Store plugin a host gives). Each keeps
# its module (omui.native.fuzzy, omui.native.store) and is registered by a call; a native module of one's own is a
# package of its own (templates/native).
[package]
namespace   = "omui"
name        = "native"
version     = "0.1.0"
description = "openmui's native-module registry: contract-typed C++ functions scripts call"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "library: native modules every host and script reaches"
kind = "runtime"
agent = { part = "omui.agent" }

[targets.openmui-native]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp", "modules/*/src/*.cppm", "modules/*/src/*.cpp", "modules/*/src/generated/*.cppm"]
cxxflags = ["-ffp-contract=off"]  # fuzzy's ranking: the same order everywhere

[dependencies]
nlohmann.json = "3.12.0"
mlibs.unicode = { path = "../../../base/unicode" }  # fuzzy's

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
mlibs.utils = { path = "../../../base/utils" }
