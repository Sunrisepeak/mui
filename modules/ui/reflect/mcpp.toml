# openmui.reflect — C++26 reflection's convenience layer (D-39): a form from a
# struct's members, a struct as openmui's values and back. GCC 16 with
# -freflection only, and nothing else depends on it: the core is C++23
# (contracts are its alternative). CI builds it on the GCC rows.
[package]
namespace   = "openmui"
name        = "reflect"
version     = "0.1.0"
description = "C++26 reflection for openmui: forms from structs, structs as values (GCC 16, -freflection)"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"
standard    = "c++26"

[package.metadata.openmui]
kind = "runtime"

[targets.openmui-reflect]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-freflection"]

[dependencies]
openmui.core = { path = "../core" }
openmui.view = { path = "../view" }

[dev-dependencies]
openmui.testing       = { path = "../../base/testing" }
openmui.ui.base       = { path = "../../../components/base" }
openmui.host.headless = { path = "../host/headless" }
