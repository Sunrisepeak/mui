# Sanitizers (plan §19.1 "内存"): AddressSanitizer and UndefinedBehavior-
# Sanitizer over every unit of the graph, the first finding fatal. CI runs
# `mcpp test --workspace --profile sanitize` nightly on Linux.
[workspace.profile.sanitize]
opt      = 1
debug    = true
cflags   = ["-fsanitize=address,undefined", "-fno-omit-frame-pointer", "-fno-sanitize-recover=all"]
cxxflags = ["-fsanitize=address,undefined", "-fno-omit-frame-pointer", "-fno-sanitize-recover=all"]
ldflags  = ["-fsanitize=address,undefined"]

# The Web (D-84): wasm32-emscripten. Exceptions, as the libraries that throw
# need them (JSON, TOML; the native units that catch); memory that grows; a
# stack of 1 MiB (Emscripten's default, 64 KiB, is one buffer of
# mcpplibs.os's reads).
[workspace.target.'cfg(os = "emscripten")'.abi]
exceptions = true

#
# Single-threaded (D-84: no SharedArrayBuffer on Pages or Toy): some index
# packages' `linux` link flags (taskflow's -pthread, harfbuzz's and libwebp's
# -lpthread) reach the emscripten row too, and -pthread would make the
# program's memory shared — which these objects, built without atomics,
# cannot link into. USE_PTHREADS=0 (applied after the flags) undoes it.
[workspace.target.'cfg(os = "emscripten")'.build]
ldflags = ["-sALLOW_MEMORY_GROWTH=1", "-sSTACK_SIZE=1048576", "-sUSE_PTHREADS=0"]

# The test programs on the Web row run under node and read their fixtures
# beside their sources, as on every other row: node's file system, not the
# in-memory one a page has. CI's wasm row: `mcpp test --target
# wasm32-emscripten --profile wasm-test`.
[workspace.profile.wasm-test]
opt     = 1
debug   = false
ldflags = ["-sNODERAWFS=1"]

# The test programs that need a browser (tools/ci/browser.sh runs them in
# headless Chromium): linked to suspend for the page's promises — what
# waiting for WebGPU and reading its textures back take — and to say their
# exit code to the page. Asyncify, not JSPI: JSPI makes the exceptions'
# invoke_ imports suspending, and a static constructor that reaches a try
# block then fails outside WebAssembly.promising.
# Its stack for what is unwound while waiting: 64 KiB — mtest's runner sits
# above a waiting case, more than the default 4 KiB holds (it trapped,
# `unreachable`, red list 45).
[workspace.profile.wasm-browser]
opt     = 1
debug   = false
ldflags = ["-sASYNCIFY=1", "-sASYNCIFY_STACK_SIZE=65536", "-sEXIT_RUNTIME=1"]

# The Web's bytes, looked into (W8; tools/ci/wasm-size.sh): the release
# build's code (-O2) with its functions' names kept in a name section, for
# `omui-gen wasm-size` to say where they go.
[workspace.profile.wasm-size]
opt     = 2
debug   = false
ldflags = ["--profiling-funcs"]

# The shipped Emscripten website uses LLVM -Oz for size; the normal native
# release profile remains available for performance checks.
# Delivery and interactive frame budgets are both checked in Chromium.
[workspace.profile.site-web]
opt        = "z"
debug      = false
ndebug     = true
trim_paths = true

[workspace.package]
standard = "c++23"
mcpp     = ">=2026.10.26.1"

# MinGW GCC 16 emits the function-local statics of inline standard-library
# functions instantiated in module units (std::variant's __reasons,
# make_shared's type tag) as strong symbols, so two units of one program define
# them twice. The definitions are identical; the linker keeps one.
[workspace.target.x86_64-windows-gnu.build]
ldflags = ["-Wl,--allow-multiple-definition"]
# HarfBuzz's amalgamated unit exceeds COFF's 2^15 sections under GCC; the big
# object format lifts the limit. Graph-wide, so it reaches that dependency.
dialect_cxxflags = ["-Wa,-mbig-obj"]
