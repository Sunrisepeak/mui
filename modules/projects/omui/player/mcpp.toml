# omui.player — the player (component-binding §10.2): what a script-first
# application runs in. It defines the manifest's component documents, mounts
# its view documents, runs its scripts in the languages registered with it
# (modules/projects/omui/lang/js …, plugins over the C ABI), and reloads what changes on
# disk in place: a view keeps its nodes, a script its signals.
[package]
namespace   = "omui"
name        = "player"
version     = "0.1.0"
description = "openmui's player: an application's views, components and scripts, run and reloaded in place"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"

[targets.openmui-player]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
omui.core    = { path = "../core" }
omui.view    = { path = "../view" }
omui.viewdoc = { path = "../viewdoc" }
omui.abi     = { path = "../abi" }
omui.theme   = { path = "../theme" }
omui.semantic = { path = "../semantic" }
mlibs.utils   = { path = "../../../base/utils" }
# The saved files' notice (fs::watcher): a reload looks only when the system says something changed.
mcpplibs.os   = "0.4.2"

[dev-dependencies]
# Tests are mtest's (D-147).
mcpplibs.mtest     = "0.5.2"
mlibs.image        = { path = "../../../base/image" }
omui.ui.base       = { path = "../components/base" }
omui.host.headless = { path = "../host/headless" }
