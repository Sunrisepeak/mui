# Example 04 — a custom component (canvas-markdown §5; component-binding §2):
# the reading list, whose rows are rated with this application's own
# component, `rating`. Its interface is a contract
# (contract/rating.contract.omui.ts); omui.build.contracts generates the C++
# partition, the builder and the TypeScript stubs when the
# package builds; src/rating.cpp is its behaviour. Registered once, it is a
# component like any other: the TypeScript interface (logic/main.ts),
# view documents and agents reach it by name. The tool: books, their ratings
# in half stars, the average, the ones worth recommending.
#
#   mcpp run                       a window
#   mcpp run -- --headless --png shelf.png
[package]
namespace   = "omui.example"
name        = "rating"
version     = "0.1.0"
description = "openmui example 04: a reading list rated with the application's own component, from contract to every language"
license     = "Apache-2.0"

[package.metadata.openmui]
kind      = "app"
id        = "org.openmui.reading-list"
title     = "Reading list"
size      = "560x520"
contracts = ["contract/*.contract.omui.ts"]

[package.metadata.openmui.scripts]
main = "logic/main.ts"

[targets.reading-list]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
omui.entry.player = { path = "../../src/entry/player" }
omui.ui.base      = { path = "../../modules/projects/omui/components/base" }

[build-dependencies]
omui.build.contracts = { path = "../../mcpp/contracts", host-module = true }

[dev-dependencies]
mcpplibs.mtest = "0.5.2"
mlibs.utils  = { path = "../../modules/base/utils" }
omui.player   = { path = "../../modules/projects/omui/player" }
omui.lang.js  = { path = "../../modules/projects/omui/lang/js" }
omui.abi      = { path = "../../modules/projects/omui/abi" }
omui.viewdoc  = { path = "../../modules/projects/omui/viewdoc" }
