# openmui.ui.canvas — the infinite canvas's core (canvas-markdown §1,
# OMUI_EXT_canvas): a scene stored by column with a grid index, a camera in
# double precision, tiers of detail per node kind (instanced boxes, a kind's
# own drawing, a live component), pan / zoom about the cursor / pinch /
# fling, named views on springs, and semantics that state what is on screen
# and find anything in the scene. Mechanism only: selection, dragging,
# handles, snapping, connectors and the minimap are canvas-kit's.
# Contract-first (openmui.build.contracts).
[package]
namespace   = "openmui.ui"
name        = "canvas"
version     = "0.1.0"
description = "An infinite canvas: a columnar scene with a grid index, a double-precision camera, tiers of detail, live promotion, semantic queries"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "component"

[targets.openmui-ui-canvas]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
openmui.core   = { path = "../../modules/ui/core" }
openmui.view   = { path = "../../modules/ui/view" }
xengine.render.vector = { path = "../../modules/gfx/render/vector" }
mlibs.raster = { path = "../../modules/gfx/raster" }
mlibs.geom   = { path = "../../modules/base/geom" }
mlibs.text   = { path = "../../modules/content/text" }
hanim.core          = { path = "../../modules/base/hanim/core" }
mlibs.trace  = { path = "../../modules/base/trace" }

[build-dependencies]
openmui.build.contracts = { path = "../../mcpp/contracts", host-module = true }

[dev-dependencies]
mlibs.testing       = { path = "../../modules/base/testing" }
openmui.host.headless = { path = "../../modules/ui/host/headless" }
