# openmui.ui.timeline — the timeline every editor shares, as a component
# (D-86): tracks of clips in exact time (xengine.timeline), a ruler, markers
# and a playhead; clips selected, moved, trimmed, split and removed by the
# pointer, the keys or an agent's actions, every edit undone exactly.
# Contract-first: contract/timeline.contract.omui.toml becomes the base,
# builders, stubs and schema when it builds (openmui.build.contracts).
[package]
namespace   = "openmui.ui"
name        = "timeline"
version     = "0.1.0"
description = "A timeline to edit: tracks of clips, a playhead, moves, trims, splits and removals, every edit undone exactly"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "component"

[targets.openmui-ui-timeline]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
openmui.core          = { path = "../../modules/ui/core" }
openmui.view          = { path = "../../modules/ui/view" }
xrender.vector = { path = "../../modules/projects/xrender/vector" }
openmui.ui.base       = { path = "../base" }
xengine.timeline      = { path = "../../modules/projects/xengine/timeline" }

[build-dependencies]
openmui.build.contracts = { path = "../../mcpp/contracts", host-module = true }

[dev-dependencies]
mlibs.utils       = { path = "../../modules/base/utils" }
openmui.host.headless = { path = "../../modules/ui/host/headless" }
openmui.semantic      = { path = "../../modules/ui/semantic" }
mlibs.i18n.cldr     = { path = "../../modules/content/i18n/cldr" }
