F3+Bb3+D4+F4 | E3+G3+C4+D4 | D3+A3+E4+F4 | D3+A3+E4+F4 |
F3+Bb3+D4+F4 | E3+G3+C4+D4 | E3+A3+D4+E4 | E3+A3+C#4+E4 |
"""

