    { pattern = "intro_bell" },
    { pattern = "intro_zheng" },
    { pattern = "intro_pad" },
    { pattern = "intro_drums", at = 2 },
    { pattern = "air" },
    { pattern = "air_crickets" },
]

[section.a]
