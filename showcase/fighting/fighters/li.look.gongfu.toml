# Her level 3, 「琉璃界」 (characters 2 design §2.3, the hardcore combat design §4): the palm
# lands and the world turns to glass, panes standing about them; she darts through
# her panes and strikes from in front and from behind — the knife-hand, the palm,
# the low kick, the cut, the side kick — each blow breaking glass and leaving a crack
# in the world, the struck seen through a prism; she steps back, gathers the light
