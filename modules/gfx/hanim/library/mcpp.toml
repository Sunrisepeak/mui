[package]
namespace = "hanim"
name = "library"
version = "0.1.0"
description = "Public prepared object animation plans: strict named-part contour morphing"
license = "Apache-2.0"
platforms = ["linux", "macos", "windows", "emscripten"]
repo = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"

[targets.hanim-library]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
"hanim.core" = { path = "../../../base/hanim/core" }
"hanim.object" = { path = "../object" }
mlibs.log = { path = "../../../base/log" }
mlibs.trace = { path = "../../../base/trace" }

[dev-dependencies]
mlibs.testing = { path = "../../../base/testing" }
