[package]
namespace = "meng.cellular"
name = "rhi"
version = "0.1.0"
description = "Optional RHI compute execution of the prepared integer cellular rule contract"
license = "Apache-2.0"
platforms = ["linux", "macos", "windows", "emscripten"]
repo = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "preview"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "dependency: the device (mlibs.rhi), kept from cellular's CPU users"
kind = "backend"
agent = { part = "meng.cellular" }

[targets.meng-cellular-rhi]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[build-dependencies]
mlibs.shader.rules = { path = "../../../../../gfx/shader/rules", host-module = true }

[dependencies]
meng.cellular = { path = ".." }
mlibs.rhi = { path = "../../../../../gfx/rhi" }
mlibs.utils = { path = "../../../../../base/utils" }
mlibs.math = { path = "../../../../../base/math" }
