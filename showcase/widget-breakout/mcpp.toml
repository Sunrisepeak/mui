# 《组件打砖块：openmui 巡礼》 (S4, D-50; mgame S4 design): a breakout whose
# bricks are real openmui components — buttons, toggles, sliders, cards —
# laid out by openmui and read into the simulation; every hit changes the
# brick for real, an agent plays it through the field's actions, and Tab's
# semantic lens shows the bricks the screen does not.
[package]
namespace   = "openmui.showcase"
name        = "widget_breakout"
version     = "0.1.0"
description = "A breakout over real openmui components, played by a person or an agent, rewindable, with a semantic lens"
license     = "Apache-2.0"

[package.metadata.openmui]
kind      = "showcase"
contracts = ["contract/*.contract.omui.toml"]

[targets.openmui-showcase-widget-breakout]
kind = "lib"

[targets.omui-breakout]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
openmui.sdk = { path = "../.." }
"openmui.showcase.widget_breakout.sim" = { path = "sim" }
mgame.input = { path = "../../mgame/input" }
mgame.ui    = { path = "../../mgame/ui" }
"openmui.theme" = { path = "../../modules/ui/theme" }
openmui.theme.styles = { path = "../../modules/ui/theme/styles" }

[build-dependencies]
openmui.rules = { path = "../../mcpp/rules", host-module = true }

[dev-dependencies]
openmui.testing = { path = "../../modules/base/testing" }
