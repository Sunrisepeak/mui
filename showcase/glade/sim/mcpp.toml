# Glade's simulation (M6.5's sandbox; the M6.5 design's T5.8a): a pocket valley — a stream and a footbridge, grass
# on both banks, a campfire, a crate, a block of ice — whose bodies, air and drops are matter's carriers in one
# step (xengine.dynamics' rigid3 and objects, xengine.field, xengine.particles, under rigid3::Scene). Poked by a
# few verbs, it answers by the standard laws and Glade's own materials (a pack: data, no law). The state is a
# value: a copy is a branch.
[package]
namespace   = "omui.showcase.glade"
name        = "sim"
version     = "0.1.0"
description = "Glade's deterministic simulation: a valley of matter poked by a few verbs, answering by the laws; rewindable and explained"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[targets.glade-sim]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp", "src/generated/*.cppm"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
xengine.dynamics  = { path = "../../../modules/projects/xengine/kernel/dynamics", features = ["rigid3-scene"] }
xengine.matter    = { path = "../../../modules/projects/xengine/kernel/matter" }
xengine.field     = { path = "../../../modules/projects/xengine/kernel/field" }
xengine.particles = { path = "../../../modules/projects/xengine/kernel/particles" }
mlibs.simulation  = { path = "../../../modules/base/simulation" }
mlibs.math        = { path = "../../../modules/base/math" }
mlibs.utils       = { path = "../../../modules/base/utils" }

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
