# mlibs.geom — the geometry the independent modules share: points, sizes,
# rectangles, insets, radii, colours, affine transforms, pixel snapping.
# The standard library and mlibs.utils (its errors are mlibs.error's);
# constexpr value/path contracts and shared curve flattening.
[package]
namespace   = "mlibs"
name        = "geom"
version     = "0.1.0"
description = "Shared geometry: 2D values, paths, curve flattening and pixel snapping; 3D bounds, rays, a frustum, meshes stored in clusters and shapes made by code"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "library: geometry and rays for every engine"
kind = "runtime"

[targets.mlibs-geom]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[features]
# Solids combined (src/boolean/, `import mlibs.geom.boolean;`): Manifold through its wrap
# (mcpplibs.mwrap.manifold), asked for only by what combines solids, so the geometry everything
# shares carries no third-party code (D-99: dependency isolation, as a feature since RC1.5).
boolean = { sources = ["src/boolean/*.cppm", "src/boolean/native/*.cpp"] }

[feature-deps.boolean]
mcpplibs.mwrap.manifold = "3.5.5.1"

[test]
features = ["boolean"]

[dependencies]
mlibs.utils = { path = "../utils", version = "0.1.0" }
mlibs.math  = { path = "../math", version = "0.1.0" }

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
mlibs.cts = { path = "../cts", version = "0.1.0" }
