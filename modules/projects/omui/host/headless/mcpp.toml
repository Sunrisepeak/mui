# omui.host.headless — openmui without a display: a virtual surface, a
# clock stepped frame by frame, input injected by point or by id, pixels from
# the CPU renderer as PNG, and the agent endpoint served between frames. The
# four headless levels (H0 semantics, H1 layout, H2 pixels, H3 a session an
# agent can drive). CI, agents and video rendering all run on it.
[package]
namespace   = "omui.host"
name        = "headless"
version     = "0.1.0"
description = "openmui headless host: stepped virtual clock, injected input, CPU pixels and PNG, agent endpoint (H0-H3)"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "host"
agent = { part = "omui.agent" }

[targets.openmui-host-headless]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
xrender.text = { path = "../../../xrender/text" }
omui.core     = { path = "../../core" }
omui.view     = { path = "../../view" }
omui.semantic = { path = "../../semantic" }
omui.agent    = { path = "../../agent" }
xrender.raster   = { path = "../../../xrender/raster" }
xrender.vector   = { path = "../../../xrender/vector" }
# The frame's entry: the host hands its layers to the renderer, which composes, captures and traces (D-162).
xrender.frame    = { path = "../../../xrender/frame" }
mlibs.text     = { path = "../../../../content/text" }
mlibs.image    = { path = "../../../../base/image" }
mlibs.utils    = { path = "../../../../base/utils" }

[dev-dependencies]
mcpplibs.mtest = "0.5.2"
# tests/component_motion_sweep_test.cpp: every component from a view document, swept through its motions here.
omui.ui.base = { path = "../../components/base" }
omui.viewdoc = { path = "../../viewdoc" }
