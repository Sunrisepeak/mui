# omui.cts — the harness of the conformance suite's level S
# (spec/conformance/S): the scenarios, the run of a language's runner through
# the two verbs it registers, and the comparison of what it records with the
# trace pinned beside the scenario. The TypeScript and JavaScript tests use it
# (D-138 removed the Lua and Python runners).
#
# A dev-dependency only: it is part of no artifact.
[package]
namespace   = "omui"
name        = "cts"
version     = "0.1.0"
description = "The CTS level S harness: language-neutral scenarios and their pinned traces"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "suite: language-neutral scenarios and their traces, run by each language's binding"
reexports = ["mlibs.cts"]  # what its interface re-exports (lint module-closure)
agent = { library = "conformance suites of the specification: for tests only" }

[targets.omui-cts]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
mlibs.cts     = { path = "../../../base/cts" }
nlohmann.json = "3.12.0"
mcpplibs.os   = "0.4.4"
mlibs.utils   = { path = "../../../base/utils" }  # mlibs.error: why the scenarios cannot be read

[dev-dependencies]
mcpplibs.mtest = "0.8.4"

# The declared data kinds this package owns (mlibs.xdef registry, D-209): each kind and its major
# version, and the define module a data module imports each from (none: only tools write it).
[package.metadata.openmui.xdef]
kinds = { trace = 1 }
