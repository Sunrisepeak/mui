E5:3! G5 A5:2 C6:2 D6:4 C6:2 A5:2 |
C6>D6:6! C6:2 A5:4 G5:2 E5:2 |
F5:2! G5:2 A5:2 C6:2 D6:4 F6:4 |
F6>G6:4! F6:2 D6:2 C6:4 A5:4 |
G5:3! A5 C6:2 D6:2 C6:2 A5:2 G5:2 F5:2 |
E5:4! D5:4 A4:8 |
"""

[pattern.hook_b]
instrument = "lead"
step = "1/16"
