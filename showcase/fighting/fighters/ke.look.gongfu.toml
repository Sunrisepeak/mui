# 5 two fingers (a clock's hand), 6 claw, 7 palm up, 8 the pocket watch open in the palm.
# Her faces: 0 calm, 1 a knowing smile, 2 focused, 3 the kiai, 4 hurt, 5 pain. Her cape: 0
