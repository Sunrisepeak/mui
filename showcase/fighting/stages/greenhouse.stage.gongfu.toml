# 璃's greenhouse (the quality design's §5): a grand glass house in morning
# light, painted in layers (stages/art, generated and keyed by gongfu-studio):
# a misty garden seen through tall curved panes that bend it, sunbeams
# slanting in; the back wall of white iron arches and glass with climbing
# vines, hanging ferns, palms against the panes, a spiral stair and glass
# orbs; pale stone and patterned tile wet in patches, catching the light; a
# stone fountain with a bell jar of orchids, and a plant stand of
# terrariums; leaves and an iron frame's edge in front. The light comes from
# the upper left, through the glass.
gongfu = "0.1"
name = "greenhouse"
sky = ["#c9dde0", "#e8eadf"]
floor = "#9aa39c"
line = "#5f6a66"
marks = false
light = { from = [-0.6, -0.8], shadow = "#1e3238", rim_color = "#f2fbffcc", color = "#ecfbe6" }

[[picture]]
name = "far"
file = "art/greenhouse-far.webp"
size = [1152, 768]

