# mrender.mesh.gpu.cts — the mesh pass's contract on a device (the foundation plan's §5.4; AGENTS §2.6: a
# suite lives with the contract's owner): the scenes a backend of mlibs.rhi must draw as the CPU reference
# does, within tolerances said case by case. Run by each backend's tests on its own device (mrender.rhi.sdl
# today). A package of its own, as the other suites are: only tests link it.
[package]
namespace   = "mrender.mesh.gpu"
name        = "cts"
version     = "0.1.0"
description = "Conformance of the mesh pass on a device: any mlibs.rhi backend against the CPU reference, on mlibs.cts"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "preview"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "suite: the mesh pass on any device against the CPU reference, run by each backend"
kind  = "module"
agent = { library = "conformance suite of the mesh pass on a device: for tests only" }

[targets.mrender-mesh-gpu-cts]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
"mrender.mesh.gpu" = { path = ".." }
mrender.mesh     = { path = "../.." }
mrender.scene    = { path = "../../../scene" }
mrender.graph    = { path = "../../../graph" }
mlibs.rhi        = { path = "../../../../../gfx/rhi" }
mlibs.cts        = { path = "../../../../../base/cts" }
mlibs.geom       = { path = "../../../../../base/geom" }
mlibs.math       = { path = "../../../../../base/math" }
mlibs.image      = { path = "../../../../../base/image", features = ["ktx2"] }
# A picture packed for devices (KTX2), read as the importer reads it: the case mesh.blocks.
mrender.asset    = { path = "../../../asset" }

[dev-dependencies]
mcpplibs.mtest     = "0.8.4"
mcpplibs.os        = "0.4.4"
# The page's backends: the suite on WebGPU and on WebGL2 (tests/, run in a browser by omui-devtools check browser).
mrender.rhi.webgpu = { path = "../../../rhi/webgpu" }
mrender.rhi.webgl  = { path = "../../../rhi/webgl" }
