# omui.theme — themes as data (view-data-files §3, component-binding §11):
# `*.theme.omui.ts` files declare themes (light, dark) and overlays
# (density, reduced motion); a library composes layers into the runtime's
# Theme, with every mistake reported where it is. Theme packages
# (modules/projects/omui/theme/default, modules/projects/omui/theme/compact) are such files, embedded.
[package]
namespace   = "omui"
name        = "theme"
version     = "0.1.0"
description = "Themes as data: *.theme.omui.ts evaluated to JSON, read, checked and composed into openmui's design tokens"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"
agent = { library = "theme data and its reader: tokens and recipes, read once" }

[targets.openmui-theme]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
omui.core   = { path = "../core" }
omui.view   = { path = "../view" }
hanim.core          = { path = "../../hanim/core" }
xrender.vector = { path = "../../xrender/vector" }
mlibs.json     = { path = "../../../base/json" }

[dev-dependencies]
mcpplibs.mtest = "0.6.3"
omui.lang.ts = { path = "../lang/ts" }  # the theme packages' modules, evaluated as the build does
mlibs.utils = { path = "../../../base/utils" }
