# The staged `refined` overlay's switch, checkbox and slider (the state's
# halo, B4 second pass) against Material 3 — the three the first record found
# behind — before the maintainer decides whether it becomes the default.
# Material: tools/eval/materials/controls.sh, then the quality lab's
# refined/<control>.png copied to target/compare-material/omui-refined.

subject = "components-refined"
seed = 2
material = "tools/eval/materials/controls.sh; cp <scratch>/quality-lab/refined/{toggle,checkbox,slider}.png target/compare-material/omui-refined/"

[[dimension]]
id = "controls"
question = "Each picture shows one control in four states, left to right: at rest, under the pointer, pressed, keyboard-focused. Which side's control is better crafted across the four states — visual quality, how clearly each state reads, detail and polish?"

[[dimension.pair]]
ours = "target/compare-material/omui-refined/toggle.png"
theirs = "target/compare-material/material3/toggle.png"
competitor = "material3 (the switch)"

[[dimension.pair]]
ours = "target/compare-material/omui-refined/checkbox.png"
theirs = "target/compare-material/material3/checkbox.png"
competitor = "material3 (the checkbox)"

[[dimension.pair]]
ours = "target/compare-material/omui-refined/slider.png"
theirs = "target/compare-material/material3/slider.png"
competitor = "material3 (the slider)"
