# omui.abi — openmui.h implemented (spec §8): the one boundary every
# language binding is written against. Handles and values cross it, never a
# C++ type or an exception; text and structured results reach the caller's
# sink; views are view documents (omui.viewdoc), queries and actions the
# bus interface's (omui.agent). Its types and declarations are generated
# from spec/registry/abi.toml (`omui-gen abi`), and a native unit checks every
# layout against the header.
[package]
namespace   = "omui"
name        = "abi"
version     = "0.1.0"
description = "openmui's C ABI (openmui.h): runtimes, view documents, signals, verbs, frames and the semantic tree"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "library: the C ABI every language binding and plugin uses"
kind = "runtime"
agent = { part = "omui.agent" }

[targets.openmui-abi]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/generated/*.cppm", "src/native/*.cpp"]

[test]
# The C++ suite, and a C program that includes openmui.h.
discover = ["tests/**/*.cpp", "tests/**/*.c"]

[dependencies]
xrender.text = { path = "../../xrender/text", version = "0.1.0" }
openlifa.openmui = { path = "../../../../spec", version = "0.3.0" }
omui.core     = { path = "../core", version = "0.1.0" }
omui.view     = { path = "../view", version = "0.1.0" }
omui.viewdoc  = { path = "../viewdoc", version = "0.1.0" }
omui.semantic = { path = "../semantic", version = "0.1.0" }
omui.agent    = { path = "../agent", version = "0.1.0" }
xrender.vector   = { path = "../../xrender/vector", version = "0.1.0" }
xrender.raster   = { path = "../../xrender/raster", version = "0.1.0" }
mlibs.text     = { path = "../../../content/text", version = "0.1.0" }
omui.native   = { path = "../native", version = "0.1.0" }
omui.theme    = { path = "../theme", version = "0.1.0" }
nlohmann.json    = "3.12.0"

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
mlibs.utils      = { path = "../../../base/utils", version = "0.1.0" }
omui.ui.base      = { path = "../components/base", version = "0.1.0" }
