name: CI

# What a green run asserts about openmui (implementation plan §15, §19.1):
#
#   lint      the repository rules hold, and each rule still catches a planted
#             violation (no macros, one header, naming, layering, exceptions,
#             determinism flags)
#   test      every workspace member builds and passes its tests on Linux,
#             macOS and Windows; the pinned determinism hashes in the tests are
#             the same constants on every row, so a green matrix is the
#             cross-platform determinism gate
#   web       the members that say they run on the Web pass their tests on
#             wasm32-emscripten under node, with the same pinned hashes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The GCC rows (and the steps they carry: the consumers, the templates,
  # the sweep, the benchmarks) run here, nightly and on demand; a pull
  # request's matrix leaves them out (plan §10.1: the PR lane stays fast; they
  # took over 150 minutes, red list 9).
  schedule:
    - cron: "30 2 * * *"

# A run in progress finishes: the matrix takes about two hours and every
# checkpoint is reconciled against its CI (plan §10.1); a newer push waits,
# and GitHub keeps only the newest waiting run of the group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  XLINGS_VERSION: v2026.10.26.1
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The schema checker of view documents
        run: python3 -m pip install jsonschema
      - name: Repository rules
        run: python3 tools/lint/lint.py
      - name: Each rule catches a planted violation
        run: python3 tools/lint/lint.py --self-test
      - name: openmui.h is plain C99 and C++11
        run: |
          gcc -std=c99 -Wall -Wextra -pedantic -Werror -Ispec/include -fsyntax-only tools/lint/abi_c99.c
          g++ -std=c++11 -Wall -Wextra -pedantic -Werror -Ispec/include -x c++ -fsyntax-only tools/lint/abi_c99.c

  # The Web row (D-84): the members that say they run on the Web, built for
  # wasm32-emscripten (emsdk and node from xlings, through mcpp) and tested
  # under node; their pinned hashes are the other rows' constants.
  web:
    name: test web wasm32-emscripten
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: Install mcpp
        run: |
          # The mcpp every row builds with is the project's (.xlings.json), the one
          # the work is checked with locally; in the project, xlings runs that one.
          MCPP_VERSION="$(sed -n 's/.*"mcpp": *"\([^"]*\)".*/\1/p' .xlings.json)"
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 6 ] && { echo "::error::mcpp could not be installed"; exit 1; }
            sleep 60
          done
          version="$(mcpp --version)"
          echo "$version"
          case "$version" in *"$MCPP_VERSION"*) ;; *) echo "::error::not mcpp $MCPP_VERSION"; exit 1 ;; esac
          mcpp self config --mirror GLOBAL
      - name: The members that run on the Web, tested under node
        run: tools/ci/web.sh
        env:
          # The runner has Chrome: a page's checks are never skipped here.
          OMUI_REQUIRE_BROWSER: '1'
      # D-84 §6.5: the games packed for Bilibili Toy (dist-toy) and checked by
      # Toy's own toy_doctor.py, pinned; nothing is published.
      - name: The games packaged for Toy, checked by Toy's doctor
        run: tools/ci/toy.sh

  # omui on Android (W10): example 01 packed into an APK and checked inside,
  # then run on Android 7.0's emulator (KVM): started, a tap, Back.
  android:
    name: test android x86_64 (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: Install mcpp
        run: |
          # The mcpp every row builds with is the project's (.xlings.json), the one
          # the work is checked with locally; in the project, xlings runs that one.
          MCPP_VERSION="$(sed -n 's/.*"mcpp": *"\([^"]*\)".*/\1/p' .xlings.json)"
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 6 ] && { echo "::error::mcpp could not be installed"; exit 1; }
            sleep 60
          done
          version="$(mcpp --version)"
          echo "$version"
          case "$version" in *"$MCPP_VERSION"*) ;; *) echo "::error::not mcpp $MCPP_VERSION"; exit 1 ;; esac
          mcpp self config --mirror GLOBAL
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Example 01 as an APK, on the emulator
        run: tools/ci/android.sh
        env:
          OMUI_ANDROID_OUT: ${{ runner.temp }}/omui-android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens
          path: ${{ runner.temp }}/omui-android/*.png
          if-no-files-found: ignore

  # The rows a run tests: every one nightly and on demand, the GCC rows left
  # out of a pull request's run.
  rows:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.rows.outputs.matrix }}
    steps:
      - id: rows
        shell: bash
        run: |
          # aarch64 Linux's native glibc toolchain is LLVM (mcpp docs/20): there
          # `gcc` is the static musl toolchain, which cannot link the shared
          # X11 libraries the desktop host needs.
          # The per-push rows build the profile `ci` (the workspace's: dev without debug information, stripped —
          # a test program is a fifth of its size); the GCC rows keep `dev` and `release`.
          rows='[
            {"os": "ubuntu-24.04",     "toolchain": "llvm@23.1.3", "profile": "ci"},
            {"os": "ubuntu-24.04-arm", "toolchain": "llvm@23.1.3", "profile": "ci"},
            {"os": "macos-15",         "toolchain": "llvm@23.1.3", "profile": "ci"},
            {"os": "windows-2022",     "toolchain": "llvm@23.1.3", "profile": "ci"}'
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch|push)
              rows="$rows"',
            {"os": "ubuntu-24.04", "toolchain": "gcc@16.1.0", "profile": "dev"},
            {"os": "ubuntu-24.04", "toolchain": "gcc@16.1.0", "profile": "release"}' ;;
          esac
          echo "matrix=$(echo "$rows]" | tr -d '\n ')" >> "$GITHUB_OUTPUT"

  test:
    name: test ${{ matrix.os }} ${{ matrix.toolchain }} ${{ matrix.profile }}
    needs: rows
    runs-on: ${{ matrix.os }}
    # Every member's tests, then the scripts: 2 h 06 min on Linux x64 at e1749f83, more on macOS (each member's
    # tests rebuild what it reaches: mcpp#874). 150 minutes cancelled both rows with nothing failing (red list 67).
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.rows.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install xlings (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install mcpp
        run: |
          # The mcpp every row builds with is the project's (.xlings.json), the one
          # the work is checked with locally; in the project, xlings runs that one.
          MCPP_VERSION="$(sed -n 's/.*"mcpp": *"\([^"]*\)".*/\1/p' .xlings.json)"
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 6 ] && { echo "::error::mcpp could not be installed"; exit 1; }
            sleep 60
          done
          version="$(mcpp --version)"
          echo "$version"
          case "$version" in *"$MCPP_VERSION"*) ;; *) echo "::error::not mcpp $MCPP_VERSION"; exit 1 ;; esac
          mcpp self config --mirror GLOBAL


      - name: Select the toolchain
        run: |
          spec='${{ matrix.toolchain }}'
          mcpp toolchain install "${spec%@*}" "${spec#*@}"
          mcpp toolchain default "$spec"

      - name: SDL's offscreen video driver (the desktop host's tests open windows)
        run: echo "SDL_VIDEO_DRIVER=offscreen" >> "$GITHUB_ENV"

      - name: A GPU for omui.rhi (lavapipe on Linux and Windows, Metal on macOS; required, not skipped)
        run: tools/ci/gpu.sh

      - name: Build every member
        run: mcpp build --workspace --profile '${{ matrix.profile }}' --exclude omui.reflect

      - name: An unchanged build leaves compilation outputs untouched
        timeout-minutes: 10
        run: python3 tools/ci/incremental.py --workspace --profile '${{ matrix.profile }}' --exclude omui.reflect

      - name: Keep the incremental build check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-${{ matrix.os }}-${{ matrix.toolchain }}-${{ matrix.profile }}
          path: |
            target/incremental.report.omui.json
            target/incremental-*.events.omui.jsonl
            target/incremental-*.log
          if-no-files-found: ignore

      - name: Test every member
        run: |
          # The workspace declares esbuild for test runs and mcpp installs it; on Windows a test is not
          # given the directory it is installed in (mcpp#926), so there the test is told where it is.
          if [ "$RUNNER_OS" = Windows ]; then
            version="$(sed -n 's/^"xim:esbuild" *= *{ *version *= *"\([^"]*\)".*/\1/p' mcpp.toml)"
            export OMUI_ESBUILD="$(cygpath -m "$HOME/.mcpp/registry/data/xpkgs/xim-x-esbuild/$version/bin/esbuild.exe")"
            echo "OMUI_ESBUILD=$OMUI_ESBUILD"
          fi
          # The site is a validation line with hundreds of rendered frames: it
          # has a job of its own (`site`), so this row stays within its time.
          mcpp test --workspace --profile '${{ matrix.profile }}' --exclude omui.reflect --exclude omui.site --exclude omui.entry.devhost 2>&1 | tee tests.log
          grep -q "workspace result ok" tests.log || { echo "::error::workspace tests failed"; exit 1; }

      # The showcases' README pictures are what their tests draw (deterministic:
      # tools/ci/readme-media.sh makes them again after a change in the picture).
      - name: The showcases' README media are up to date
        if: runner.os == 'Linux' && matrix.toolchain == 'gcc@16.1.0' && matrix.profile != 'release'
        run: tools/ci/readme-media.sh --check $(cd showcase && ls -d */ | tr -d /)  # the site's in its own lane

      # A pinned picture that differs on one platform is looked at, not
      # guessed at: every test's pictures, kept when a test failed.
      - name: Keep the tests' pictures (on failure)
        if: failure()
        run: |
          src="$(python3 -c 'import tempfile; print(tempfile.gettempdir())')/openmui-tests"
          mkdir -p test-pictures
          if [ -d "$src" ]; then (cd "$src" && find . -name '*.png' | tar -cf - -T -) | tar -C test-pictures -xf -; fi

      - name: Upload the tests' pictures (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-pictures-${{ matrix.os }}-${{ matrix.toolchain }}-${{ matrix.profile }}
          path: test-pictures
          if-no-files-found: ignore

      # C++26 reflection (D-39): GCC 16 with -freflection only, and a C++26
      # build of its graph of its own, so on one row — gated on a toolchain
      # that builds reflection beside C headers (V-08, tools/ci/reflect.sh).
      - name: omui.reflect (C++26 reflection, GCC 16)
        if: runner.os == 'Linux' && matrix.toolchain == 'gcc@16.1.0' && matrix.profile != 'release'
        run: tools/ci/reflect.sh '${{ matrix.profile }}'

      - name: An agent drives example 07 in its own process (M1 acceptance ②)
        if: runner.os == 'Linux'
        env:
          PROFILE: ${{ matrix.profile }}
        run: tools/ci/agent-e2e.sh

      - name: omui dev for a C++ application, end to end (W16; builds example 01 several times)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        # Built by mcpp test, run outside it: the case runs `mcpp build` in this workspace, and a running
        # `mcpp test` holds the build directory (mcpp#915).
        run: |
          mcpp test -p omui.entry.devhost --profile '${{ matrix.profile }}' --no-run
          newest() { find target -path "*/bin/*" -name "$1" -type f -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2; }
          MCPP_BIN_OMUI_DEVHOST="$(readlink -f "$(newest omui-devhost)")" "$(newest devhost_e2e_test)"

      - name: mpal as an ok image (openkal), its services found when loaded
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.profile != 'release'
        run: mcpp test -p mpal --target x86_64-openkal

      - name: The products' commands as an Agent uses them (hanim, xrender; plan §10.3)
        if: runner.os == 'Linux'
        env:
          PROFILE: ${{ matrix.profile }}
        run: tools/ci/tools-e2e.sh

      - name: The interaction sweep — every program, every action an agent can perform (D-91)
        if: runner.os == 'Linux' && matrix.profile != 'release'
        run: tools/ci/sweep.sh

      - name: Upload the sweep's verdicts
        if: always() && runner.os == 'Linux' && matrix.profile != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ matrix.os }}-${{ matrix.toolchain }}
          path: target/sweep
          if-no-files-found: ignore

      - name: A screen reader's protocol reads and operates examples 03 and 07 (AT-SPI over D-Bus)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          command -v /usr/libexec/at-spi-bus-launcher > /dev/null || { sudo apt-get update -q && sudo apt-get install -yq at-spi2-core; }
          tools/ci/atspi.sh

      - name: A feature selects one of two exclusive sources (M0 acceptance ⑤)
        if: runner.os == 'Linux' && matrix.profile != 'release'
        run: tools/ci/features.sh

      - name: The templates build and pass their tests (M0 acceptance ①)
        if: runner.os == 'Linux' && matrix.profile != 'release'
        run: tools/ci/templates.sh

      - name: Independent core and log consumer has no UI or renderer dependency
        timeout-minutes: 10
        if: matrix.os == 'ubuntu-24.04' && matrix.toolchain == 'gcc@16.1.0' && matrix.profile == 'release'
        run: python3 tools/ci/hanim-core-consumer.py

      - name: Keep the independent consumer graph and results
        if: always() && matrix.os == 'ubuntu-24.04' && matrix.toolchain == 'gcc@16.1.0' && matrix.profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: hanim-core-independent-consumer
          path: target/hanim-core-consumer
          if-no-files-found: ignore

      - name: Independent playback and shared Agent control export real process frames without a GUI
        timeout-minutes: 15
        if: matrix.os == 'ubuntu-24.04' && matrix.toolchain == 'gcc@16.1.0' && matrix.profile == 'release'
        run: python3 tools/ci/hanim-play-consumer/run.py --output target/hanim-play-consumer/report.omui.json

      - name: Native UI playback and provider recovery render the same process on native and Web
        timeout-minutes: 30
        if: matrix.os == 'ubuntu-24.04' && matrix.toolchain == 'gcc@16.1.0' && matrix.profile == 'release'
        run: python3 tools/ci/omui-hanim-consumer/run.py --web --output target/omui-hanim-consumer/report.omui.json

      - name: Keep UI playback pixels provider recovery and feature dependency evidence
        if: always() && matrix.os == 'ubuntu-24.04' && matrix.toolchain == 'gcc@16.1.0' && matrix.profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: omui-hanim-independent-consumer
          path: target/omui-hanim-consumer
          if-no-files-found: ignore

      - name: Public hanim authoring and umbrella stay independent
        timeout-minutes: 15
        if: matrix.os == 'ubuntu-24.04' && matrix.toolchain == 'gcc@16.1.0' && matrix.profile == 'release'
        run: python3 tools/ci/hanim-api-probe/run.py --output target/hanim-public-authoring/report.omui.json

      - name: Hanim features exclude unselected sources and renderer dependencies
        timeout-minutes: 15
        if: matrix.os == 'ubuntu-24.04' && matrix.toolchain == 'gcc@16.1.0' && matrix.profile == 'release'
        run: python3 tools/ci/hanim-features/run.py --output target/hanim-features/report.omui.json

      - name: Keep Hanim feature dependency evidence
        if: always() && matrix.os == 'ubuntu-24.04' && matrix.toolchain == 'gcc@16.1.0' && matrix.profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: hanim-features
          path: target/hanim-features
          if-no-files-found: ignore

      - name: Keep public authoring checks and dependency evidence
        if: always() && matrix.os == 'ubuntu-24.04' && matrix.toolchain == 'gcc@16.1.0' && matrix.profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: hanim-public-authoring
          path: target/hanim-public-authoring
          if-no-files-found: ignore

      - name: Keep the independent playback graph pixels and provenance
        if: always() && matrix.os == 'ubuntu-24.04' && matrix.toolchain == 'gcc@16.1.0' && matrix.profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: hanim-play-independent-consumer
          path: target/hanim-play-consumer
          if-no-files-found: ignore

      - name: Benchmarks against their budgets (M1 acceptance ⑤; tests/bench)
        if: matrix.profile == 'release'
        run: |
          mcpp run -p omui.bench --profile release -- \
            --check tests/bench/budgets.bench.omui.json --all-budgets --json results.bench.omui.json \
            --report bench-report.md --label "${{ matrix.os }} ${{ matrix.toolchain }}"

      - name: Keep the benchmark report
        if: always() && matrix.profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}-${{ matrix.toolchain }}
          path: |
            results.bench.omui.json
            bench-report.md
          if-no-files-found: ignore

  # The site's tests (plan §4.1: a validation line in a lane of its own): its
  # pinned pictures and motion processes, hundreds of frames, in release so a
  # single test does not run into the default five minutes.
  site:
    name: test site (release)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: Install mcpp
        run: |
          MCPP_VERSION="$(sed -n 's/.*"mcpp": *"\([^"]*\)".*/\1/p' .xlings.json)"
          for attempt in 1 2 3 4 5 6; do
            xlings update > /dev/null 2>&1 || true
            if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
            [ "$attempt" = 6 ] && { echo "::error::mcpp could not be installed"; exit 1; }
            sleep 60
          done
          version="$(mcpp --version)"
          echo "$version"
          case "$version" in *"$MCPP_VERSION"*) ;; *) echo "::error::not mcpp $MCPP_VERSION"; exit 1 ;; esac
          mcpp self config --mirror GLOBAL
      - name: Select the toolchain
        run: |
          mcpp toolchain install llvm 23.1.3
          mcpp toolchain default llvm@23.1.3
      - name: SDL's offscreen video driver
        run: echo "SDL_VIDEO_DRIVER=offscreen" >> "$GITHUB_ENV"
      - name: A GPU for omui.rhi (lavapipe)
        run: tools/ci/gpu.sh
      - name: The site's tests
        run: |
          mcpp test -p omui.site --profile release --timeout 1200 2>&1 | tee site-tests.log
          grep -q "test result ok" site-tests.log || { echo "::error::the site's tests failed"; exit 1; }
      - name: The site's README media are what its tests draw
        run: tools/ci/readme-media.sh --check site
      - name: Keep the site's pictures (on failure)
        if: failure()
        run: |
          src="$(python3 -c 'import tempfile; print(tempfile.gettempdir())')/openmui-tests"
          mkdir -p site-pictures
          if [ -d "$src" ]; then (cd "$src" && find . -name '*.png' | tar -cf - -T -) | tar -C site-pictures -xf -; fi
      - name: Upload the site's pictures (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-pictures
          path: site-pictures
          if-no-files-found: ignore
