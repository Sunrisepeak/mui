# 岳 (Yue), the giant: how he looks and how his hits feel (gongfu characters 2 design §3.4;
# the hardcore combat design). The guardian of a stone mountain gate: a short quilted
# wrestler's jacket in russet with bronze-stitched trim, a wide slate sash under a leather
# belt with a bronze mountain buckle, a string of wooden prayer beads; bare arms below
# short sleeves, forearms bound in sand-coloured wraps; wide charcoal trousers, wrapped
# shins, heavy black boots; a black topknot, grey at the temples, a short full beard.
# Broad shoulders, short legs. He grabs, throws, shoves with the palm, stamps; long
# hitstops, heavy shakes. Angles are degrees, counter-clockwise; keys by frame. In a
# bone's frame x runs along it and y across: for a bone pointing up, +y is his back.
gongfu = "0.1"
name = "yue"
outline = { color = "#1a0f08", width = 2.5 }
accent = "#d9a441"
art_scale = 0.5
trail = { color = "#e0b070", frames = [3, 6], alpha = 0.22 }
light = { from = [-0.62, -0.78], shade = 0, darken = 0.3, shadow = "#24160e", rim = 0, rim_color = "#ffd9a0aa" }
footfall = { every = 24, dip = 3, frames = 10 }

