[package]
namespace = "xengine.cellular.rhi"
name = "cts"
version = "0.1.0"
description = "Integer cellular CPU/GPU conformance on a caller-provided RHI device"
license = "Apache-2.0"
platforms = ["linux", "macos", "windows", "emscripten"]
repo = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "preview"  # release plan §2.1: stable, preview or experimental (lint maturity)
reexports = ["mlibs.cts"]  # what its interface re-exports (lint module-closure)
kind = "backend"
agent = { library = "conformance suite of the GPU field: for tests only" }

[targets.xengine-cellular-rhi-cts]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
# With the feature `matter`, and the standard definition: matter lowered (encoding 3 — a table, reactions,
# cells that move by it) is one of the scenarios.
xengine.cellular = { path = "../..", features = ["matter"] }
"xengine.cellular.rhi" = { path = ".." }
mlibs.rhi = { path = "../../../../../../gfx/rhi" }
mlibs.utils = { path = "../../../../../../base/utils" }
mlibs.cts = { path = "../../../../../../base/cts" }
mlibs.math = { path = "../../../../../../base/math" }
xengine.matter = { path = "../../../matter" }

# The suite on the page's WebGPU (tests/*_webgpu_test.cpp; omui-devtools check browser runs it in a
# browser): the owner takes a backend for its tests, never a backend its consumers (D-161).
# Its run on SDL_GPU, and the field on screen from the device's own cells (tests/native/), are native only:
# selected by target (mcpp 2026.11.16.1, #942), with what they import.
[dev-dependencies]
mcpplibs.mtest     = "0.8.4"
xrender.rhi.webgpu = { path = "../../../../../xrender/rhi/webgpu" }
mcpplibs.os        = "0.4.4"

[test]
discover = ["tests/*.cpp", "tests/native/*.cpp"]

[target.'cfg(os = "emscripten")'.test]
discover = ["!tests/native/**"]

[target.'cfg(not(os = "emscripten"))'.dev-dependencies]
xrender.rhi.sdl            = { path = "../../../../../xrender/rhi/sdl" }
"xengine.cellular.present" = { path = "../../present" }
xrender.vector             = { path = "../../../../../xrender/vector" }
xrender.raster             = { path = "../../../../../xrender/raster" }
mlibs.geom                 = { path = "../../../../../../base/geom" }
