# openmui.render.vector — 2D vector rendering, a rendering feature of
# openmui.render (D-81): the display list of contract ⑤, its CPU reference
# backend and its GPU backend (D-57). Knows nothing of nodes or views;
# anything that produces a display list can render it.
[package]
namespace   = "xrender"
name        = "vector"
version     = "0.1.0"
description = "2D vector rendering: the display list, its CPU reference renderer and its GPU renderer, byte-for-byte where it can be"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"
platforms   = ["linux", "macos", "windows", "emscripten"]

[package.metadata.openmui]
kind = "backend"
agent = { part = "xrender.frame" }

[targets.xrender-vector]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp", "src/generated/*.cppm", "src/svg/*.cppm", "src/svg/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[build-dependencies]
mlibs.shader.rules = { path = "../../../gfx/shader/rules", host-module = true }

[dependencies]
mlibs.math = { path = "../../../base/math" }
mlibs.utils = { path = "../../../base/utils" }
xrender.graph = { path = "../graph" }
mlibs.rhi    = { path = "../../../gfx/rhi" }
mlibs.geom   = { path = "../../../base/geom" }
mlibs.memory = { path = "../../../base/memory" }
xrender.raster = { path = "../raster" }

# The files of tests/vector/ are one program, run a file at a time: one link of the closure for all of them. Files
# directly in tests/ stay a program each: they count allocations with an operator new of their own.
[test]
programs = "directory"

[dev-dependencies]
mcpplibs.mtest = "0.8.3"
mlibs.image   = { path = "../../../base/image" }
mcpplibs.os     = "0.4.4"
