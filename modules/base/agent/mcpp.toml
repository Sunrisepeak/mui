# mlibs.agent — the agent kernel (D-173): what openas's model needs in a
# process, for any subject. Below every engine, so that a simulation, a
# renderer or a game without an interface is found, observed and operated
# as an application with one is; it knows neither the interface nor a game.
#
# First of it, the endpoint: where agents find a program and talk to it —
# a local connection named after the program, a descriptor beside it, lines
# in and lines out, served at the owner's safe point (a frame's or a step's
# boundary). What the lines mean is the session's, which the owner gives.
[package]
namespace   = "mlibs"
name        = "agent"
version     = "0.1.0"
description = "The agent kernel: where agents find a program and talk to it, for any subject"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "library: the Agent kernel every engine and toolkit is a subject of"
kind = "module"

[targets.mlibs-agent]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

# Recorded sessions (src/session/, module mlibs.session; D-57): a header and timestamped entries as NDJSON
# (`<name>.session.xdef.jsonl`), sought, sliced, merged, read back byte-identical — what drove a subject, in time.
# A feature: it takes nlohmann/json, which the kernel's other consumers do not (release plan §4.2 rule 3: its
# one consumer is omui.semantic's recorder and player).
[features]
session = { sources = ["src/session/*.cppm", "src/session/*.cpp"] }

[feature-deps.session]
nlohmann.json = "3.12.0"

[dependencies]
mlibs.utils   = { path = "../utils" }
mlibs.json    = { path = "../json" }
# Authority: every request of a subject is decided there first (openas).
mlibs.control = { path = "../control" }
openlifa.openas = "0.2.1"
mcpplibs.os   = "0.4.4"

[test]
features = ["session"]  # tests/session_test.cpp

[dev-dependencies]
mcpplibs.mtest = "0.8.4"

# The declared data kinds this package owns (mlibs.xdef registry, D-209): each kind and its major
# version, and the define module a data module imports each from (none: only tools write it).
[package.metadata.openmui.xdef]
kinds = { endpoint = 1, replay = 1, session = 1 }
