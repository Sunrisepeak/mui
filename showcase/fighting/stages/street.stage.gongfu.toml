# 霓's street (the hardcore combat design's stages): a rainy neon alley at
# night, painted in layers (stages/art, generated and keyed by gongfu-studio):
# a hazy skyline of towers in magenta and cyan; the alley's back — shopfronts
# under glowing signs of shapes, shutters, air-conditioners, tangled cables, a
# fire escape, steam from a noodle stall; the wet asphalt mirroring the neon;
# a vending machine and crates, a scooter and a bin under paper lanterns at
# the alley's ends; cables and a lantern hanging in front. Rain falls behind
# and before the fighters. The light comes from the signs, upper right: a cyan
# rim on whoever stands here.
gongfu = "0.1"
name = "street"
sky = ["#07081a", "#1d1236"]
floor = "#0d0f20"
line = "#2a2f55"
marks = false
light = { from = [0.55, -0.83], shadow = "#030208", rim_color = "#3ef2ffbb" }

[[picture]]
name = "far"
file = "art/street-far.webp"
size = [1152, 768]

[[picture]]
name = "mid"
file = "art/street-mid.webp"
size = [1152, 768]

[[picture]]
name = "floor"
file = "art/street-floor.webp"
size = [1152, 300]

[[picture]]
name = "near"
file = "art/street-near.webp"
size = [1152, 768]

[[picture]]
name = "front"
file = "art/street-front.webp"
size = [1152, 768]

[[layer]]
name = "skyline"
parallax = 0.15
[[layer.image]]
picture = "far"
source = [0, 0, 1152, 768]
at = [370, -250]
width = 1180

[[layer]]
name = "far rain"
parallax = 0.3
[[layer.rain]]
seed = 3
count = 140
span = [-400, 2320]
height = [0, 760]
length = 18
speed = 700
slant = 0.1
color = "#8fb3ff40"

