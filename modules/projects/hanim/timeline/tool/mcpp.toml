# hanim.timeline.tool — the `hanim-timeline` command: what an Agent (or a
# person at a terminal) does with the timeline every editor shares
# (hanim.timeline) without a GUI: check a file (every problem at its line and
# column), ask what plays at a moment, make the usual edits (split, trim,
# move, remove, ripple remove) and take them back. JSON out, exit codes. Its
# own package: a tool's dependencies stay out of the library's.
[package]
namespace   = "hanim.timeline"
name        = "tool"
version     = "0.1.0"
description = "The hanim-timeline command: timelines checked, read at a moment, edited and edits taken back, headless"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "tool"
agent = "tool"

[targets.hanim-timeline]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/*.cpp"]

[dependencies]
mcpplibs.cmdline = "0.0.3"
hanim.timeline   = { path = ".." }
mlibs.utils      = { path = "../../../../base/utils" }
mcpplibs.os      = "0.4.4"
nlohmann.json    = "3.12.0"
