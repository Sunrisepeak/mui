# openmui.rhi.webgpu — omui.rhi on the page's WebGPU (D-84 §6.3, the Web's
# main path): WGSL shaders, the device asked for as the program loads, one
# call into the page a resource and one a submission (rhi's wire words). The
# page's half is src/js/omui_webgpu.js, which build.mcpp gives the link; off
# the Web (src/native/elsewhere) there is no WebGPU and create() says so.
[package]
namespace   = "openmui.rhi"
name        = "webgpu"
version     = "0.1.0"
description = "omui.rhi on the page's WebGPU: WGSL shaders, one call into the page a submission"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"
platforms   = ["linux", "macos", "windows", "emscripten"]

[package.metadata.openmui]
kind = "backend"

[targets.openmui-rhi-webgpu]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

# The page (src/js/omui_webgpu.js, through Emscripten), or no page.
[target.'cfg(os = "emscripten")'.build]
sources = ["src/native/browser/*.cpp"]

[target.'cfg(not(os = "emscripten"))'.build]
sources = ["src/native/elsewhere/*.cpp"]

[dependencies]
openmui.rhi    = { path = ".." }
openmui.memory = { path = "../../../base/memory" }

[dev-dependencies]
openmui.testing = { path = "../../../base/testing" }
openmui.rhi.cts = { path = "../cts" }
mcpplibs.os     = "0.2.2"
