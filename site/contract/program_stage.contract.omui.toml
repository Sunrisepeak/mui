# A work of the motion page (the site plan §7.1): a hanim object playing a
# recipe on the host's one engine, drawn by the node (omui.hanim's Drawing).
# Its time is yours: scrub it, play it, pause it — every moment drawn the
# same each time (a recipe is a function of time).
[contract.program_stage]
role = "image"
spec = "0.1"
doc  = "A hanim work on a stage: its time scrubbed, played and paused; every moment the same each time."

[contract.program_stage.props]
work    = { type = "string", default = "", doc = "Which work it shows (the site's works: mark-writing, mui-gather)." }
at      = { type = "f64", default = 0.0, bindable = true, doc = "Its time, in seconds: written as it plays; set, it goes there and holds." }
playing = { type = "bool", default = false, bindable = true, doc = "Playing on, to its end, where it holds." }
length  = { type = "f64", default = 0.0, bindable = true, doc = "How long it is (seconds): written once it is made (a slider's end)." }
label   = { type = "string", default = "", doc = "What it shows, said (its accessible name)." }
delay   = { type = "f64", default = 0.0, bindable = true, doc = "Seconds before it begins (a work that takes timing: cards-rise)." }
bounce  = { type = "f64", default = 0.0, bindable = true, doc = "How much it overshoots and settles, 0 (none) to 1 (a work that takes timing)." }
plan    = { type = "string", default = "", bindable = true, doc = "Its choreography as hanim planned it — each piece's start and end, seconds: written once it is made." }

[contract.program_stage.actions]
play  = { effect = "reversible", doc = "Plays on from where it is (from its start when at its end)." }
pause = { effect = "reversible", doc = "Holds where it is." }
seek  = { effect = "reversible", args = { at = "f64" }, doc = "To a moment of it (seconds), held there." }
retime = { effect = "reversible", args = { delay = "f64", bounce = "f64" }, doc = "Its timing changed (seconds before it begins; how much it overshoots, 0 to 1), and played again from its start." }

[contract.program_stage.parts]
figure = {}
