# openmui.ui.liquid_glass — liquid glass as components (D-64, features §3.3):
# `liquid_glass`, a container whose surface is a thick transparent material
# over what lies under it, and `glass_group`, whose members merge like drops.
# Contract-first: contract/*.contract.omui.toml become the bases, builders,
# stubs and schema when it builds (openmui.rules). The look is the renderer's
# built-in `liquid_glass` effect (openmui.render); the semantics are an
# ordinary group's; reduced transparency draws an opaque panel.
[package]
namespace   = "openmui.ui"
name        = "liquid_glass"
version     = "0.1.0"
description = "Liquid glass components: a container of thick transparent material over its backdrop, and groups that merge like drops"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "component"

[targets.openmui-ui-liquid-glass]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
openmui.core   = { path = "../../runtime/core" }
openmui.view   = { path = "../../runtime/view" }
openmui.render = { path = "../../modules/render" }

[build-dependencies]
openmui.rules = { path = "../../mcpp/rules", host-module = true }

[dev-dependencies]
openmui.testing       = { path = "../../tests/support" }
openmui.host.headless = { path = "../../hosts/headless" }
openmui.semantic      = { path = "../../runtime/semantic" }
