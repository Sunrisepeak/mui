# xrender.rhi.webgl — mlibs.rhi on the page's WebGL2 (D-84 §6.3, the Web's
# compatibility path): ESSL shaders, the context made with the device, one
# call into the page a resource and one a submission (rhi's wire words). The
# page's half is src/js/omui_webgl.js, which build.mcpp gives the link; off
# the Web (src/native/elsewhere) there is no WebGL2 and create() says so.
[package]
namespace   = "xrender.rhi"
name        = "webgl"
version     = "0.1.0"
description = "mlibs.rhi on the page's WebGL2: ESSL shaders, one call into the page a submission"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"
platforms   = ["linux", "macos", "windows", "emscripten"]

[package.metadata.openmui]
kind = "backend"
agent = { part = "xrender.frame" }

[targets.xrender-rhi-webgl]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

# The page (src/js/omui_webgl.js, through Emscripten), or no page.
[target.'cfg(os = "emscripten")'.build]
sources = ["src/native/browser/*.cpp"]

[target.'cfg(not(os = "emscripten"))'.build]
sources = ["src/native/elsewhere/*.cpp"]

[dependencies]
mlibs.rhi    = { path = "../../../../gfx/rhi" }
mlibs.memory = { path = "../../../../base/memory" }

[dev-dependencies]
mcpplibs.mtest = "0.5.2"
mlibs.utils = { path = "../../../../base/utils" }
mlibs.rhi.cts = { path = "../../../../gfx/rhi/cts" }
mcpplibs.os     = "0.4.4"
