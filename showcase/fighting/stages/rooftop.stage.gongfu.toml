# 坤's rooftop (the hardcore combat design's stages): a city rooftop at blue
# hour, painted in layers (stages/art, generated and keyed by gongfu-studio):
# a dusk sky from deep blue to a warm horizon over the skyline; a water tower
# on stilts, an old billboard lit from below, a chain-link fence along the
# back hung with warm string lights, and far on one side a worn hoop in
# shadow (the ball stays a hint); weathered concrete with faint court lines
# catching the lights; speakers and a boombox on a crate, a bench with a
# hoodie thrown over it; a fence's edge and a vent pipe in front. The light
# comes from the low sun behind, upper left, and the string lights.
gongfu = "0.1"
name = "rooftop"
sky = ["#101a3a", "#2a2440"]
floor = "#1c1e26"
line = "#0e1016"
marks = false
light = { from = [-0.6, -0.8], shadow = "#141a33", rim_color = "#ffb070bb", color = "#ffd2a6" }

[[picture]]
name = "far"
file = "art/rooftop-far.webp"
size = [1152, 768]

[[picture]]
name = "mid"
file = "art/rooftop-mid.webp"
size = [1152, 768]

[[picture]]
name = "floor"
file = "art/rooftop-floor.webp"
size = [1152, 300]

[[picture]]
name = "near"
file = "art/rooftop-near.webp"
size = [1152, 768]

[[picture]]
name = "front"
file = "art/rooftop-front.webp"
size = [1152, 768]

[[layer]]
name = "sky and skyline"
parallax = 0.15
[[layer.image]]
picture = "far"
source = [0, 0, 1152, 768]
at = [370, -250]
width = 1180

