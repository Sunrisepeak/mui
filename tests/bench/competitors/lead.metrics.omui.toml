# The metrics each project is judged by (Part 2 plan §2, §4; D-135): fixed
# and reviewed before they are measured, never dropped for a bad result.
#
#   status = "measured"           run.sh --ledger measures it (series in key/field)
#            "planned"            on the list, its harness not written yet (LD1)
#            "pending_hardware"   needs a device neither this machine nor CI has
#   better = "lower" | "higher"   for our value
#   core   = false                reported, not counted in "no core metric behind"
#
# A measured metric pairs `ours` with each of `competitors` round by round
# (series names as run.sh tags them: tools/eval/lead.py sample), on `key`'s
# `field`; tools/eval/lead.py verdict writes the ledger line.

# --- hanim: interactive motion, the Web (the same V8) -----------------------

[[metric]]
project = "hanim"
id = "motion.drive-1000.web.mean_ms"
about = "1000 values retargeted every 30 frames, a 60 Hz frame at a time: mean frame (wasm in node vs GSAP in the same node)"
better = "lower"
key = "drive-1000"
field = "mean_ms"
ours = "hanim-wasm"
competitors = ["gsap"]
status = "measured"

[[metric]]
project = "hanim"
id = "motion.drive-1000.web.p95_ms"
about = "the same work: the 95th percentile frame"
better = "lower"
key = "drive-1000"
field = "p95_ms"
ours = "hanim-wasm"
competitors = ["gsap"]
status = "measured"

[[metric]]
project = "hanim"
id = "motion.drive-1000.web.max_ms"
about = "the same work: the worst frame (the one that retargets all 1000)"
better = "lower"
key = "drive-1000"
field = "max_ms"
ours = "hanim-wasm"
competitors = ["gsap"]
status = "measured"

[[metric]]
project = "hanim"
id = "motion.drive-10k.web.mean_ms"
about = "10,000 values, otherwise as drive-1000; also against Motion (motion.dev)"
better = "lower"
ours = "hanim-wasm"
competitors = ["gsap", "motion"]
status = "planned"

[[metric]]
project = "hanim"
id = "motion.document.bytes"
about = "the same 10 s brand animation: document size (gzip)"
better = "lower"
ours = "hanim"
competitors = ["lottie", "rive"]
status = "planned"

[[metric]]
project = "hanim"
id = "motion.playback.ms"
about = "the same 10 s brand animation: playback frame time"
better = "lower"
ours = "hanim-wasm"
competitors = ["rive", "lottie-web"]
status = "planned"

[[metric]]
project = "hanim"
id = "motion.gpu.morph-1m.ms"
about = "a morph of 1,000,000 control points on a real GPU"
better = "lower"
ours = "hanim-gpu"
competitors = ["hanim-cpu"]
status = "pending_hardware"
needs = "a physical GPU SDL_GPU can open: this machine's RTX 4080 has no VK_EXT_headless_surface, so SDL's offscreen driver cannot use it (needs an X/Wayland display)"

