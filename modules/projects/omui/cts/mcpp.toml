# omui.cts — the harness of the conformance suite's level S
# (spec/conformance/S): the scenarios, the run of a language's runner through
# the two verbs it registers, and the comparison of what it records with the
# trace pinned beside the scenario. The TypeScript and JavaScript tests use it
# (D-138 removed the Lua and Python runners).
#
# A dev-dependency only: it is part of no artifact.
[package]
namespace   = "omui"
name        = "cts"
version     = "0.1.0"
description = "The CTS level S harness: language-neutral scenarios and their pinned traces"
license     = "Apache-2.0"

[package.metadata.openmui]
agent = { library = "conformance suites of the specification: for tests only" }

[targets.omui-cts]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
mlibs.cts     = { path = "../../../base/cts" }
nlohmann.json = "3.12.0"
mcpplibs.os   = "0.4.4"
