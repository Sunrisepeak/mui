# Example 12 — a notes application of four parts (canvas-markdown §5;
# component-binding §9): the views and the logic in TypeScript
# (logic/main.ts), text macros in a script of their own (plugins/macros.ts,
# as verbs any script or agent calls), a help panel as a view document
# (ui/help.view.omui.json, mounted into the TypeScript view's slot), and the
# search in C++ (openmui's native module `fuzzy`). They share only what the
# design allows: signals, models, verbs and events. The tool: notes in
# Markdown, searched as you type, edited beside their preview, with tasks you
# tick in the preview.
#
#   mcpp run                       a window
#   mcpp run -- --headless --png notes.png
[package]
namespace   = "omui.example"
name        = "notes"
version     = "0.1.0"
description = "openmui example 12: a Markdown notes application in TypeScript, a view document and C++"
license     = "Apache-2.0"

[package.metadata.openmui]
kind  = "app"
id    = "org.openmui.notes"
title = "Notes"
size  = "960x620"
views = ["ui/*.view.omui.json"]

[package.metadata.openmui.scripts]
macros = "plugins/macros.ts"
main   = "logic/main.ts"

[targets.notes]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/*.cpp"]

[dependencies]
omui.entry.player = { path = "../../src/entry/player" }

[dev-dependencies]
mcpplibs.mtest = "0.5.2"
mlibs.utils      = { path = "../../modules/base/utils" }
omui.player       = { path = "../../modules/projects/omui/player" }
omui.lang.js      = { path = "../../modules/projects/omui/lang/js" }
omui.ui.markdown  = { path = "../../modules/projects/omui/components/markdown" }
omui.native.fuzzy = { path = "../../modules/projects/omui/native/fuzzy" }
