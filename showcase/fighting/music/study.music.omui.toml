F3+A3+C4+G4 | E3+G3+C4+D4 | F3+Bb3+D4+F4 | E3+G3+C4+D4 |
F3+A3+C4+G4 | E3+G3+C4+D4 | F3+Bb3+D4+F4 | E3+A3+D4+E4 |
"""

# Bb | Cadd9 | Dm9 | Dm9 | Bb | Cadd9 | Asus4 | A
[pattern.pad_c]
