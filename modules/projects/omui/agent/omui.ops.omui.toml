# omui's operations (convergence plan §10.3): what an Agent may do with a
# running application through its agent endpoint — the openmui.tree protocol's
# operations, one request each (`{"op": "<name without ui.>", …}`). omui-gen ops
# makes the protocol's table (src/catalog/catalog.cppm) and the listings
# (src/catalog/omui.ops.json for CLI and MCP, omui.ops.md) from it; effects are
# openas's, admission is mlibs.control's. An application's own verbs and its
# nodes' actions are its contracts' (`describe` lists them), not this catalog's.
[catalog]
product   = "omui"
module    = "omui.agent"
namespace = "omui::agent"
doc       = "Read, find, act on, wait for, capture and inspect a running application's semantic tree."
generated = "src/catalog"

[[operation]]
name    = "ui.describe"
effect  = "read"
summary = "What this endpoint is: the protocol, the application, its operations, the session's policy and the application's verbs"
result  = "json"

[[operation]]
name    = "ui.snapshot"
effect  = "read"
summary = "The semantic tree, or a part of it"
params  = [
    { name = "root", type = "node", doc = "the subtree's root (the window when absent)", optional = true },
    { name = "depth", type = "integer", doc = "levels below the root (all when absent)", optional = true },
    { name = "interactive", type = "bool", doc = "only nodes a person or an agent can act on", optional = true },
    { name = "offset", type = "integer", doc = "the first node of a page", optional = true },
    { name = "limit", type = "integer", doc = "the nodes of a page", optional = true },
    { name = "children_limit", type = "integer", doc = "children listed under one node", optional = true },
]
result  = "tree"
cost    = "bounded"

[[operation]]
name    = "ui.changes"
effect  = "read"
summary = "What changed in the tree since the last snapshot or changes"
result  = "json"

[[operation]]
name    = "ui.find"
effect  = "read"
summary = "Nodes matching a query (role, name, id, state; wildcards)"
params  = [{ name = "q", type = "json", doc = "a query: {\"role\": \"button\", \"name\": \"Save*\"}" }]
result  = "json"
cost    = "bounded"

[[operation]]
name      = "ui.act"
effect    = "irreversible"
delegated = true
summary   = "Perform a node's action, under that action's effect (an irreversible one asks the person)"
params    = [
    { name = "node", type = "node" },
    { name = "action", type = "string", doc = "one of the node's actions (activate, toggle, set_value, …)" },
    { name = "args", type = "json", doc = "the action's arguments", optional = true },
    { name = "answer", type = "string", doc = "the person's answer, when the action asks", optional = true },
    { name = "dry_run", type = "bool", doc = "only say what would happen", optional = true },
]
result    = "json"
cost      = "frame"
undo      = "the action's own: ui.undo for a reversible one; an irreversible one cannot be taken back"

[[operation]]
name      = "ui.invoke"
effect    = "irreversible"
delegated = true
summary   = "Call one of the application's verbs, under its declared effect"
params    = [
    { name = "verb", type = "string", doc = "a verb ui.describe lists" },
    { name = "args", type = "json", doc = "its arguments", optional = true },
    { name = "answer", type = "string", doc = "the person's answer, when the verb asks", optional = true },
    { name = "dry_run", type = "bool", doc = "only say what would happen", optional = true },
]
result    = "json"
cost      = "bounded"
undo      = "the verb's own (an undoable verb: ui.undo)"

[[operation]]
name    = "ui.undo"
effect  = "reversible"
summary = "Take back the last change in a history scope"
params  = [{ name = "scope", type = "node", doc = "a node's undo scope (the window's when absent)", optional = true }]
result  = "json"
undo    = "ui.redo"

[[operation]]
name    = "ui.redo"
effect  = "reversible"
summary = "Do again what ui.undo took back"
params  = [{ name = "scope", type = "node", optional = true }]
result  = "json"
undo    = "ui.undo"

[[operation]]
name    = "ui.transaction"
effect  = "reversible"
summary = "Steps performed as one: all done, or all taken back"
params  = [
    { name = "steps", type = "json", doc = "a list of {node, action, args, answer}" },
    { name = "label", type = "string", doc = "what the history calls it", optional = true },
]
result  = "json"
cost    = "bounded"
undo    = "ui.undo takes the whole transaction back"

[[operation]]
name    = "ui.preview"
effect  = "read"
summary = "What steps would make, shown before it is allowed: pictures before and after, the semantic changes; nothing stays"
params  = [
    { name = "steps", type = "json", doc = "a list of {node, action, args}" },
    { name = "pictures", type = "bool", doc = "with the pictures (default: when the host renders)", optional = true },
]
result  = "json"
cost    = "bounded"

[[operation]]
name    = "ui.history"
effect  = "read"
summary = "A history scope's changes, what can be undone and redone"
params  = [{ name = "scope", type = "node", optional = true }]
result  = "json"

[[operation]]
name    = "ui.wait"
effect  = "read"
summary = "Answer when a condition holds: a node present or absent, the tree settled"
params  = [
    { name = "q", type = "json", doc = "a query that must match", optional = true },
    { name = "absent", type = "json", doc = "a query that must not match", optional = true },
    { name = "settled", type = "bool", doc = "no animation or layout pending", optional = true },
    { name = "timeout", type = "seconds", optional = true },
]
result  = "json"
cost    = "heavy"

[[operation]]
name    = "ui.capture"
effect  = "read"
summary = "The picture as drawn: the window, a node, or a region of it, as PNG pixels or as SVG with every node's drawing marked"
params  = [
    { name = "node", type = "node", optional = true },
    { name = "region", type = "json", doc = "[x, y, width, height] from the node's corner, in logical pixels", optional = true },
    { name = "format", type = "string", doc = "png (pixels, the default) or svg (vectors at any size; each node's drawing a group marked data-node with its path; what SVG cannot say kept as pixels, listed in `islands`)", optional = true },
]
result  = "image"
cost    = "frame"

[[operation]]
name    = "ui.input"
effect  = "reversible"
summary = "A person's input as their devices give it (pointer, keys, text), delivered a frame at a time; answers what each press hit"
params  = [{ name = "events", type = "json", doc = "a list of {type: move, click, drag, wheel, key, keys, text, wait, …}" }]
result  = "json"
cost    = "heavy"
undo    = "what the input performed is the actions' own (ui.undo for reversible ones)"

[[operation]]
name    = "ui.inspect"
effect  = "read"
summary = "A node's layout, style, state, bindings and motion, for development"
params  = [{ name = "node", type = "node", optional = true }]
result  = "json"

[[operation]]
name    = "ui.stats"
effect  = "read"
summary = "Frame times (mean, percentiles, phases) and the last frame's counts"
params  = [{ name = "history", type = "integer", doc = "the last frames, oldest first (up to 240)", optional = true }]
result  = "json"

[[operation]]
name    = "ui.profile"
effect  = "reversible"
summary = "Start or stop recording a trace; stopping answers its summary (and Chrome's format)"
params  = [
    { name = "action", type = "string", doc = "start or stop" },
    { name = "chrome", type = "bool", optional = true },
]
result  = "json"
undo    = "the other action"

[[operation]]
name    = "ui.logs"
effect  = "read"
summary = "Recent log records, by level and category"
params  = [
    { name = "level", type = "string", doc = "trace, debug, info, warning or error", optional = true },
    { name = "category", type = "string", optional = true },
    { name = "limit", type = "integer", optional = true },
]
result  = "json"

[[operation]]
name    = "ui.debug"
effect  = "reversible"
summary = "Debug overlays (bounds, repaints, inspector, HUD), the slow-frame threshold and the log filter"
params  = [
    { name = "bounds", type = "bool", optional = true },
    { name = "repaints", type = "bool", optional = true },
    { name = "inspector", type = "bool", optional = true },
    { name = "hud", type = "bool", optional = true },
    { name = "slow_frame_ms", type = "number", optional = true },
    { name = "log", type = "string", doc = "a filter: layout=debug,*=info", optional = true },
]
result  = "json"
undo    = "ui.debug with the values it answered before"

[[operation]]
name    = "ui.pipeline"
effect  = "reversible"
summary = "The frame's pipeline: show it (a read), or replace, insert or remove one stage between frames"
params  = [
    { name = "action", type = "string", doc = "show (the default), replace, insert or remove", optional = true },
    { name = "stage", type = "string", optional = true },
    { name = "plugin", type = "string", optional = true },
    { name = "after", type = "json", doc = "the stages it follows (insert)", optional = true },
    { name = "config", type = "json", optional = true },
]
result  = "json"
undo    = "the opposite change: the stage as show read it"

[[operation]]
name    = "ui.clock"
effect  = "reversible"
summary = "The application's time: show it (a read), or pause, resume, rate, step, seek and release"
params  = [
    { name = "action", type = "string", doc = "show (the default), pause, resume, rate, step, seek or release", optional = true },
    { name = "rate", type = "number", optional = true },
    { name = "seconds", type = "seconds", doc = "step by, or seek to", optional = true },
]
result  = "json"
undo    = "release gives the time back to the host"
