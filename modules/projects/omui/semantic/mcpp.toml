# omui.semantic — the semantic tree as agents, tests and assistive
# technology see it: snapshots (paged, by subtree and depth, compact), deltas
# between revisions, queries by role, name, state, value and place, actions
# with their effects and answers, conditions to wait for, and the spec's
# checks over the whole tree; plus recording sessions as semantic actions and
# the clock, and replaying them exactly (with openmui.session).
[package]
namespace   = "omui"
name        = "semantic"
version     = "0.1.0"
description = "openmui semantic tree: snapshots, deltas, queries, actions, wait conditions, checks, recording and replay"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "library: semantic queries, actions and their records for agents and hosts"
reexports = ["mlibs.agent", "omui.core", "omui.view"]  # what its interface re-exports (lint module-closure)
kind = "runtime"
agent = { part = "omui.agent" }

[targets.openmui-semantic]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
omui.core    = { path = "../core" }
omui.view    = { path = "../view" }
mlibs.agent   = { path = "../../../base/agent", features = ["session"] }  # mlibs.session
mlibs.utils    = { path = "../../../base/utils" }
mlibs.unicode  = { path = "../../../base/unicode" }  # the characters a look's faces drew (their order)

[dev-dependencies]
mlibs.text.harfbuzz = { path = "../../../content/text/harfbuzz" }  # the shaper its tests draw text with (mlibs.text's slot)
mcpplibs.mtest = "0.11.3"
mlibs.cts = { path = "../../../base/cts" }
