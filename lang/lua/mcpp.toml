# openmui.lang.lua — Lua 5.4 (compat.lua) on the Script Binding Profile
# (component-binding §7): the `omui` module, its builders (table
# constructors: omui.Column { gap = 8, omui.Text { … } }), signals with
# expression arithmetic, regions, verbs, models and the bus interface.
# Embedded: the script runs on openmui.lang's script thread.
[package]
namespace   = "openmui.lang"
name        = "lua"
version     = "0.1.0"
description = "openmui for Lua 5.4: builders, signals, expressions, verbs, models and the semantic tree"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "lang"

[targets.openmui-lang-lua]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/native/*.cpp"]

[dependencies]
openmui.lang  = { path = "../common" }
openmui.abi    = { path = "../../runtime/abi" }
openmui.player = { path = "../../runtime/player" }
nlohmann.json = "3.12.0"
compat.lua    = "5.4.7"

[dev-dependencies]
openmui.testing = { path = "../../tests/support" }
openmui.cts     = { path = "../../tests/cts" }
openmui.native.fuzzy = { path = "../../natives/fuzzy" }
openmui.theme.default = { path = "../../themes/default" }
openmui.theme.compact = { path = "../../themes/compact" }
openmui.ui.base = { path = "../../components/base" }
