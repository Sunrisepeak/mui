# hanim.core — deterministic time, values, curves and prepared geometry.
#
# The standard library, mlibs.math, mlibs.utils, mlibs.memory and mlibs.geom only
# (D-49, D-55, D-87: its deterministic functions moved to mlibs.math; D-110: its
# time is mlibs.time; D-113: its handles are mlibs.memory's; D-131: its contour
# measures are mlibs.geom's), each an independent
# component: they can leave this repository unchanged. Every animation is a pure function of time, and its
# results are the same bits on every platform (A-level conformance), which is
# why the floating-point flags below are not optional.
[package]
namespace   = "hanim"
name        = "core"
version     = "0.1.0"
description = "A general animation engine: tweens, keyframes, analytic springs and decay, timelines, OKLab colour; seekable and deterministic"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"
agent = { part = "hanim" }

[targets.hanim-core]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]
# No fused multiply-add the source did not write: GCC fuses by default outside
# ISO mode and Clang fuses within an expression, either of which changes the
# last bit of a spring or a colour on one platform and not another.
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
mlibs.math  = { path = "../../../base/math" }
mlibs.utils  = { path = "../../../base/utils" }
mlibs.memory = { path = "../../../base/memory" }
mlibs.geom   = { path = "../../../base/geom" }

[dev-dependencies]
mcpplibs.mtest = "0.6.3"
