[package]
namespace = "openmui.simulation.cellular"
name = "rhi"
version = "0.1.0"
description = "Optional RHI compute execution of the prepared integer cellular rule contract"
license = "Apache-2.0"
platforms = ["linux", "macos", "windows", "emscripten"]
repo = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "backend"

[targets.openmui-simulation-cellular-rhi]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[build-dependencies]
openmui.shader.rules = { path = "../../../shader/rules", host-module = true }

[dependencies]
openmui.simulation.cellular = { path = "../../../../base/simulation/cellular" }
openmui.rhi = { path = "../../../rhi" }
openmui.trace = { path = "../../../../base/trace" }
