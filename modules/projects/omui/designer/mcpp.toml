# omui.designer — Live Design's designer (D-149, D-151): the design.* verbs,
# the design's history, previews and variants in stand-ins and the timeline,
# for a player in development mode.
#
# A package of its own rather than part of the player: a release must be built
# without it (D-149), and a program has it by linking it — the entry player's
# `design` feature (`omui dev`) — never by a switch at run time.
[package]
namespace   = "omui"
name        = "designer"
version     = "0.1.0"
description = "Live Design's designer: the design verbs, history, previews, variants and timeline of an application in development mode"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"

[targets.openmui-designer]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
omui.core     = { path = "../core" }
omui.view     = { path = "../view" }
omui.abi      = { path = "../abi" }
omui.semantic = { path = "../semantic" }
omui.player   = { path = "../player" }
# Live Design's catalog (design.ops.omui.ts): the design.* verbs as declared.
omui.agent    = { path = "../agent" }
mlibs.utils   = { path = "../../../base/utils" }

[dev-dependencies]
# Tests are mtest's (D-147).
mcpplibs.mtest     = "0.5.0"
mlibs.image        = { path = "../../../base/image" }
omui.ui.base       = { path = "../components/base" }
# Twins of the application, as the entry makes them, for the tests.
omui.host.headless = { path = "../host/headless" }
