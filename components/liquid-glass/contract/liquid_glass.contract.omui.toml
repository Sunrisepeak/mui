# Liquid glass (D-64): a container whose surface is a thick transparent
# material over what lies under it — the backdrop bent at its rounded edge,
# split by colour, frosted, tinted to keep its content legible, lit at the
# rim. It changes only how things look: its semantic node is an ordinary
# group's. With reduced transparency (a system setting) it is an opaque
# panel. Inside a glass_group its glass is the group's, merged with its
# siblings'. features-plugins-pipeline §3.3.
[contract.liquid_glass]
role     = "group"
spec     = "0.1"
children = "any"
doc      = "A container of liquid glass: what lies behind it, seen through a thick transparent material."

[contract.liquid_glass.props]
radius     = { type = "f64", default = 24, doc = "Corner radius, logical pixels: a capsule when it is half the height." }
padding    = { type = "f64", default = 12, doc = "Space between the glass's edge and its content, logical pixels." }
thickness  = { type = "f64", default = 12, doc = "How thick the glass looks: the bevel's width in logical pixels, where what is behind bends." }
ior        = { type = "f64", default = 1.45, doc = "Index of refraction: how strongly the bevel bends what is behind (1: not at all)." }
blur       = { type = "f64", default = 0, doc = "Frosting: how much what is behind is blurred, logical pixels (0: clear glass)." }
dispersion = { type = "f64", default = 0.3, doc = "Colour split at the bevel, as through a prism (0: none)." }
tint       = { type = "color", default = "#ffffff1a", doc = "The glass's own colour over what is behind; its alpha is how much." }
light_x    = { type = "f64", default = 0.4, doc = "The light's direction, x: the rim facing it is lit (bind it to a device's tilt)." }
light_y    = { type = "f64", default = -0.8, doc = "The light's direction, y (up is negative)." }
rim        = { type = "f64", default = 0.6, doc = "How bright the rim light and the inner edge line are (0: none)." }
adaptive   = { type = "bool", default = true, doc = "Darker over a bright backdrop, lighter over a dark one, so the content stays legible." }
label      = { type = "string", default = "", doc = "The group's accessible name." }
