# Kiln in a window (the release plan's RC2.5): Mui's cavern played with keys, the mouse or a gamepad, drawn each
# frame (the picture's display list on the CPU), heard through the system's output; every frame's input recorded,
# so the window's game and the headless game are the same bits. And kiln-play (D-186): the game with no window as a
# program an agent talks to with a pipe — a JSON request a line, the records of its answer. Both are the native
# systems' only (a window, a command line and standard input); the game itself, which also builds for the Web, is
# showcase/kiln (D-99).
[package]
namespace   = "omui.showcase.kiln"
name        = "window"
version     = "0.1.0"
description = "Kiln in a window (keys, mouse, gamepad; drawn and heard; its recording the headless game) and kiln-play, the game over lines"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "preview"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "platform: Kiln's window program, native only (the game itself runs on the Web)"

[targets.omui-showcase-kiln-window]
kind = "lib"

[targets.kiln]
kind = "bin"
main = "src/entry/main.cpp"

[targets.kiln-play]
kind = "bin"
main = "src/entry/play.cpp"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
omui.showcase.kiln = { path = ".." }
xengine.runtime  = { path = "../../../modules/projects/xengine/game/runtime", features = ["lines"] }  # kiln-play's
mlibs.agent      = { path = "../../../modules/base/agent" }
omui.sdk         = { path = "../../../modules/projects/omui/sdk" }
xengine.ui       = { path = "../../../modules/projects/xengine/game/ui" }
xengine.input    = { path = "../../../modules/projects/xengine/game/input" }
xengine.audio.device = { path = "../../../modules/projects/xengine/kernel/audio/device" }
xrender.raster   = { path = "../../../modules/projects/xrender/raster" }
xrender.vector   = { path = "../../../modules/projects/xrender/vector" }
mcpplibs.cmdline = "0.0.3"
mcpplibs.os      = "0.4.4"

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
omui.host.headless = { path = "../../../modules/projects/omui/host/headless" }
mlibs.json     = { path = "../../../modules/base/json" }
