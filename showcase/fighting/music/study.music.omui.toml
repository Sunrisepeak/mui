# ── harmony ──────────────────────────────────────────────────────────────

# Dm9 | Bbmaj7 | Cadd9 | Am7 | Dm9 | Bbmaj7 | Gm7 | Asus4
[pattern.pad_a]
instrument = "pad"
step = "1/1"
notes = """
D3+A3+E4+F4 | F3+A3+Bb3+D4 | E3+G3+C4+D4 | E3+A3+C4+G4 |
D3+A3+E4+F4 | F3+A3+Bb3+D4 | D3+G3+Bb3+F4 | E3+A3+D4+E4 |
"""

# Fadd9 | Cadd9 | Bb | Cadd9 | Fadd9 | Cadd9 | Bb | Asus4
[pattern.pad_b]
