[package]
namespace = "xengine"
name = "cellular"
version = "0.1.0"
description = "Prepared integer field rules with immutable reads, bounded neighborhoods and tiled writes"
license = "Apache-2.0"
platforms = ["linux", "macos", "windows", "emscripten"]
repo = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "module"
agent = "subject"

[targets.xengine-cellular]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
mlibs.utils = { path = "../../../../base/utils" }
# The numbers an exchange chooses by (mix32: what a shader computes alike).
mlibs.math  = { path = "../../../../base/math" }
# The host's parallel-for a step may be given (FunctionRef: no allocation, no thread of the kernel's own).
mlibs.memory = { path = "../../../../base/memory" }

# The field as an agent's subject (src/agent/, module xengine.cellular.agent; D-174): its frames on the
# clock and history library, its operations through the agent kernel. A feature, so that the kernel alone
# stays what it was — no clock, no transport, the small tools and nothing more.
[features]
agent = { sources = ["src/agent/*.cppm", "src/agent/*.cpp"] }
# The lattice as a carrier of matter (src/matter/, module xengine.cellular.matter; D-165): a matter program
# lowered to a lattice program — its table, its transfers and reactions, cells moving by density and phase.
# A feature: the kernel knows a key and numbers, and that a row is a material only here.
matter = { sources = ["src/matter/*.cppm", "src/matter/*.cpp"] }
# A field of matter as an agent's subject (src/matter/agent/, module xengine.cellular.matter.agent; D-169):
# materials by name, channels in units, a quantity applied, and why a cell is what it is — the record of causes
# made at each frame's commit from the matter kernel's `why`. Both of the above, and nothing more.
matter-agent = { implies = ["agent", "matter"], sources = ["src/matter/agent/*.cppm", "src/matter/agent/*.cpp"] }

[feature-deps.agent]
mlibs.simulation = { path = "../../../../base/simulation" }
mlibs.agent      = { path = "../../../../base/agent" }
mlibs.control    = { path = "../../../../base/control" }
mlibs.json       = { path = "../../../../base/json" }
openlifa.openas  = "0.2.0"

[feature-deps.matter]
xengine.matter = { path = "../matter", default-features = false }

[dev-dependencies]
mcpplibs.mtest = "0.6.3"
mlibs.simulation   = { path = "../../../../base/simulation" }
mlibs.cts          = { path = "../../../../base/cts" }
