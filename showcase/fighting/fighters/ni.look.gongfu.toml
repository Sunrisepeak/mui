# 霓 (Ni), the street fighter: how she looks and how her hits feel (gongfu characters
# design §4.3; the fighting game's quality design §3, §5). Drawn in neon on a dark
# body: an undercut with a long magenta fringe that whips after her, a cropped
# bomber with a high collar and a lit zip, hand wraps under fingerless gloves
# with lit knuckles, cargo trousers with a lit knee, sneakers with white soles,
# and an earphone cord whose lit end trails her. Afterimages behind every move,
# electric sparks, a cinematic in a neon city. In a bone's frame x runs along it
# and y across: for a bone pointing up, +y is her back.
gongfu = "0.1"
name = "ni"
outline = { color = "#ff3ea5", width = 2 }
accent = "#ff3ea5"
art_scale = 0.27
trail = { color = "#ff3ea5", frames = [2, 4, 6], alpha = 0.32 }
light = { from = [-0.62, -0.78], shade = 4, darken = 0.35, shadow = "#05040c", rim = 2, rim_color = "#3ef2ffaa" }

[[palette]]
name = "neon"
body = "#15151f"
limb = "#202034"
skin = "#d9b49c"
hair = "#ff3ea5"
light = "#3ef2ff"
wrap = "#e6e6ee"
sole = "#f2f2f7"

[[palette]]
name = "acid"
body = "#141a12"
limb = "#1f2a1a"
skin = "#d9b49c"
hair = "#c6ff3e"
light = "#ff8a3e"
wrap = "#e6e6ee"
sole = "#e6efe0"

