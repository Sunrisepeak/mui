# xengine.dynamics — every solved simulation (D-133): collision and queries,
# the solver families (src/<family>/: xpbd today; rigid, articulation,
# fluids, FEM, MPM later, each its own feature when it comes), and the
# physical-material table they share. The CPU core is base layer (hanim and
# omui use it); a GPU part will be a gfx-layer rhi/ subpackage, as cellular's.
# Doubles with + − × ÷ and √ only, without contraction or fast math: the same
# bits everywhere.
[package]
namespace   = "xengine"
name        = "dynamics"
version     = "0.1.0"
description = "Solved simulation: collision and queries, XPBD soft bodies, physical materials; deterministic, steppable on mlibs.simulation"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "module"

[targets.xengine-dynamics]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/collision/*.cppm", "src/collision/*.cpp", "src/material/*.cppm", "src/material/*.cpp", "src/xpbd/*.cppm", "src/xpbd/*.cpp", "src/inspect/*.cppm", "src/inspect/*.cpp"]
cxxflags = ["-fno-fast-math", "-ffp-contract=off"]

[dependencies]
mlibs.utils = { path = "../../../base/utils" }

[dev-dependencies]
mcpplibs.mtest = "0.5.0"
mlibs.simulation = { path = "../../../base/simulation" }
