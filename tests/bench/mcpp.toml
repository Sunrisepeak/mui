# omui.bench — the framework's benchmarks: what a frame of the 1000-node
# dashboard costs at 1080p on the CPU (M1 acceptance ⑤), the pieces alone,
# and what tracing and logging cost when off. Each is a case of mtest's whose
# budgets (budgets.bench.xdef.json, for release builds) are the case's bounds:
#
#   OMUI_BENCH=1 mcpp test -p omui.bench --profile release budgets
[package]
namespace   = "omui"
name        = "bench"
version     = "0.1.0"
description = "openmui benchmarks: frame costs, pieces alone, reports and budgets"
license     = "Apache-2.0"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "product: the benchmarks"
kind = "tool"

[targets.openmui-bench]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
# The measuring is mtest's (bench::laps): the scenes' loop is its, in the library and in its tests.
mcpplibs.mtest = "0.11.3"
mrender.text = { path = "../../modules/projects/mrender/text" }
mrender.scene = { path = "../../modules/projects/mrender/scene" }
"mrender.mesh"  = { path = "../../modules/projects/mrender/mesh" }
"mrender.mesh.gpu" = { path = "../../modules/projects/mrender/mesh/gpu" }
mlibs.simulation = { path = "../../modules/base/simulation" }
mlibs.dynamics   = { path = "../../modules/base/dynamics" }
meng.dynamics = { path = "../../modules/projects/meng/kernel/dynamics", features = ["rigid", "rigid3"] }
# Navigation beside Detour called directly (simulation/nav-crowd-64), on the scenes of its conformance package.
meng.nav = { path = "../../modules/projects/meng/game/nav" }
"meng.nav.cts" = { path = "../../modules/projects/meng/game/nav/cts" }
# Skeletal animation (motion/skeleton-*): ACL's playback beside the raw channels, and a crowd's whole step.
hanim.skeleton = { path = "../../modules/projects/hanim/skeleton" }
"hanim.skeleton.cts" = { path = "../../modules/projects/hanim/skeleton/cts" }
# With the lattice as a carrier of matter (simulation/matter-lattice-*), and a field of it as an agent's subject
# with its record of causes (simulation/matter-256-causes; the feature implies `matter` and `agent`); and the
# whole 2D world, its bodies made of the lattice's cells (simulation/world-128x64-frame; the feature `rigid`).
meng.cellular = { path = "../../modules/projects/meng/kernel/cellular", features = ["matter-agent", "rigid"] }
meng.matter = { path = "../../modules/projects/meng/kernel/matter" }
# With matter's look as a shade on the lattice's presenter (simulation/matter-256-shade).
"meng.cellular.present" = { path = "../../modules/projects/meng/kernel/cellular/present" }
hanim.core = { path = "../../modules/projects/hanim/core" }
sunrisepeak.hanim = { path = "../../modules/projects/hanim", features = ["render-vector"] }
omui.sdk             = { path = "../../modules/projects/omui/sdk" }
mlibs.text.harfbuzz  = { path = "../../modules/content/text/harfbuzz" }  # the shaper its scenes' fonts are read with
omui.view            = { path = "../../modules/projects/omui/view", features = ["hanim"] }
# The mirror assistive technology reads (core/list-scroll/reading).
omui.accessibility   = { path = "../../modules/projects/omui/accessibility" }
mlibs.utils           = { path = "../../modules/base/utils" }
# The host's parallel-for a cellular step takes (simulation/matter-1024-*).
mlibs.memory          = { path = "../../modules/base/memory" }
mlibs.markdown        = { path = "../../modules/content/markdown" }
meng.audio           = { path = "../../modules/projects/meng/kernel/audio" }
hanim.timeline         = { path = "../../modules/projects/hanim/timeline" }
"meng.audio.timeline" = { path = "../../modules/projects/meng/kernel/audio/timeline" }
omui.ui.canvas       = { path = "../../modules/projects/omui/components/canvas" }
omui.showcase.markdown_wall   = { path = "../../showcase/markdown-wall" }
omui.showcase.style_gallery = { path = "../../showcase/style-gallery" }
omui.showcase.fighting = { path = "../../showcase/fighting" }
omui.showcase.widget_breakout.headless = { path = "../../showcase/widget-breakout/headless" }  # its simulation (src/sim)
# A frame of the FPS slice on a device (game/quay-frame-1080p-gpu, D-187).
omui.showcase.quay = { path = "../../showcase/quay" }  # its picture
# A chunked world branched and stepped (world/chunked-*).
meng.world = { path = "../../modules/projects/meng/game/world" }
"gongfu"                  = { path = "../../modules/projects/gongfu" }
"gongfu.present2d"      = { path = "../../modules/projects/gongfu/present2d" }
omui.theme = { path = "../../modules/projects/omui/theme" }  # with its packs
mlibs.rhi           = { path = "../../modules/gfx/rhi" }
mrender.rhi.sdl       = { path = "../../modules/projects/mrender/rhi/sdl" }
mcpplibs.os           = "0.4.8"



# The declared data kinds this package owns (mlibs.xdef registry, D-209): each kind and its major
# version, and the define module a data module imports each from (none: only tools write it).
[package.metadata.openmui.xdef]
kinds = { bench = 1 }
