# mrender.rhi.webgpu — mlibs.rhi on the page's WebGPU (D-84 §6.3, the Web's
# main path): WGSL shaders, the device asked for as the program loads, one
# call into the page a resource and one a submission (rhi's wire words). The
# page's half is src/js/omui_webgpu.js, which build.mcpp gives the link; off
# the Web (src/native/elsewhere) there is no WebGPU and create() says so.
[package]
namespace   = "mrender.rhi"
name        = "webgpu"
version     = "0.1.0"
description = "mlibs.rhi on the page's WebGPU: WGSL shaders, one call into the page a submission"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"
platforms   = ["linux", "macos", "windows", "emscripten"]

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "platform: the browser's WebGPU, Web only"
kind = "backend"
agent = { part = "mrender.frame" }

[targets.mrender-rhi-webgpu]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

# The page (src/js/omui_webgpu.js, through Emscripten), or no page.
[target.'cfg(os = "emscripten")'.build]
sources = ["src/native/browser/*.cpp"]

[target.'cfg(not(os = "emscripten"))'.build]
sources = ["src/native/elsewhere/*.cpp"]

[dependencies]
mlibs.rhi    = { path = "../../../../gfx/rhi" }
mlibs.memory = { path = "../../../../base/memory" }

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
mlibs.utils = { path = "../../../../base/utils" }
mlibs.rhi.cts = { path = "../../../../gfx/rhi/cts" }
mcpplibs.os     = "0.4.4"
