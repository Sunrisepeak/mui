# ── sections ─────────────────────────────────────────────────────────────

[section.intro]
bars = 8
layers = [
    { pattern = "intro_keys" },
    { pattern = "intro_pads" },
    { pattern = "intro_sub", at = 4 },
    { pattern = "intro_drums", at = 4 },
    { pattern = "rise", at = 6 },
    { pattern = "air" },
    { pattern = "air_drops" },
]

[section.a]
bars = 8
layers = [
    { pattern = "hook_a" },
    { pattern = "pads_a" },
    { pattern = "sub_a" },
    { pattern = "reese_a", intensity = [0.35, 1] },
    { pattern = "beat_soft", intensity = [0, 0.35] },
    { pattern = "beat_half", times = 7, intensity = [0.35, 0.6] },
    { pattern = "beat_full", times = 3, intensity = [0.6, 1] },
    { pattern = "beat_one", at = 6, intensity = [0.6, 1] },
    { pattern = "fill", at = 7, intensity = [0.35, 1] },
    { pattern = "arp_a", intensity = [0.6, 1] },
    { pattern = "pads_a", instrument = "stab", intensity = [0.85, 1] },
    { pattern = "crash", times = 1, intensity = [0.6, 1] },
    { pattern = "air" },
    { pattern = "air_drops" },
]

