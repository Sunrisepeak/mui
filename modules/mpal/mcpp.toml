# mpal — the services an operating system gives an application, as one contract
# on every platform, above mcpplibs.os (openkal → os → mpal). README.md.
[package]
name        = "mpal"
version     = "0.1.0"
description = "The services an operating system gives an application (notifications, …) as one contract on every platform, above mcpplibs.os"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[targets.mpal]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/dbus/*.cppm", "src/dbus/*.cpp"]

# One build for every system: backends are chosen with mcpplibs.os's platform
# questions (if constexpr; host() for an ok image). A system's own headers,
# where a service needs them, go in the smallest native unit (src/native/<os>).

[dependencies]
mcpplibs.os = "0.4.1"

[dev-dependencies]
# Tests are mtest's (D-147).
mcpplibs.mtest = "0.5.0"
