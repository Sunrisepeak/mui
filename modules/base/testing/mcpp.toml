# openmui.testing — the checks openmui's test programs share.
#
# Every member names it under [dev-dependencies], so it is part of no artifact.
[package]
namespace   = "openmui"
name        = "testing"
version     = "0.1.0"
description = "Test checks, suites and determinism hashes for openmui test programs"
license     = "Apache-2.0"

[targets.openmui-testing]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]
