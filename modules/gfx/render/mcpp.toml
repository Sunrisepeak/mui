# openmui.render — the rendering architecture (D-81): a frame as a graph of
# passes over the device's textures, and the textures it makes, pooled from
# frame to frame. Every rendering feature — 2D vector (render.vector), and
# later sprites, meshes, particles — records its passes into one graph, so
# 2D and 3D share the device, the pool, the order and the tracing.
[package]
namespace   = "openmui"
name        = "render"
version     = "0.1.0"
description = "The rendering architecture: a frame as a checked graph of passes over device textures, transient textures pooled across frames, a trace span per pass"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"
platforms   = ["linux", "macos", "windows", "emscripten"]

[package.metadata.openmui]
kind = "module"

[targets.openmui-render]
kind = "lib"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
openmui.rhi   = { path = "../rhi" }
mlibs.trace = { path = "../../base/trace" }

[dev-dependencies]
mlibs.testing = { path = "../../base/testing" }
mlibs.memory  = { path = "../../base/memory" }
