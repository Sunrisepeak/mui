# openmui.audio — sound for openmui and its games (D-86): sounds as data
# (*.sound.omui.toml: layered oscillators and noise, gliding pitch and
# filters, envelopes) and music as data (*.music.omui.toml: synthesised
# instruments, patterns as text, sections whose layers play by intensity, an
# arrangement), voices mixed into buses through their effects into a limited
# master, a block at a time with nothing allocated, every sample a function
# of what was played and when: an offline render is the same bits on every
# platform. Devices and codecs are plugins (openmui.audio.device).
# An independent component (D-55): the standard library, hanim (its
# deterministic math), openmui.trace (spans in category "audio"), toml++ and,
# for the omui-music tool's JSON, nlohmann.json.
#
#   mcpp run --release omui-music -- render piece.music.omui.toml --out x.wav --seconds 60
[package]
namespace   = "openmui"
name        = "audio"
version     = "0.1.0"
description = "Sounds and music as data, mixed in blocks with nothing allocated, rendered the same bits everywhere"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"

[targets.openmui-audio]
kind = "lib"

[targets.omui-music]
kind = "bin"
main = "src/main.cpp"

[build]
sources  = ["src/*.cppm", "src/*.cpp", "src/native/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
openmui.hash = { path = "../../base/hash" }
hanim               = { path = "../../base/hanim" }
openmui.trace       = { path = "../../base/trace" }
marzer.tomlplusplus = "3.4.0"
nlohmann.json       = "3.12.0"

[dev-dependencies]
openmui.testing = { path = "../../base/testing" }
