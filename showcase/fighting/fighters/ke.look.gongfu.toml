# 刻 (Ke), time: how she looks and how her hits feel (gongfu characters 2 design §4.4; the
# quality design §5; the hardcore combat design). The keeper of a clock tower and a
# horologist who fights: patient, exact, a faint knowing smile, always a move ahead. A
# black cape lined in midnight blue with gold dial rings and gear teeth; a black
# double-breasted waistcoat with brass buttons and a gold pocket watch on its chain; an
# ivory shirt with sleeve garters; white horologist's gloves; a round gold monocle on a
# chain; long black hair with one white streak, in a low ponytail that swings like a
# pendulum. Unarmed: two-finger jabs like a clock's hand, knife-hands, palms, long exact
# kicks; the watch and the clock's hands only in special moments. Her clone in gold; a
# rewind leaves ghosts along the way back; her level 3 stops time. Angles are degrees,
# counter-clockwise; keys by frame. In a bone's frame x runs along it and y across: for a
# bone pointing up, +y is her back.
gongfu = "0.1"
name = "ke"
outline = { color = "#0b0b0d", width = 1.6 }
accent = "#d4af37"
art_scale = 0.4
trail = { color = "#e8c56a", frames = [2, 4], alpha = 0.24 }
light = { from = [-0.62, -0.78], shade = 0, darken = 0.3, shadow = "#1b1d2c", rim = 0, rim_color = "#ffe8b0aa" }
clone = { tint = "#d4af3773" }
rewind = { color = "#e8c56a", ghosts = 5, frames = 18, mark = "mark_stand" }

[[palette]]
name = "clock"
gold = "#d4af37"

[[palette]]
name = "noon"
gold = "#c0392b"

# Her art (the art pipeline design §2), generated and cut by gongfu-studio: her parts (the
# joints covered by her sleeves, garters, trousers and boots), her gloved hands, her faces.
