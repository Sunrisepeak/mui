[package]
namespace = "hanim"
name = "engine"
version = "0.1.0"
description = "Owned object playback, deterministic batch sampling and public controls"
license = "Apache-2.0"
platforms = ["linux", "macos", "windows", "emscripten"]
repo = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"

[targets.hanim-engine]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[dependencies]
hanim.program = { path = "../program" }
mlibs.memory = { path = "../../../base/memory" }
mlibs.log = { path = "../../../base/log" }
mlibs.trace = { path = "../../../base/trace" }

[dev-dependencies]
mlibs.testing = { path = "../../../base/testing" }
hanim.render.vector = { path = "../render/vector" }
openmui.raster = { path = "../../raster" }
openmui.image = { path = "../../../base/image" }
