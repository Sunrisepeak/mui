# hanim.timeline.tool — the `hanim-timeline` command: what an Agent (or a
# person at a terminal) does with the timeline every editor shares
# (hanim.timeline) without a GUI: check a file (every problem at its line and
# column), ask what plays at a moment, make the usual edits (split, trim,
# move, remove, ripple remove) and take them back. JSON out, exit codes. Its
# own package: a tool's dependencies stay out of the library's.
[package]
namespace   = "hanim.timeline"
name        = "tool"
version     = "0.1.0"
description = "The hanim-timeline command: timelines checked, read at a moment, edited and edits taken back, headless"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "product: the hanim-timeline command"
kind = "tool"
reexports = ["mlibs.agent"]  # what its interface re-exports (lint module-closure)
agent = "tool"

[targets.hanim-timeline-tool]
kind = "lib"

[targets.hanim-timeline]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/catalog/*.cppm"]

[dependencies]
# The command is the subject `timeline` behind the tool kernel's entries (mlibs.agent:host, T0).
mlibs.agent      = { path = "../../../../base/agent" }
mlibs.json       = { path = "../../../../base/json" }
openlifa.openas  = "0.2.0"
hanim.timeline   = { path = ".." }
mlibs.utils      = { path = "../../../../base/utils" }
mcpplibs.os      = "0.4.4"
nlohmann.json    = "3.12.0"

# The declared data kinds this package owns (mlibs.xdef registry, D-209): each kind and its major
# version, and the define module a data module imports each from (none: only tools write it).
[package.metadata.openmui.xdef]
kinds = { history = 1 }
