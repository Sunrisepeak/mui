# omui.generate — runtime generation as an application ships (D-144): interface
# an Agent makes while the application runs, put into the surfaces the
# application declares, stage by stage; A2UI as an input format. A package of
# its own (D-161's T0.5): it is a capability of the product that takes view
# documents (omui.viewdoc), where the agent endpoint (omui.agent) takes none —
# held together they made the endpoint depend on documents, and documents'
# tests on the endpoint (red list 44).
[package]
namespace   = "omui"
name        = "generate"
version     = "0.1.0"
description = "Runtime generation: drafts for declared surfaces, validated, previewed, committed as versions; A2UI as an input"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"
agent = { part = "omui.agent" }

[targets.omui-generate]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
omui.core     = { path = "../core" }
omui.view     = { path = "../view" }
omui.semantic = { path = "../semantic" }
omui.viewdoc  = { path = "../viewdoc" }
# The protocol's types, the generate.* catalog and background tasks.
omui.agent    = { path = "../agent" }
mlibs.utils   = { path = "../../../base/utils" }
mlibs.control = { path = "../../../base/control" }
mcpplibs.os   = "0.4.4"

[dev-dependencies]
mcpplibs.mtest = "0.5.2"
omui.ui.base = { path = "../components/base" }
