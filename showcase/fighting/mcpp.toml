# The fighting game (D-85 §8.7; its name to come): gongfu's match on
# openmui's stage — played from the keyboard or by an agent, drawn in 2D by
# gongfu.present2d, with a training mode's tools. Fighters are data files
# (fighters/*.fighter.gongfu.toml), carried in the program.
[package]
namespace   = "openmui.showcase"
name        = "fighting"
version     = "0.1.0"
description = "The fighting game: gongfu's deterministic rollback match on openmui's stage, played from the keyboard or by an agent, with a training mode"
license     = "Apache-2.0"

[package.metadata.openmui]
kind      = "showcase"
contracts = ["contract/*.contract.omui.toml"]

[targets.openmui-showcase-fighting]
kind = "lib"

[targets.omui-fight]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
openmui.sdk      = { path = "../.." }
gongfu.data      = { path = "../../mgame/gongfu/data" }
gongfu.present2d = { path = "../../mgame/gongfu/present2d" }
gongfu.training  = { path = "../../mgame/gongfu/training" }

[build-dependencies]
openmui.rules = { path = "../../mcpp/rules", host-module = true }
gongfu.rules  = { path = "../../mgame/gongfu/rules", host-module = true }

[dev-dependencies]
openmui.testing = { path = "../../modules/base/testing" }
