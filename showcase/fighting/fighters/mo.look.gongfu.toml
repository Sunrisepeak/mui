# 墨 (Mo), the calligrapher: how she looks and how her hits feel (gongfu characters
# design §3.3; the fighting game's quality design §3, §5). A paper-white robe to
# the knees with a dark cross-collar, wide sleeves that hang and trail, a
# vermilion sash whose ends follow her, a high bun with a hairpin and a strand
# loose at her cheek, dark trousers and soft shoes; the brush that is her reach.
# Lit by the stage's light (a shadow away from it, a rim toward it). Ink for every
# spark, vermilion for a counter, a KO that turns the picture to its negative.
# Angles are degrees, counter-clockwise; keys by frame. In a bone's frame x runs
# along it and y across: for a bone pointing up, +y is her back.
gongfu = "0.1"
name = "mo"
outline = { color = "#101114", width = 2.5 }
accent = "#c0392b"
art_scale = 0.36
light = { from = [-0.62, -0.78], shade = 0, darken = 0.3, shadow = "#2a2230", rim = 0, rim_color = "#fff6e6aa" }

[[palette]]
name = "ink"
robe = "#efe8da"
sash = "#c0392b"
skin = "#e7d3bc"
hair = "#16181d"
shaft = "#5b3a24"
bristle = "#101114"
trim = "#26282f"
pin = "#d4af37"
trousers = "#2b2d34"

[[palette]]
name = "indigo"
robe = "#2b3a67"
sash = "#d9a441"
