# openmui — the umbrella package, and the workspace of every openmui member.
#
# The repository root is the package users name (`openmui`): its module
# re-exports the runtime, the base components and the default theme; the
# entries are packages under src/entry (the player's: src/entry/player). Each
# member below has its own mcpp.toml and depends on others only by `path`, so
# any of them can move to its own repository (D-41).
[package]
namespace   = "openmui"
name        = "sdk"
version     = "0.1.0"
description = "openmui: an open UI specification and its reference implementation in C++ modules"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[workspace]
members = [
    "tests/support",
    "tests/cts",
    "spec",
    "modules/geom",
    "modules/memory",
    "modules/anim",
    "modules/layout",
    "modules/unicode",
    "modules/fuzzy",
    "modules/raster",
    "modules/image",
    "modules/render",
    "modules/text",
    "modules/record",
    "modules/trace",
    "modules/pipeline",
    "modules/markdown",
    "runtime/core",
    "runtime/expr",
    "runtime/view",
    "runtime/viewdoc",
    "runtime/semantic",
    "runtime/agent",
    "runtime/native",
    "runtime/theme",
    "themes/default",
    "themes/compact",
    "natives/fuzzy",
    "runtime/abi",
    "runtime/player",
    "hosts/headless",
    "hosts/sdl3",
    "components/base",
    "lang/common",
    "lang/lua",
    "lang/js",
    "lang/python",
    "components/markdown",
    "tools/gen",
    "tools/omui",
    "tools/inspector",
    "mcpp/rules",
    "tests/rules",
    "tests/bench",
    "tests/features",
    "src/entry/player",
    "src/entry/python",
    "examples/01-hello-im",
    "examples/02-hello-ts",
    "examples/03-counter",
    "examples/05-contrast",
    "examples/06-theming",
    "examples/07-headless-and-agent",
    "examples/08-markdown-viewer",
    "examples/09-markdown-stream",
]

# Sanitizers (plan §19.1 "内存"): AddressSanitizer and UndefinedBehavior-
# Sanitizer over every unit of the graph, the first finding fatal. CI runs
# `mcpp test --workspace --profile sanitize` nightly on Linux.
[workspace.profile.sanitize]
opt      = 1
debug    = true
cflags   = ["-fsanitize=address,undefined", "-fno-omit-frame-pointer", "-fno-sanitize-recover=all"]
cxxflags = ["-fsanitize=address,undefined", "-fno-omit-frame-pointer", "-fno-sanitize-recover=all"]
ldflags  = ["-fsanitize=address,undefined"]

[workspace.package]
standard = "c++23"
mcpp     = ">=2026.10.26.1"

# MinGW GCC 16 emits the function-local statics of inline standard-library
# functions instantiated in module units (std::variant's __reasons,
# make_shared's type tag) as strong symbols, so two units of one program define
# them twice. The definitions are identical; the linker keeps one.
[workspace.target.x86_64-windows-gnu.build]
ldflags = ["-Wl,--allow-multiple-definition"]
# HarfBuzz's amalgamated unit exceeds COFF's 2^15 sections under GCC; the big
# object format lifts the limit. Graph-wide, so it reaches that dependency.
dialect_cxxflags = ["-Wa,-mbig-obj"]

[targets.openmui]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
openmui.core          = { path = "runtime/core" }
openmui.view          = { path = "runtime/view" }
openmui.semantic      = { path = "runtime/semantic" }
openmui.agent         = { path = "runtime/agent" }
openmui.expr          = { path = "runtime/expr" }
openmui.viewdoc       = { path = "runtime/viewdoc" }
openmui.trace         = { path = "modules/trace" }
openmui.ui.base       = { path = "components/base" }
openmui.host.headless = { path = "hosts/headless" }
openmui.host.sdl3     = { path = "hosts/sdl3" }
mcpplibs.os           = "0.1.2"

# The root package has no test programs of its own: tests/ holds members
# (tests/support, and the cross-member suites), each discovered by itself.
[test]
discover = []
