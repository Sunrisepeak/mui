# 坤 (Kun), the cold idol: how he looks and how his hits feel (the hardcore combat
# design §5). An original character on an internet meme's signs — a clean centre
# part, a white shirt with rolled sleeves, grey suspender trousers, white-and-gold
# high-tops, a basketball — drawn completely straight: cold, quiet, precise.
# Bajiquan close-range bursts on a dancer's footwork; the ball comes out only for
# his specials and supers. Angles are degrees, counter-clockwise; keys by frame.
