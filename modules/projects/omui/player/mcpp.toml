# omui.player — the player (component-binding §10.2): what a script-first
# application runs in. It defines the manifest's component documents, mounts
# its view documents, runs its scripts in the languages registered with it
# (modules/projects/omui/lang/js …, plugins over the C ABI), and reloads what changes on
# disk in place: a view keeps its nodes, a script its signals.
[package]
namespace   = "omui"
name        = "player"
version     = "0.1.0"
description = "openmui's player: an application's views, components and scripts, run and reloaded in place"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
maturity = "stable"  # release plan §2.1: stable, preview or experimental (lint maturity)
separate = "library: the player that runs a script application"
kind = "runtime"
agent = { part = "omui.agent" }

[targets.openmui-player]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp"]

[dependencies]
omui.core    = { path = "../core", version = "0.1.0" }
omui.view    = { path = "../view", version = "0.1.0" }
omui.viewdoc = { path = "../viewdoc", version = "0.1.0" }
omui.abi     = { path = "../abi", version = "0.1.0" }
omui.theme   = { path = "../theme", version = "0.1.0" }
omui.semantic = { path = "../semantic", version = "0.1.0" }
mlibs.utils   = { path = "../../../base/utils", version = "0.1.0" }
# The saved files' notice (fs::watcher): a reload looks only when the system says something changed.
mcpplibs.os   = "0.4.4"

[dev-dependencies]
# Tests are mtest's (D-147).
mcpplibs.mtest     = "0.8.4"
mlibs.image        = { path = "../../../base/image", version = "0.1.0" }
omui.ui.base       = { path = "../components/base", version = "0.1.0" }
omui.host.headless = { path = "../host/headless", version = "0.1.0" }
