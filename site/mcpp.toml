# openmui's website (D-84 §6.6): the framework's thesis shown, not told —
# one semantic tree, many renderings. Places in a bar (the home, every
# component live, the docs in English and 中文, example 01 beside its
# source, a live timeline editor), each a page in the site's own theme; a
# lens moving the same page from its pixels to the semantic tree's
# wireframe, the JSON an agent reads and the assertions a test writes; the
# tree's hash in your browser beside CI's. Built for the Web (dist-toy's
# package, which a Pages subpath serves as it is), its places pre-rendered to
# static HTML from the same documents so a reader without JavaScript and a
# search engine see them.
#
#   mcpp run -p openmui.site                       the site in a window
#   mcpp run -p openmui.site -- --prerender out/index.html   its places into a packed page
[package]
namespace   = "openmui"
name        = "site"
version     = "0.1.0"
description = "omui's website: the implementation of the openmui specification, one tree and many renderings"
license     = "Apache-2.0"
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind      = "site"
contracts = ["contract/*.contract.omui.toml"]

[targets.openmui-site]
kind = "lib"

[targets.omui-site]
kind = "bin"
main = "src/main.cpp"

[build]
sources  = ["src/*.cppm", "src/*.cpp"]
cxxflags = ["-ffp-contract=off", "-fno-fast-math"]

[target.'cfg(not(os = "emscripten"))'.build]
sources = ["src/targets/native.cppm"]

[target.'cfg(os = "emscripten")'.build]
sources = ["src/targets/web.cppm"]

[dependencies]
openmui.sdk         = { path = "../modules/projects/omui/sdk" }
openmui.view        = { path = "../modules/projects/omui/view", features = ["hanim"] }
# The site also authors Hanim programs directly. Declared here as well because
# mcpp does not yet apply openmui.view's [feature-deps.hanim] when the view is
# selected together with this package (the Web row: -p openmui.view -p openmui.site).
hanim               = { path = "../modules/projects/hanim", default-features = false, features = ["engine", "render-vector"] }
openmui.ui.markdown = { path = "../modules/projects/omui/components/markdown" }
openmui.ui.timeline = { path = "../modules/projects/omui/components/timeline" }
xengine.timeline    = { path = "../modules/projects/xengine/timeline" }  # the monitor: what plays at the playhead
"openmui.theme.styles" = { path = "../modules/projects/omui/theme/styles" }
"openmui.theme"      = { path = "../modules/projects/omui/theme" }
openmui.example.hello-im       = { path = "../examples/01-hello-im" }  # getting started: example 01, running beside its source
openmui.semantic    = { path = "../modules/projects/omui/semantic" }
mlibs.utils       = { path = "../modules/base/utils" }
openmui.inspector   = { path = "../tools/inspector" }
mcpplibs.os         = "0.2.2"

[build-dependencies]
openmui.build.contracts = { path = "../mcpp/contracts", host-module = true }
openmui.build.embed     = { path = "../mcpp/embed", host-module = true }
openmui.build.toy       = { path = "../mcpp/toy", host-module = true }

[dev-dependencies]
xrender.text = { path = "../modules/projects/xrender/text" }
mlibs.math = { path = "../modules/base/math" }
