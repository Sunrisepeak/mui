# mlibs.image — images in memory, PNG encoding and decoding (libpng's
# simplified API, imported as the C++ module mcpplibs.mwrap.libpng over
# compat.libpng and compat.zlib from mcpp-index) and WebP encoding and
# decoding, still and animated (libwebp, imported as mcpplibs.mwrap.libwebp over
# compat.libwebp; its demux and mux features for WebPAnimDecoder and
# WebPAnimEncoder), and JPEG encoding and decoding (libjpeg-turbo's TurboJPEG
# API, imported as mcpplibs.mwrap.libjpeg_turbo, which vendors the library and
# builds its C code without the SIMD extensions).
# libpng 1.6.43: the version compat.freetype (under HarfBuzz) requires, so
# one libpng serves the whole graph. libwebp 1.5.0 is built without threads:
# the native unit makes its one-time setup safe (src/native/webp.cpp).
[package]
namespace   = "mlibs"
name        = "image"
version     = "0.1.0"
description = "Image buffers, premultiplication, PNG, APNG, WebP (still and animated) and JPEG encode and decode"
license     = "Apache-2.0"
platforms   = ["linux", "macos", "windows", "emscripten"]
repo        = "https://github.com/Sunrisepeak/mui"

[package.metadata.openmui]
kind = "runtime"

[targets.mlibs-image]
kind = "lib"

[build]
sources = ["src/*.cppm", "src/*.cpp", "src/native/*.cpp"]

[dependencies]
mcpplibs.mwrap.libpng = "1.6.43"
mcpplibs.mwrap.libjpeg_turbo = "3.2.1"
mcpplibs.mwrap.libwebp = { version = "1.5.0", features = ["demux", "mux"] }

[dev-dependencies]
mcpplibs.mtest = "0.8.4"
mlibs.utils = { path = "../utils" }
